<!-- HLGB v91.51 READ-ONLY PAYROLL + HUB DIAGNOSTIC -->
<script>
(function(){

const V951='91.51';

const esc951=s=>String(s??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]||c));
function rowData951(r){
  if(!r||typeof r!=='object')return null;
  let d=r.data??r.payload??r.value??r.record??null;
  if(typeof d==='string'){try{d=JSON.parse(d)}catch(e){}}

function snapMap951(module){try{return hlgbRecordSnapshots?.[module] instanceof Map?hlgbRecordSnapshots[module]:null}catch(e){return null}}

function realized951(x){return String(x?.status||'').toLowerCase()==='realizado'||x?.realized===true}

  const mods=(()=>{try{return Array.isArray(HLGB_RECORD_MODULES)?HLGB_RECORD_MODULES:[]}catch(e){return []}})();

  for(const m of mods){

  if(hs)for(const r of hs.values()){if(r?.deleted_at){hubDeleted++;continue}const d=rowData951(r);if(d)rawHub.push({meta:r,data:d})}

    payroll:{loaded:payLocal.length,loadedPaid:localPaid.length,rawActive:rawPay.length,rawPaid:rawPaid.length,rawDeleted:payDeleted,loadedPaidRows:clone951(localPaid),rawPaidRows:rawPaid.map(x=>clone951(x.data)),rawSnapshotKeys:rawKeys},

 b.innerHTML=`<b>🔎 Diagnóstico v91.51 — somente leitura</b><br><span style="font-size:11px">Nenhum dado é alterado por esta tela.</span><hr style="border:0;border-top:1px solid #eee;margin:8px 0"><b>Folha</b><br>Carregado: <b>${p.loaded}</b> · PAGO carregado: <b>${p.loadedPaid}</b><br>Snapshot bruto da nuvem: <b>${p.rawActive}</b> ativo(s) · PAGO bruto: <b>${p.rawPaid}</b> · apagado(s): <b>${p.rawDeleted}</b><br><div style="margin-top:6px;padding:7px;background:#faf7f9;border-radius:8px">${pnames}</div><hr style="border:0;border-top:1px solid #eee;margin:8px 0"><b>Hub Financeiro</b><br>Carregado: <b>${h.loaded}</b> · Realizado carregado: <b>${h.loadedRealized}</b><br>Snapshot bruto da nuvem: <b>${h.rawActive}</b> ativo(s) · Realizado bruto: <b>${h.rawRealized}</b> · apagado(s): <b>${h.rawDeleted}</b><hr style="border:0;border-top:1px solid #eee;margin:8px 0"><b>Divergências de contagem</b><br>${divs.length?divs.slice(0,20).map(x=>`${esc951(x.module)}: nuvem ${x.active} / tela ${x.loaded}`).join('<br>'):'Nenhuma divergência de contagem detectada.'}<div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:10px"><button type="button" onclick="hlgb9151RunDiagnostic()">Atualizar diagnóstico</button><button type="button" onclick="this.closest('#hlgb951Diag').remove()">Fechar</button></div>`;
 try{localStorage.setItem('hlgb_v9151_readonly_report',JSON.stringify(r))}catch(e){}

}
window.hlgb9151RunDiagnostic=function(){try{const r=analyze951();render951(r);return r}catch(e){const b=box951();b.innerHTML=`<b>🔎 Diagnóstico v91.51</b><br>Não foi possível ler o snapshot ainda.<br><small>${esc951(e?.message||e)}</small><br><button type="button" style="margin-top:8px" onclick="hlgb9151RunDiagnostic()">Tentar novamente</button>`;return null}};
function launch951(n=0){

}
setTimeout(()=>launch951(0),1200);
})();
</script>
