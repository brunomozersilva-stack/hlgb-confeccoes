<script>

function pushSource949(out,name,obj,stamp='',strength=1){if(!obj||typeof obj!=='object')return;let base=obj;if(base.local&&typeof base.local==='object')base=base.local;const payroll=Array.isArray(base.payroll)?base.payroll:[];const hub=Array.isArray(base.hubFinanceEntries)?base.hubFinanceEntries:[];if(payroll.length||hub.length)out.push({name,stamp:stamp||obj.savedAt||obj.at||obj.updatedAt||'',strength,payroll:clone949(payroll),hub:clone949(hub)})}
function capture949(){

 try{for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(!k||!safeKey949(k)||[MAIN949,PENDING949,CONFLICT949,PRE948,FORENSIC949,REPORT949,JOURNAL949].includes(k))continue;const v=read949(k);if(!v||typeof v!=='object')continue;pushSource949(out,'Backup '+k,v,v.savedAt||v.at||v.updatedAt||'',2)}}catch(e){}
 const compact={capturedAt:now949(),sources:out.map(s=>({name:s.name,stamp:s.stamp,strength:s.strength,payroll:s.payroll,hub:s.hub}))};try{localStorage.setItem(FORENSIC949,JSON.stringify(compact))}catch(e){console.warn('HLGB v91.49 snapshot forense',e)}return out
}
const EARLY949=capture949();
function id949(x){return String(x?.id??x?.__hlgbId??'')}

function date949(v){const t=Date.parse(String(v||''));return Number.isFinite(t)?t:0}
function currentPayroll949(b){const arr=Array.isArray(db?.payroll)?db.payroll:[];const bid=id949(b);if(bid){const exact=arr.find(x=>id949(x)===bid);if(exact)return exact}const k=payKey949(b);return k?arr.find(x=>payKey949(x)===k)||null:null}
function currentHub949(b){const bid=id949(b);return bid?(db?.hubFinanceEntries||[]).find(x=>id949(x)===bid)||null:null}
function snap949(module,row){try{const rid=id949(row);return rid?hlgbRecordSnapshots?.[module]?.get(rid)||null:null}catch(e){return null}}
function evidence949(s,b){let score=+s.strength||0;if(b?.paid===true)score+=3;if(b?.paidAt)score+=2;if((+b?.paidValue||0)>0)score+=1;if(id949(b))score+=1;if(payKey949(b))score+=1;return score}
function payrollCandidates949(sources){const best=new Map();for(const s of sources||[]){for(const b of s.payroll||[]){if(!b||b.paid!==true)continue;const cur=currentPayroll949(b);if(!cur||cur.paid===true)continue;const key=id949(cur)||payKey949(cur);if(!key)continue;const score=evidence949(s,b),prev=best.get(key);const cand={source:s.name,sourceStamp:s.stamp||'',score,backup:clone949(b),current:clone949(cur),targetId:id949(cur)};if(!prev||score>prev.score||(score===prev.score&&date949(b.paidAt)>date949(prev.backup.paidAt)))best.set(key,cand)}}return [...best.values()].sort((a,b)=>String(a.backup.month||'').localeCompare(String(b.backup.month||''))||String(a.backup.employeeName||'').localeCompare(String(b.backup.employeeName||''),'pt-BR'))}
function hubCandidates949(sources){const best=new Map();for(const s of sources||[]){for(const b of s.hub||[]){if(!b||!id949(b))continue;const cur=currentHub949(b),key=id949(b);let should=false,score=+s.strength||0;if(!cur){should=true;score+=4}else{const bu=date949(b.updatedAt||b.realizedAt||s.stamp),cu=date949(cur.updatedAt||snap949('hubFinanceEntries',cur)?.updated_at);if(bu&&bu>cu){should=true;score+=4}if(b.status==='Realizado'&&cur.status!=='Realizado'&&b.realizedAt){should=true;score+=3}}if(!should)continue;const prev=best.get(key),cand={source:s.name,sourceStamp:s.stamp||'',score,backup:clone949(b),current:clone949(cur),targetId:key};if(!prev||score>prev.score)best.set(key,cand)}}return [...best.values()]}
async function ready949(){if(typeof cloudEnsureFreshSession==='function')await cloudEnsureFreshSession(false);if(typeof hlgbRecordReady!=='undefined'&&!hlgbRecordReady&&typeof hlgbEnsureRecordsOnlineAfterLogin==='function')await hlgbEnsureRecordsOnlineAfterLogin();if(typeof hlgbRecordSaveWithRetry!=='function'||typeof hlgbRecordReady==='undefined'||!hlgbRecordReady)throw new Error('A nuvem por registro ainda não está pronta.')}
function journal949(entry){try{let a=read949(JOURNAL949);a=Array.isArray(a)?a:[];a.push({...entry,at:now949()});if(a.length>300)a=a.slice(-300);localStorage.setItem(JOURNAL949,JSON.stringify(a))}catch(e){}}
async function save949(module,targetId,data,label,source){const before=module==='payroll'?currentPayroll949({id:targetId}):currentHub949({id:targetId});journal949({module,id:String(targetId),label,source,status:'attempt',before:clone949(before),after:clone949(data)});const out=await hlgbRecordSaveWithRetry(module,String(targetId),clone949(data),false);if(!out||out.applied!==true)throw new Error('Supabase não confirmou '+module+'/'+targetId);const arr=Array.isArray(db[module])?db[module]:[];let i=arr.findIndex(x=>id949(x)===String(targetId));if(i<0&&module==='payroll')i=arr.findIndex(x=>payKey949(x)===payKey949(data));if(i>=0)arr[i]=clone949(out.data||data);else arr.push(clone949(out.data||data));db[module]=arr;try{localSaveOnly()}catch(e){}journal949({module,id:String(targetId),label,source,status:'confirmed',after:clone949(out.data||data)});return out}
function makePayNext949(c){const cur=clone949(c.current),b=c.backup;let value=+b.paidValue||0;if(!value){try{const e=(db.employees||[]).find(x=>String(x.id)===String(cur.employeeId))||{};value=+payrollCalc(cur,e).net||0}catch(e){}}return {...cur,paid:true,paidAt:b.paidAt||String(c.sourceStamp||'').slice(0,10)||new Date().toISOString().slice(0,10),paidValue:value,updatedAt:now949(),recoveredBy:'v91.49',recoveredAt:now949(),recoverySource:c.source}}
async function reload949(){if(typeof hlgbRecordLoadBundle==='function')await hlgbRecordLoadBundle({preserveLocal:false,since:null});try{localSaveOnly()}catch(e){}try{renderAll()}catch(e){try{renderPayroll();renderHubFinance()}catch(_){}}}
function show949(report){let box=document.getElementById('hlgb949Box');if(!box){box=document.createElement('div');box.id='hlgb949Box';box.style.cssText='position:fixed;right:14px;bottom:14px;z-index:10000;max-width:480px;background:#fff;border:1px solid #d8c5cf;border-radius:14px;padding:12px 14px;box-shadow:0 6px 24px #0003;font-size:12px;line-height:1.4';document.body.appendChild(box)}const pay=report.payroll||[],hub=report.hub||[],err=report.errors||[];const names=pay.slice(0,8).map(x=>`${x.employee||'Funcionário'} (${x.month||'-'})`).join('<br>');box.innerHTML=`<b>🛟 Recuperação v91.49</b><br><b>${pay.length}</b> pagamento(s) restaurado(s) na folha · <b>${hub.length}</b> alteração(ões) restaurada(s) no Hub${err.length?`<br><span style="color:#9a1f32">${err.length} erro(s) de confirmação — nada foi considerado recuperado sem confirmação.</span>`:''}${names?`<div style="margin-top:6px;max-height:120px;overflow:auto">${names}</div>`:''}<div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:8px"><button type="button" onclick="hlgb9149RecoverNow(true)">Reexecutar recuperação</button><button type="button" onclick="this.closest('#hlgb949Box').remove()">Fechar</button></div>`}
let busy949=false;
window.hlgb9149RecoverNow=async function(manual=false){if(busy949)return;busy949=true;const report={version:V949,startedAt:now949(),sources:[],candidates:{payroll:0,hub:0},payroll:[],hub:[],errors:[]};try{await ready949();try{if(typeof hlgbRecordLoadBundle==='function')await hlgbRecordLoadBundle({preserveLocal:false,since:null})}catch(e){report.errors.push('Leitura inicial: '+String(e?.message||e))}const sources=[...EARLY949];for(const s of capture949())sources.push(s);report.sources=[...new Set(sources.map(s=>s.name))];const pc=payrollCandidates949(sources),hc=hubCandidates949(sources);report.candidates.payroll=pc.length;report.candidates.hub=hc.length;for(const c of pc){try{const next=makePayNext949(c);await save949('payroll',c.targetId,next,`${next.employeeName||'Funcionário'} — ${next.month||''}`,c.source);report.payroll.push({id:c.targetId,employee:next.employeeName||'',month:next.month||'',paidAt:next.paidAt||'',paidValue:+next.paidValue||0,source:c.source})}catch(e){report.errors.push(`Folha ${c.backup?.employeeName||c.targetId}: ${String(e?.message||e)}`)}}for(const c of hc.filter(x=>x.score>=5)){try{const next=c.current?{...c.current,...c.backup,recoveredBy:'v91.49',recoveredAt:now949()}:{...c.backup,recoveredBy:'v91.49',recoveredAt:now949()};await save949('hubFinanceEntries',c.targetId,next,next.description||next.name||'Hub Financeiro',c.source);report.hub.push({id:c.targetId,label:next.description||next.name||'',source:c.source})}catch(e){report.errors.push(`Hub ${c.targetId}: ${String(e?.message||e)}`)}}await reload949();report.finishedAt=now949();try{localStorage.setItem(REPORT949,JSON.stringify(report))}catch(e){}try{setCloudStatus(report.errors.length?'☁️ Recuperação parcial':'✅ Dados recuperados e confirmados',report.errors.length?'bad':'ok')}catch(e){}show949(report);console.info('HLGB v91.49 recovery report',report)}catch(e){report.errors.push(String(e?.message||e));report.finishedAt=now949();try{localStorage.setItem(REPORT949,JSON.stringify(report
