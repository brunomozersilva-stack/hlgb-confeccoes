<!-- HLGB v91.33 EXPLICIT DELETE HARDENING -->
<script>
(function(){
 const C=v=>{try{return JSON.parse(JSON.stringify(v))}catch(e){return v}}, RID=(m,r,i=0)=>typeof hlgbRecordId==='function'?String(hlgbRecordId(m,r,i)):String(r?.id??('value:'+encodeURIComponent(String(r??''))));
 async function online(){if(!cloudAccessToken)throw Error('Sessão online necessária.');if(!hlgbRecordReady&&!await hlgbEnsureRecordsOnlineAfterLogin())throw Error('Nuvem indisponível.');}
 async function cloudDel(m,r,id){await online();id=String(id??RID(m,r));let p=(r&&typeof r==='object'&&!Array.isArray(r))?C(r):{value:C(r)};p.__hlgb_explicit_delete=true;let o=await hlgbRecordSaveWithRetry(m,id,p,true);if(!o?.applied)throw Error('Exclusão não confirmada: '+m);return id}
 async function cloudSave(m,r,id){await online();id=String(id??RID(m,r));let o=await hlgbRecordSaveWithRetry(m,id,C(r),false);if(!o?.applied)throw Error('Alteração não confirmada: '+m);return C(o.data??r)}
 function remove(m,id){id=String(id);let a=Array.isArray(db[m])?db[m]:[];db[m]=a.filter((x,i)=>RID(m,x,i)!==id)}
 function replace(m,id,r){id=String(id);db[m]=Array.isArray(db[m])?db[m]:[];let i=db[m].findIndex((x,n)=>RID(m,x,n)===id);if(i>=0)db[m][i]=C(r);else db[m].push(C(r))}
 function redraw(){try{localSaveOnly()}catch(e){}try{renderAll()}catch(e){}try{renderDash()}catch(e){}}
 async function one(m,r,msg,id){if(r==null)return false;if(msg&&!confirm(msg))return false;try{id=await cloudDel(m,r,id);remove(m,id);redraw();setCloudStatus('⚡ Online · exclusão confirmada','ok');return true}catch(e){console.error('v91.33 delete',m,e);setCloudStatus('☁️ Exclusão não confirmada','bad');alert('Nada foi excluído porque a nuvem não confirmou.\n\n'+(e?.message||e));return false}}
 async function batch(dels,updates=[]){let dd=[],uu=[];try{for(const d of dels){let id=await cloudDel(d.m,d.r,d.id);dd.push({...d,id})}for(const u of updates){let data=await cloudSave(u.m,u.next,u.id);uu.push({...u,data})}}catch(e){for(const u of uu.reverse())try{await cloudSave(u.m,u.old,u.id)}catch(_){}for(const d of dd.reverse())try{await cloudSave(d.m,d.r,d.id)}catch(_){}throw e}dd.forEach(d=>remove(d.m,d.id));uu.forEach(u=>replace(u.m,u.id,u.data));redraw()}
 const byId=(m,id)=>(db[m]||[]).find(x=>String(x?.id)===String(id));
 window.del=async function(m,id){let a=db[m]||[],i=a.findIndex((x,n)=>RID(m,x,n)===String(id)||String(x?.id??'')===String(id));if(i<0)return alert('Registro não encontrado.');let r=a[i],eid=RID(m,r,i);if(await one(m,r,'Excluir este registro?',eid))try{auditAction('Excluiu registro',m+' — '+eid)}catch(e){}};
 window.delMaterial=id=>one('materials',byId('materials',id),'Excluir este material?');
 window.deleteEmployee=id=>{let r=byId('employees',id);return one('employees',r,r?`Excluir o cadastro de ${r.name}? O histórico da folha será preservado.`:null)};
 window.deleteTermination=id=>one('terminations',byId('terminations',id),'Excluir esta rescisão?');
 window.deleteGoal=id=>one('goals',byId('goals',id),'Excluir esta meta?');
 window.deleteOperationalCost=id=>one('operationalCosts',byId('operationalCosts',id),'Excluir este custo operacional?');
 window.deleteMissingPiece=id=>one('missingPieces',byId('missingPieces',id),'Excluir este registro de peça faltante?');
 window.deleteFactionPayment=id=>one('factionPayments',byId('factionPayments',id),'Excluir este lançamento de pagamento?');
 window.deleteSupplier=id=>{let r=byId('suppliers',id);return one('suppliers',r,r?`Excluir o fornecedor ${r.name}?`:null)};
 window.deleteFinanceEntry=id=>{let r=byId('finance',id);return one('finance',r,r?`Excluir "${r.desc||'lançamento'}" no valor de ${money(r.value||0)}?`:null)};
 window.deleteAsset=id=>one('assets',byId('assets',id),'Excluir este bem do inventário?');
 window.deleteDefectReturn=id=>one('defectReturns',byId('defectReturns',id),'Excluir este registro de devolução/defeito?');
 window.deleteEmployeeAdvance=id=>{let r=byId('employeeAdvances',id);if(r?.status==='Pago')return alert('Este vale já foi pago. Corrija pela folha do mês.');return one('employeeAdvances',r,'Excluir este vale solicitado?')};
 window.deleteColor=i=>{let r=(db.colors||[])[i];return one('colors',r,'Excluir esta cor do cadastro?','value:'+encodeURIComponent(String(r)))};
 window.deleteSize=i=>{let r=(db.sizes||[])[i];return one('sizes',r,'Excluir este tamanho do cadastro?','value:'+encodeURIComponent(String(r)))};
 window.deleteServiceType=id=>{let r=byId('serviceTypes',id);if(!r)return;let used=(db.factionMasters||[]).some(f=>(f.serviceTypeIds||[]).some(x=>+x===+id));if(used)return alert('Este tipo está vinculado a uma facção. Retire o vínculo antes de excluir.');return one('serviceTypes',r,'Excluir este tipo de serviço?')};
 window.deleteMachine=id=>{let r=byId('machines',id);if(!r)return;let used=(db.factionMasters||[]).some(f=>(f.machineIds||[]).some(x=>+x===+id));if(used)return alert('Esta máquina está vinculada a uma facção. Retire o vínculo antes de excluir.');return one('machines',r,'Excluir esta máquina?')};
 window.delFactionMaster=id=>{let r=byId('factionMasters',id);if(!r)return;let used=(db.factions||[]).some(x=>+x.factionMasterId===+id||+x.masterId===+id)||(db.production||[]).some(x=>+x.factionId===+id);if(used)return alert('Esta facção possui histórico vinculado e não será apagada.');return one('factionMasters',r,'Excluir esta facção?')};
 window.delProductionLocation=id=>{let r=byId('productionLocations',id);if(!r)return;let used=(db.production||[]).some(x=>+x.productionLocationId===+id)||(db.capacityAssignments||[]).some(x=>+x.locationId===+id)||(db.factionMasters||[]).some(x=>+x.productionLocationId===+id);if(used)return alert('Este local possui vínculos. Edite e marque como Inativo para preservar o histórico.');return one('productionLocations',r,'Excluir este local?')};
 window.deletePurchase=function(id){let p=byId('purchases',id);if(!p)return;openModal('Confirmar exclusão da nota',`<div class="panel"><h3>${esc(p.supplierName||'Nota de compra')}</h3><div>${money(p.total||0)}</div><div class="sub">Só será excluída após confirmação do banco.</div></div><button class="danger modalSave">Excluir definitivamente</button>`,async()=>{let f=(db.finance||[]).filter(x=>String(x.purchaseId||'')===String(id)||String(x.sourcePurchaseId||'')===String(id)),b=document.querySelector('#modal .modalSave');if(b)b.disabled=true;try{await batch([...f.map(r=>({m:'finance',r,id:String(r.id)})),{m:'purchases',r:p,id:String(p.id)}]);closeModal()}catch(e){if(b)b.disabled=false;alert('A nota foi preservada porque o pacote não foi confirmado.')}})};
 window.deleteReadyCut=async function(id){let c=byId('cuts',id);if(!c||!confirm('Excluir este corte pronto e a produção vinculada?'))return;let ps=(db.production||[]).filter(p=>+p.cutId===+id),o=byId('orders',c.orderId),ups=[];if(o&&String(o.status||'').toLowerCase()==='corte finalizado')ups.push({m:'orders',id:String(o.id),old:C(o),next:{...C(o),status:'Aguardando corte'}});try{await batch([{m:'cuts',r:c,id:String(c.id)},...ps.map(r=>({m:'production',r,id:String(r.id)}))],ups)}catch(e){alert('O corte foi preservado porque o pacote não foi confirmado.')}};
 window.deleteOpenMerchandise=async function(id){let o=byId('orders',id);if(!o||!confirm('Excluir este pedido e os vínculos de corte/produção/financeiro?'))return;let cs=(db.cuts||[]).filter(x=>+x.orderId===+id),ps=(db.production||[]).filter(x=>+x.orderId===+id||cs.some(c=>+c.id===+x.cutId)),fs=(db.finance||[]).filter(x=>+x.orderId===+id);try{await batch([...fs.map(r=>({m:'finance',r,id:String(r.id)})),...ps.map(r=>({m:'production',r,id:String(r.id)})),...cs.map(r=>({m:'cuts',r,id:String(r.id)})),{m:'orders',r:o,id:String(o.id)}])}catch(e){alert('O pedido foi preservado porque o pacote não foi confirmado.')}};
 window.deleteNote=async function(id){let o=byId('orders',id);if(!o)return;let paid=typeof orderPaid==='function'?orderPaid(o):0;if(!confirm(paid>0?`A nota tem ${money(paid)} recebido. Os recebimentos serão preservados. Excluir nota e cobrança?`:'Excluir nota e cobrança?'))return;let is=(db.invoices||[]).filter(x=>+x.orderId===+id),fs=(db.finance||[]).filter(x=>+x.orderId===+id&&x.type==='Receber'),n=C(o);n.invoiceReady=false;n.noteReady=false;['invoiceDate','dueDate','paymentTerms','invoiceNote','contactName','contactPhone'].forEach(k=>delete n[k]);try{await batch([...is.map(r=>({m:'invoices',r,id:String(r.id)})),...fs.map(r=>({m:'finance',r,id:String(r.id)}))],[{m:'orders',id:String(o.id),old:C(o),next:n}])}catch(e){alert('A nota foi preservada porque o pacote não foi confirmado.')}};
 const incoming=window.hlgbRenderIncomingRecord;window.hlgbRenderIncomingRecord=function(m){let r=incoming?incoming(m):false;try{let modal=document.getElementById('modal')?.classList.contains('show');if(!modal&&['employees','terminations','goals','operationalCosts','missingPieces','finance','purchases','assets','defectReturns','colors','sizes','materials','clients','cutters','factions'].includes(m))renderAll()}catch(e){}return r};
})();
</script>
