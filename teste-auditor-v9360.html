<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HLGB — Teste Auditor v93.60</title>
<style>
html,body{margin:0;height:100%;font-family:Arial,sans-serif;background:#f7f7f8}#bar{height:44px;display:flex;align-items:center;gap:12px;padding:0 14px;background:#fff;border-bottom:1px solid #ddd;box-sizing:border-box;font-size:14px}#state{font-weight:700}iframe{display:block;width:100%;height:calc(100% - 44px);border:0;background:#fff}
</style>
</head>
<body>
<div id="bar"><b>HLGB — ambiente de teste</b><span id="state">Carregando sistema da branch…</span></div>
<iframe id="app" src="./app-stable3.html?auditorTest=9360"></iframe>
<script>
(function(){
'use strict';
const frame=document.getElementById('app'),state=document.getElementById('state');
let running=false,finished=false,tries=0,authWindow=null,authDocument=null;
function setState(t){state.textContent=t}
function current(w,d){return frame.contentWindow===w&&frame.contentDocument===d&&d.readyState==='complete'}
function addScript(w,d,id,src,ready){
 if(ready())return Promise.resolve();
 return new Promise((resolve,reject)=>{
  if(!current(w,d)){reject(Error('Documento de teste substituído'));return}
  const existing=d.getElementById(id);
  if(existing)existing.remove();
  const script=d.createElement('script');script.id=id;script.src=src;
  let settled=false;
  const end=(err)=>{if(settled)return;settled=true;clearTimeout(timer);if(err){script.remove();reject(err)}else resolve()};
  const timer=setTimeout(()=>end(Error('Tempo esgotado carregando '+id)),10000);
  script.onload=()=>end(current(w,d)&&ready()?null:Error('API não ficou pronta: '+id));
  script.onerror=()=>end(Error('Falha de carregamento: '+id));
  (d.head||d.documentElement).appendChild(script);
 });
}
function legacyAuditorReady(w,d){
 return current(w,d)&&!!d.getElementById('loginScreen')&&!!d.getElementById('appShell')
  && !!w.hlgbInternalAuditor&&!!w.hlgbAuditorBlackbox9299&&!!w.hlgbOperationalAuditor9314
  &&typeof w.hlgbAuditorSingleUiReclaim9434A?.heal==='function'
  &&typeof w.hlgbAuditorSingleAction9429?.run==='function';
}
async function waitForApp(){
 if(running||finished)return;running=true;tries++;
 let error='';
 try{
  const w=frame.contentWindow,d=frame.contentDocument;
  if(legacyAuditorReady(w,d)){
   setState('Sistema carregado. Ativando Auditor v93.60…');
   if(authWindow!==w||authDocument!==d){authWindow=w;authDocument=d;w.__HLGB_AUTH_READY=true;w.dispatchEvent(new w.Event('hlgb:authenticated'))}
   await addScript(w,d,'hlgbAuditorSmart9360Script','./release-auditor-smart-v9360.js?fresh='+Date.now(),()=>w.HLGB_AUDITOR_SMART_9360===true&&typeof w.hlgbAuditorSmart?.run==='function');
   await addScript(w,d,'hlgbAuditorUiCompat9361Script','./release-auditor-ui-compat-v9361.js?fresh='+Date.now(),()=>!!w.HLGB_AUDITOR_UI_COMPAT_9361&&typeof w.hlgbAuditorUiCompat9361?.install==='function');
   if(!current(w,d))throw Error('Documento de teste substituído após carregamento');
   finished=true;setState('Auditor v93.60/93.61 carregado — TESTE');return;
  }
 }catch(e){error=String(e?.message||e);setState('Ativação pendente: '+error)}
 finally{running=false}
 if(tries<160)setTimeout(waitForApp,250);else{finished=true;setState('Módulos-base do Auditor não ficaram prontos'+(error?' · '+error:''))}
}
frame.addEventListener('load',()=>{if(!finished)setTimeout(waitForApp,300)});
setTimeout(waitForApp,900);
})();
</script>
</body>
</html>
