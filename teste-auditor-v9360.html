<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HLGB — Teste Auditor v93.60</title>
<style>
html,body{margin:0;height:100%;font-family:Arial,sans-serif;background:#f7f7f8}#bar{height:44px;display:flex;align-items:center;gap:12px;padding:0 14px;background:#fff;border-bottom:1px solid #ddd;box-sizing:border-box;font-size:14px}#state{font-weight:700}iframe{display:block;width:100%;height:calc(100% - 44px);border:0;background:#fff}
</style>
</head>
<body>
<div id="bar"><b>HLGB — ambiente de teste</b><span id="state">Carregando sistema da branch…</span></div>
<iframe id="app" src="./app-stable3.html?auditorTest=9360"></iframe>
<script>
(function(){
'use strict';
const frame=document.getElementById('app'),state=document.getElementById('state');
let injected=false,tries=0;
function setState(t){state.textContent=t}
function inject(){
  if(injected)return true;
  let w,d;
  try{w=frame.contentWindow;d=frame.contentDocument||w.document}catch(e){setState('Falha ao acessar a versão de teste.');return false}
  if(!d||!d.documentElement)return false;
  if(d.getElementById('hlgbAuditorSmart9360Script')){injected=true;setState('Auditor v93.60 carregado — TESTE');return true}
  const s=d.createElement('script');
  s.id='hlgbAuditorSmart9360Script';
  s.src='./release-auditor-smart-v9360.js?fresh='+Date.now();
  s.onload=()=>{injected=true;setState('Auditor v93.60 carregado — TESTE')};
  s.onerror=()=>setState('Não foi possível carregar o Auditor de teste.');
  (d.head||d.documentElement).appendChild(s);
  return true;
}
function waitForApp(){
  tries++;
  try{
    const d=frame.contentDocument||frame.contentWindow?.document;
    if(d?.getElementById('loginScreen')||d?.getElementById('appShell')){inject();return}
  }catch(e){}
  if(tries<120)setTimeout(waitForApp,250);else setState('Sistema carregou, mas o Auditor não foi injetado.')
}
frame.addEventListener('load',()=>{setState('Sistema carregado. Ativando Auditor v93.60…');setTimeout(waitForApp,200)});
setTimeout(waitForApp,800);
})();
</script>
</body>
</html>
