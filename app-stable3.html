<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HLGB Confecções</title><meta http-equiv="cache-control" content="no-cache,no-store,must-revalidate"><meta http-equiv="pragma" content="no-cache"><meta http-equiv="expires" content="0"></head><body><div style="font-family:Arial;padding:24px">Abrindo HLGB Confecções…</div><script>(async()=>{const ts=Date.now();const r=await fetch('./app9240.html?fresh='+ts,{cache:'no-store'});if(!r.ok)throw new Error('Falha ao carregar aplicação');let h=await r.text();let hasSession=false;try{let raw=localStorage.getItem('hlgb_supabase_auth_v1')||sessionStorage.getItem('hlgb_supabase_auth_v1');if(raw){const a=JSON.parse(raw);hasSession=!!String(a&&a.refresh_token||'').trim()}}catch(e){}if(hasSession){h=h.replace(/(<div id="sessionLoader" style="[^"]*)display:none;/,'$1display:flex;');h=h.replace(/(<div id="loginScreen" style="[^"]*)display:flex;/,'$1display:none;')}const files=['hotfix9241.js','release-current.js','release-pricing.js','release-limits.js','release-cut-view.js','release-notes.js'];const inj=files.map(f=>'<script src="./'+f+'?fresh='+ts+'"><\/script>').join('');const i=h.toLowerCase().lastIndexOf('</body>');h=i>=0?h.slice(0,i)+inj+h.slice(i):h+inj;document.open();document.write(h);document.close()})().catch(e=>{document.body.innerHTML='<div style="font-family:Arial;padding:24px"><h2>Não foi possível abrir o sistema</h2><p>'+String(e.message||e)+'</p><button onclick="location.reload()">Tentar novamente</button></div>'})</script></body></html>
