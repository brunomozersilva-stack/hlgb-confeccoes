 const gross=salary+transport+benefit+overtime+bonus+otherCredit;
 const discounts=absence+advance+purchase+union+otherDiscount+inss;
 return {salary,transport,benefit,otherCredit,overtime,bonus,absence,advance,purchase,union,otherDiscount,inss,gross,discounts,net:Math.max(0,gross-discounts)};
