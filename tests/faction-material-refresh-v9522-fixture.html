async function cloudRequest(path,opts){
 if(opts.method==='GET'){
  const search=new URLSearchParams(path.split('?')[1]||'');
  const module=String(search.get('module')||'').replace(/^eq\./,'');
  const id=String(search.get('entity_id')||'').replace(/^eq\./,'');
  const r=__remote[module]?.[id];return r?[structuredClone(r)]:[];
 }
 if(path==='rpc/hlgb_save_record'&&opts.method==='POST'){
  const b=JSON.parse(opts.body),r=__remote[b.p_module][b.p_entity_id];
  if(r.revision!==b.p_expected_revision)return {applied:false,revision:r.revision,data:r.data};
  __posts++;r.data=structuredClone(b.p_data);r.revision++;r.updated_at=new Date().toISOString();
  return {applied:true,data:r.data,revision:r.revision};
 }
 throw new Error('Unsupported fake request');
}
