<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HLGB Confecções</title><meta http-equiv="cache-control" content="no-cache,no-store,must-revalidate"><meta http-equiv="pragma" content="no-cache"><meta http-equiv="expires" content="0"></head><body><div style="font-family:Arial;padding:24px">Verificando a versão atual do HLGB…</div><script>(async()=>{const ts=Date.now();const r=await fetch('./release.json?fresh='+ts,{cache:'no-store'});if(!r.ok)throw new Error('Não foi possível consultar a versão atual');const rel=await r.json();if(!rel||!rel.entry)throw new Error('Manifesto de versão inválido');location.replace('./'+rel.entry+'?v='+encodeURIComponent(rel.version||'current')+'&fresh='+Date.now())})().catch(e=>{document.body.innerHTML='<div style="font-family:Arial;padding:24px"><h2>Não foi possível abrir o HLGB</h2><p>'+String(e.message||e)+'</p><button onclick="location.reload()">Tentar novamente</button></div>'})</script></body></html>
