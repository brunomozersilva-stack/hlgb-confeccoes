name: HLGB Auditor history persistence v95.08
on:
  pull_request:
    branches: [main]
    paths:
      - 'release-auditor-autocorrect-v9441.js'
      - 'tests/auditor-history-storage-v9508-browser.js'
      - '.github/workflows/auditor-history-storage-v9508.yml'
  push:
    branches: [main]
    paths:
      - 'release-auditor-autocorrect-v9441.js'
      - 'tests/auditor-history-storage-v9508-browser.js'
      - '.github/workflows/auditor-history-storage-v9508.yml'
permissions:
  contents: read
jobs:
  syntax:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '20'}
      - run: node --check release-auditor-autocorrect-v9441.js
      - run: node tests/auditor-autocorrect-v9441-behavior.js
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    strategy:
      fail-fast: false
      matrix:
        browser: [webkit, chromium]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '20'}
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps ${{ matrix.browser }}
      - name: Serve real HLGB loader
        run: |
          python3 -m http.server 4173 >/tmp/hlgb-history-9508.log 2>&1 &
          sleep 2
      - name: Verify audit history quota fallback
        env:
          HLGB_BROWSER: ${{ matrix.browser }}
        run: node tests/auditor-history-storage-v9508-browser.js
