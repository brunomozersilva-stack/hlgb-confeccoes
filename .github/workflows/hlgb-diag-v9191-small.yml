name: Diagnosticar focos HLGB v91.91
on:
  push:
    paths:
      - 'scripts/hlgb_diag_v9191_small.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Gerar recortes focados
        run: python scripts/hlgb_diag_v9191_small.py
      - name: Publicar recortes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add debug/v9191-*.txt
          git commit -m 'Gerar recortes diagnosticos v91.91' || exit 0
          git push