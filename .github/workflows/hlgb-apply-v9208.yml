name: Aplicar HLGB v92.08 selo de versão
on:
  push:
    paths:
      - 'scripts/hlgb_v9208_version_badge.py'
      - '.github/workflows/hlgb-apply-v9208.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Corrigir selo de versão
        run: python scripts/hlgb_v9208_version_badge.py
      - name: Validar correção
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          req=['HLGB_V9208_VERSION_BADGE','v92.08','HLGB_V9200_START','HLGB_V9201_START','HLGB_V9202_START']
          miss=[x for x in req if x not in s]
          if miss: raise SystemExit('Ausente: '+repr(miss))
          if "new MutationObserver(setVersion9185)" in s:
              raise SystemExit('Observador antigo v91.90 ainda ativo')
          print('v92.08 OK')
          PY
      - name: Publicar v92.08
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Publicar HLGB v92.08 - corrigir selo de versão" || exit 0
          git push
