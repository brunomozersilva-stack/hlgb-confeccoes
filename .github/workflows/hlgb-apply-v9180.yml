name: Aplicar HLGB v91.80 login fix

on:
  push:
    branches: [ main ]
    paths:
      - 'scripts/hlgb_v9180_login_fix.py'
      - '.github/workflows/hlgb-apply-v9180.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Aplicar correção
        run: python scripts/hlgb_v9180_login_fix.py
      - name: Validar versão e remoção do watchdog destrutivo
        run: |
          grep -q 'v91.80' index.html
          ! grep -q "localStorage.removeItem('hlgb_supabase_auth_v1')" index.html || true
          grep -q 'watchdog de sessão não destrutivo' index.html
      - name: Publicar
        run: |
          if git diff --quiet -- index.html; then
            echo 'Sem alterações pendentes.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Publicar HLGB v91.80 - corrigir acesso e sessão'
          git push
