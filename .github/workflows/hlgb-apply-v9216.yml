name: Aplicar HLGB v92.16 atribuir produtos a nota agrupada
on:
  push:
    paths:
      - 'scripts/hlgb_v9216_ready_to_note_assembly.py'
      - '.github/workflows/hlgb-apply-v9216.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Montar página v92.16
        run: python scripts/hlgb_v9216_ready_to_note_assembly.py
      - name: Validar atribuição para montagem e JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('app9216.html').read_text(encoding='utf-8')
          req=['id="loginUser"','id="loginPass"','onclick="return doLogin()"','HLGB_V9215_NOTES_PAGE_FIX_START','HLGB_V9216_READY_ASSEMBLY_START','hlgbAddReadyToAssembly9216','hlgbOpenReadyPicker9216','groupNote9202','app9216.html?v=92.16']
          miss=[x for x in req if x not in s and x not in Path('abrir.html').read_text(encoding='utf-8')]
          if miss: raise SystemExit('Itens obrigatórios ausentes: '+repr(miss))
          a=s.index('<!-- HLGB_V9216_READY_ASSEMBLY_START -->'); b=s.index('<!-- HLGB_V9216_READY_ASSEMBLY_END -->')
          block=s[a:b]
          if 'MutationObserver' in block: raise SystemExit('Observer não permitido no bloco v92.16')
          js=block.split('<script>',1)[1].rsplit('</script>',1)[0]
          Path('/tmp/v9216.js').write_text(js,encoding='utf-8')
          print('Estrutura v92.16 OK')
          PY
          node --check /tmp/v9216.js
      - name: Publicar v92.16
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app9216.html abrir.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Publicar HLGB v92.16 - atribuir produtos para nota agrupada"
          git push
