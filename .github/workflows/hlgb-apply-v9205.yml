name: Aplicar HLGB v92.05 consolidada
on:
  push:
    paths:
      - 'scripts/hlgb_v9205_version_label.py'
      - '.github/workflows/hlgb-apply-v9205.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Consolidar identificação v92.05
        run: python scripts/hlgb_v9205_version_label.py
      - name: Validar fluxos preservados
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          req=['HLGB_V9200_START','HLGB_V9201_START','HLGB_V9202_START','openProjectionAcerto9200','sendFactionDeliveryToNotes9201','sendProjectionToNotes9202','groupNote9202','v92.05']
          miss=[x for x in req if x not in s]
          if miss: raise SystemExit('Ausente: '+repr(miss))
          print('v92.05 consolidada OK')
          PY
      - name: Publicar v92.05
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Publicar HLGB v92.05 - consolidar fluxo de notas" || exit 0
          git push
