name: HLGB apply v91.11
on:
  push:
    paths:
      - 'scripts/hlgb_v9111_session_recover.py'
      - '.github/workflows/hlgb-apply-v9111.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply v91.11 session recovery patch
        run: python3 scripts/hlgb_v9111_session_recover.py
      - name: Validate embedded JavaScript
        run: |
          python3 - <<'PY'
          import re, pathlib, subprocess
          s=pathlib.Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.S|re.I)
          for i,body in enumerate(scripts):
              f=pathlib.Path(f'/tmp/hlgb-{i}.js')
              f.write_text(body,encoding='utf-8')
              subprocess.run(['node','--check',str(f)],check=True)
          assert 'Versão v91.11' in s
          assert 'async function hlgbEnsureActiveWriteSession()' in s
          assert 'await cloudRefreshSession(true);' in s
          assert 'const sessionOk=await hlgbEnsureActiveWriteSession();' in s
          print('validated',len(scripts),'script blocks')
          PY
      - name: Commit validated index
        run: |
          if git diff --quiet -- index.html; then
            echo 'No index changes required'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Deploy HLGB v91.11 automatic session recovery on product save'
          git push origin main
