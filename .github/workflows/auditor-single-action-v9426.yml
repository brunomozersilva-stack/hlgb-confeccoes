name: HLGB Auditor Legacy v94.26
on:
  push:
    branches: [main]
    paths:
      - 'release-auditor-single-action-v9426.js'
      - 'tests/auditor-single-action-v9426-webkit.js'
      - '.github/workflows/auditor-single-action-v9426.yml'
  pull_request:
    branches: [main]
    paths:
      - 'release-auditor-single-action-v9426.js'
      - 'tests/auditor-single-action-v9426-webkit.js'
      - '.github/workflows/auditor-single-action-v9426.yml'
jobs:
  legacy-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Sintaxe legado v94.26
        run: node --check release-auditor-single-action-v9426.js
      - name: v94.27 é a autoridade publicada
        run: |
          test -f release-auditor-single-action-v9427.js
          grep -q 'release-auditor-single-action-v9427.js' release-cut-model-grade-adjust.js
