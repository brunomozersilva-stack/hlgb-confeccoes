name: Auditor v93.60 smoke
on:
  push:
    branches:
      - feat/auditor-smart-v9360
      - fix/auditor-runtime-events-v9370
  workflow_dispatch:
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Sintaxe Auditor
        run: node --check release-auditor-smart-v9360.js
      - name: Sintaxe UI compat
        run: node --check release-auditor-ui-compat-v9361.js
      - name: Sintaxe Safari download v93.67
        run: node --check release-auditor-safari-download-v9367.js
      - name: Sintaxe Safari download v93.68
        run: node --check release-auditor-safari-download-v9368.js
      - name: Sintaxe runtime fix v93.70
        run: node --check release-auditor-runtime-fix-v9370.js
      - name: Sintaxe produção v93.70
        run: node --check release-auditor-production-v9369.js
      - name: Sintaxe loader v93.65
        run: node --check auditor-test-loader-v9365.js
      - name: Sintaxe loader v93.66
        run: node --check auditor-test-loader-v9366.js
      - name: Sintaxe loader v93.67
        run: node --check auditor-test-loader-v9367.js
      - name: Sintaxe loader v93.68
        run: node --check auditor-test-loader-v9368.js
      - name: Loader v93.68 sem loops
        run: node tests/auditor-v9368-no-timer.js
      - name: Smoke test Auditor
        run: node tests/auditor-v9360-smoke.js
      - name: Cenários críticos Auditor
        run: node tests/auditor-v9360-scenarios.js
      - name: UI simplificada Auditor
        run: node tests/auditor-ui-compat-v9361.js
      - name: Auditoria diária silenciosa
        run: node tests/auditor-v9362-background.js
  webkit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Instalar Playwright WebKit
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps webkit
      - name: Iniciar servidor local
        run: |
          python3 -m http.server 4173 >/tmp/hlgb-auditor-http.log 2>&1 &
          echo $! >/tmp/hlgb-auditor-http.pid
          sleep 2
      - name: Teste WebKit Auditor
        run: node tests/auditor-v9362-webkit.js
      - name: Injeção temporária WebKit
        run: node tests/auditor-v9362-webkit-remote-inject.js
      - name: Guard visual v93.65 WebKit
        run: node tests/auditor-v9365-webkit.js
      - name: Entrada real v93.66 WebKit
        run: node tests/auditor-v9366-entry-webkit.js
      - name: Download Safari v93.67 WebKit
        run: node tests/auditor-v9367-safari-download-webkit.js
      - name: Loader isolado v93.68 WebKit
        run: node tests/auditor-v9368-loader-webkit.js
      - name: Linha do tempo v93.70 WebKit
        run: node tests/auditor-v9370-events-webkit.js
