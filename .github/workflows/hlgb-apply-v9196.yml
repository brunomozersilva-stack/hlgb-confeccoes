name: Aplicar HLGB v91.96 fluxo produção para notas
on:
  push:
    paths:
      - 'scripts/hlgb_v9196_order_flow_cleanup.py'
      - '.github/workflows/hlgb-apply-v9196.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Aplicar e validar v91.96
        run: python scripts/hlgb_v9196_order_flow_cleanup.py
      - name: Guardas finais
        run: |
          grep -q 'HLGB_V9196_START' index.html
          grep -q 'Prontos para nota' index.html
          grep -q 'Aguardando nota' index.html
          test $(wc -c < index.html) -gt 1000000
          if grep -Fq '<button onclick="page('\''producao'\'',this)">Produção</button>' index.html; then echo 'submenu Produção redundante ainda existe'; exit 1; fi
      - name: Publicar v91.96
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Publicar HLGB v91.96 - fechar produção e encaminhar para notas' || exit 0
          git push
