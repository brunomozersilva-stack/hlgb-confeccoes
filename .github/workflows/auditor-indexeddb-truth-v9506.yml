name: HLGB Auditor WAL truthful v95.06
on:
  pull_request:
    branches: [main]
    paths:
      - 'release-internal-auditor.js'
      - 'tests/auditor-indexeddb-truth-v9506.cjs'
      - '.github/workflows/auditor-indexeddb-truth-v9506.yml'
  push:
    branches: [main]
    paths:
      - 'release-internal-auditor.js'
      - 'tests/auditor-indexeddb-truth-v9506.cjs'
      - '.github/workflows/auditor-indexeddb-truth-v9506.yml'
permissions:
  contents: read
jobs:
  audit-wal:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '20'}
      - run: node --check release-internal-auditor.js
      - run: node tests/auditor-indexeddb-truth-v9506.cjs
