name: TMP post-merge report fixes

on:
  push:
    branches:
      - fix/post-merge-boot-wal-idb-20261026
    paths:
      - .github/workflows/tmp-post-merge-report-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply existing-authority fixes
        run: python3 scripts/apply-post-report-fixes.py
      - name: Normalize generated regression files
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for name in ['tests/audit-app-stable3-restored-render-regression.cjs','tests/audit-wal-idb-only-regression.cjs']:
              p=Path(name); s=p.read_text()
              if s.startswith('\\\n'): s=s[2:]
              if name.endswith('audit-wal-idb-only-regression.cjs'):
                  s=s.replace("setTimeout:(fn)=>{queueMicrotask(fn);return 1}","setTimeout:()=>1")
              p.write_text(s)
          PY
      - name: Run focused regressions
        run: |
          node tests/audit-app-stable3-restored-render-regression.cjs
          node tests/audit-wal-equivalent-production-regression.cjs
          node tests/audit-wal-idb-only-regression.cjs
          node tests/audit-boot-authready-render-order.cjs
          node tests/auditor-boot-dedupe-v9397.js
      - name: Commit patched files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app-stable3.html release-wal-single-authority-v9339.js release-wal-confirmed-replay-v9333.js tests/audit-app-stable3-restored-render-regression.cjs tests/audit-wal-idb-only-regression.cjs
          git commit -m "[postreport-patched] Boot visível e WAL IndexedDB sob autoridade existente"
          git push origin HEAD:fix/post-merge-boot-wal-idb-20261026
