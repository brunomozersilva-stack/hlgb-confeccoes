name: Aplicar HLGB v92.26 editar data e valor no Hub
on:
  push:
    paths:
      - 'scripts/hlgb_v9226_hub_quick_value.py'
      - '.github/workflows/hlgb-apply-v9226.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Montar página v92.26
        run: python scripts/hlgb_v9226_hub_quick_value.py
      - name: Validar editor do Hub e JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('app9226.html').read_text(encoding='utf-8')
          req=['HLGB_V9226_HUB_QUICK_VALUE_START','id="hubQuickValue9185"','value:+value.toFixed(2)','Edite a data, o valor ou marque Pago/Recebido diretamente aqui.','HLGB_V9225_NOTE_QUEUE_BALANCE_START','HLGB_V9224_RESALE_START','id="loginUser"']
          miss=[x for x in req if x not in s]
          if miss: raise SystemExit('Itens ausentes: '+repr(miss))
          a=s.index('<!-- HLGB_V9185_HUB_CUT_START -->');b=s.index('<!-- HLGB_V9185_HUB_CUT_END -->',a)
          js=s[a:b].split('<script>',1)[1].rsplit('</script>',1)[0]
          Path('/tmp/v9226-hub.js').write_text(js,encoding='utf-8')
          a=s.index('<!-- HLGB_V9226_HUB_QUICK_VALUE_START -->');b=s.index('<!-- HLGB_V9226_HUB_QUICK_VALUE_END -->',a)
          js2=s[a:b].split('<script>',1)[1].rsplit('</script>',1)[0]
          Path('/tmp/v9226.js').write_text(js2,encoding='utf-8')
          PY
          node --check /tmp/v9226-hub.js
          node --check /tmp/v9226.js
      - name: Publicar v92.26
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app9226.html abrir.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Publicar HLGB v92.26 - editar data e valor no hub"
          git push
