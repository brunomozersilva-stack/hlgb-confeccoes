name: HLGB v91.32 seguranca de cadastro de funcionarios

on:
  push:
    branches: [main]
    paths:
      - 'scripts/v9132_parts/**'
      - '.github/workflows/hlgb-apply-v9132.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Rebuild v91.32 patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64,gzip
          raw=''.join(p.read_text().strip() for p in sorted(Path('scripts/v9132_parts').glob('part*.b64')))
          code=gzip.decompress(base64.b64decode(raw))
          Path('/tmp/hlgb_v9132_employee_safety.py').write_bytes(code)
          print('rebuilt patch',len(code),'bytes')
          PY
      - name: Apply v91.32 package
        run: python3 /tmp/hlgb_v9132_employee_safety.py index.html
      - name: Validate JavaScript and all previous integrity guards
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re,subprocess,tempfile,os
          s=Path('index.html').read_text(encoding='utf-8')
          markers=[
            'v91.32 Multiusuário',
            'HLGB v91.32 EMPLOYEE MASTER SAFETY',
            'window.newEmployee=function',
            'window.editEmployee=function',
            'funcionário confirmado',
            'HLGB v91.31 RECONCILIACAO OPERACIONAL',
            'HLGB v91.30 PACOTE NOTURNO SEGURO',
            'HLGB v91.29 folha não confirmada',
            'HLGB v91.28 AUTHORITATIVE RECORD MERGE',
            'HLGB v91.26 DATA INTEGRITY GUARD'
          ]
          for m in markers: assert m in s,m
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.S|re.I)
          for i,js in enumerate(scripts):
            if not js.strip(): continue
            fd,path=tempfile.mkstemp(suffix='.js');os.close(fd)
            Path(path).write_text(js,encoding='utf-8')
            r=subprocess.run(['node','--check',path],capture_output=True,text=True)
            os.unlink(path)
            if r.returncode: raise SystemExit(f'Inline script {i} failed:\n{r.stderr}')
          print('validation ok -',len(scripts),'script blocks')
          PY
      - name: Commit validated v91.32 index
        run: |
          if git diff --quiet -- index.html; then
            echo 'No index changes to commit'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Confirm employee master saves and prevent duplicate catalog names v91.32'
          git push origin main
