name: Aplicar HLGB v92.02
on:
  push:
    paths:
      - '.github/workflows/hlgb-apply-v9202.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python scripts/hlgb_v9202_group_notes.py
      - run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          req=['HLGB_V9202_START','v92.02','openMergeNotes9202','mergedFrom']
          miss=[x for x in req if x not in s]
          if miss: raise SystemExit('Ausente: '+repr(miss))
          print('v92.02 OK')
          PY
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Publicar HLGB v92.02" || exit 0
          git push
