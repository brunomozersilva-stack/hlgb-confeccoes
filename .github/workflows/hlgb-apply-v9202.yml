name: Aplicar HLGB v92.02 notas agrupadas
on:
  push:
    paths:
      - 'scripts/hlgb_v9202_grouped_notes.py'
      - '.github/workflows/hlgb-apply-v9202.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Aplicar v92.02
        run: python scripts/hlgb_v9202_grouped_notes.py
      - name: Validar v92.02
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          req=['HLGB_V9202_START','Itens aguardando nota','sendProjectionToNotes9202','groupNote9202','noteQueue','v92.02']
          miss=[x for x in req if x not in s]
          if miss: raise SystemExit('Ausente: '+repr(miss))
          if s.count('<!-- HLGB_V9202_START -->')!=1: raise SystemExit('v92.02 duplicada')
          print('v92.02 OK')
          PY
      - name: Publicar v92.02
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Publicar HLGB v92.02 - fila e notas agrupadas" || exit 0
          git push
