name: HLGB Local Preview Package
# refreshed after visual-test fixes v5

on:
  push:
    branches: [melhorias-operacionais-20261001]
    paths:
      - '.github/workflows/operational-preview.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: melhorias-operacionais-20261001
      - name: Build local preview package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p preview
          cp abrir.html preview/
          cp app-stable3.html preview/
          cp app9240.html preview/
          cp hotfix9241.js preview/
          cp release-*.js preview/
          cat > preview/start-preview.command <<'SH'
          #!/bin/bash
          set -e
          cd "$(dirname "$0")"
          PORT=8765
          echo ""
          echo "HLGB Confecções - Preview local"
          echo "Abrindo http://localhost:${PORT}/abrir.html"
          echo "Para encerrar, volte nesta janela e pressione Control+C."
          echo ""
          if command -v python3 >/dev/null 2>&1; then
            (sleep 1; open "http://localhost:${PORT}/abrir.html") >/dev/null 2>&1 &
            exec python3 -m http.server "$PORT" --bind 127.0.0.1
          fi
          echo "Python 3 não foi encontrado neste Mac."
          echo "Instale/ative o Python 3 ou abra um servidor local nessa pasta."
          read -r -p "Pressione Enter para fechar."
          SH
          chmod +x preview/start-preview.command
          cat > preview/LEIA-ME.txt <<'TXT'
          HLGB CONFECÇÕES — PACOTE DE TESTE LOCAL

          1. Descompacte este ZIP.
          2. Dê dois cliques em start-preview.command.
          3. Se o macOS bloquear a primeira abertura:
             - clique com o botão direito no arquivo
             - escolha Abrir
             - confirme Abrir
          4. O navegador abrirá:
             http://localhost:8765/abrir.html

          Este pacote NÃO publica nada no main.
          Ele serve somente para testar a branch melhorias-operacionais-20261001.

          Testar principalmente:
          - Provisões e encargos: ordenação e antecipação de 13º no total geral
          - Hub Financeiro: busca compacta e visão semanal/mensal/anual
          - Pagamento de Facções: Pagamento avulso
          - Separação de Material: visualizar grade
          - Calculadora de Material: automática e manual
          - Produtos: botão Grade
          - Cortadores: busca de produto + data + cortador
          - Corte: busca, filtros e seções adicionais
          - Assistente HLGB: microfone, leitura em voz alta, criar/editar pedido com confirmação
          TXT
      - name: Upload preview
        uses: actions/upload-artifact@v4
        with:
          name: HLGB-MELHORIAS-OPERACIONAIS-LOCAL
          path: preview/
          if-no-files-found: error
          retention-days: 7
