name: Publicar HLGB v92.37
on:
  push:
    paths:
      - .github/workflows/hlgb-apply-v9237b.yml
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python scripts/hlgb_v9237_projection_client_sync.py
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: Publicar HLGB v92.37
          file_pattern: app9237.html abrir.html
