name: HLGB Production + Auditor v94.39
on:
  push:
    branches:
      - main
      - fix/v9439-production-auditor
  pull_request:
    branches:
      - main
permissions:
  contents: read
jobs:
  logic:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Sintaxe reconciliação Produção v94.39
        run: node --check release-production-reconcile-v9439.js
      - name: Sintaxe pós-save Produção v94.39
        run: node --check release-production-postsave-v9439.js
      - name: Sintaxe finalizador Auditor v94.39
        run: node --check release-auditor-finalize-v9439.js
      - name: Sintaxe confirmação Produção v94.38
        run: node --check release-production-save-confirm-v9438.js
      - name: Sintaxe Auditor confiável v94.38
        run: node --check release-auditor-reliability-v9438.js
      - name: Sintaxe gate pós-login
        run: node --check release-login-confirm-gate-v9407.js
      - name: Sintaxe guarda Safari
        run: node --check release-safari-resume-v9266.js
      - name: Regressão de login
        run: node tests/runtime-login-ready-v9378.js
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        browser: [webkit, chromium]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Instalar Playwright ${{ matrix.browser }}
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps ${{ matrix.browser }}
      - name: Iniciar servidor local
        run: |
          python3 -m http.server 4173 >/tmp/hlgb-9439-http.log 2>&1 &
          sleep 2
      - name: Executar v94.39 — ${{ matrix.browser }}
        env:
          HLGB_BROWSER: ${{ matrix.browser }}
        run: node tests/production-save-auditor-v9439-browser.js
