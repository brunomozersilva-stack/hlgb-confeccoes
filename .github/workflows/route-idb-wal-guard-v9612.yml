name: HLGB Rotas - WAL IndexedDB e Duplicidade Segura v96.12
on:
  pull_request:
    branches: [main]
    paths:
      - 'release-operations-pack.js'
      - 'tests/route-idb-wal-guard-v9612-browser.cjs'
      - '.github/workflows/route-idb-wal-guard-v9612.yml'
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions: {contents: read}
jobs:
  syntax-regression:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Syntax and existing safeguards
        run: |
          node --check release-operations-pack.js
          node --check tests/route-idb-wal-guard-v9612-browser.cjs
          node tests/audit-missing-route-regression.cjs
          node --test tests/auditor-wal-route-duplicates-v9595.cjs
  browser:
    runs-on: ubuntu-24.04
    container: mcr.microsoft.com/playwright:v1.55.0-noble
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
      - name: Install matching Playwright
        run: npm install --no-save playwright@1.55.0
      - name: IndexedDB-only WAL and duplicate route safe workflow
        env:
          HLGB_BROWSER: ${{ matrix.browser }}
        run: |
          node tests/route-idb-wal-guard-v9612-browser.cjs
          node tests/route-safe-save-location-v9534-browser.cjs
