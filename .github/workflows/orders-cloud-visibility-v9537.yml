name: HLGB Pedidos Safari Chrome Cloud Confirm v95.37
on:
  push:
    branches: [main]
    paths:
      - 'release-orders-cloud-visibility-v9537.js'
      - 'app-stable3.html'
      - 'tests/orders-cloud-visibility-v9537.cjs'
      - '.github/workflows/orders-cloud-visibility-v9537.yml'
  pull_request:
    paths:
      - 'release-orders-cloud-visibility-v9537.js'
      - 'app-stable3.html'
      - 'tests/orders-cloud-visibility-v9537.cjs'
      - '.github/workflows/orders-cloud-visibility-v9537.yml'
jobs:
  independent-orders-read:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check release-orders-cloud-visibility-v9537.js
      - run: node --test tests/orders-cloud-visibility-v9537.cjs
      - run: |
          node -e "const fs=require('fs');const s=fs.readFileSync('app-stable3.html','utf8');if(!s.includes('release-orders-cloud-visibility-v9537.js'))process.exit(1)"
