name: HLGB v91.58 retira faltas da previsão de entrega

on:
  push:
    branches: [main]
    paths:
      - 'scripts/hlgb_v9158_projection_missing_exclusion.py'
      - '.github/workflows/hlgb-apply-v9158.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply v91.58 projection shortage exclusion
        run: python3 scripts/hlgb_v9158_projection_missing_exclusion.py
      - name: Validate v91.58 and all inline JavaScript
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess, tempfile, os
          s=Path('index.html').read_text(encoding='utf-8')
          assert 'v91.58 Multiusuário' in s
          assert "const VER955='91.58';" in s
          assert 'function projectionOpenMissingQty(order,item)' in s
          assert 'function projectionDeliverableQty(order,item)' in s
          assert 'projectionDeliverableQty(x.order,x.item)>0' in s
          assert 'let available=projectionDeliverableQty(o,item);' in s
          assert 'let rem=projectionDeliverableQty(x.o,x.item),unit=' in s
          assert 'available=projectionDeliverableQty(ctx.o,ctx.item),unit=' in s
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.S|re.I)
          errors=[]
          for i,js in enumerate(scripts):
              fd,p=tempfile.mkstemp(suffix='.js'); os.close(fd)
              Path(p).write_text(js,encoding='utf-8')
              r=subprocess.run(['node','--check',p],capture_output=True,text=True)
              os.unlink(p)
              if r.returncode: errors.append(f'SCRIPT {i}:\n{r.stderr}')
          if errors: raise SystemExit('\n\n'.join(errors))
          print(f'v91.58 validation OK: {len(scripts)} inline scripts checked')
          PY
      - name: Commit validated v91.58 index
        run: |
          if git diff --quiet -- index.html; then
            echo 'No index changes to commit'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Exclude registered shortages from delivery forecast v91.58'
          git push origin main
