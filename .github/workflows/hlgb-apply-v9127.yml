name: HLGB v91.27 cut assignment by model

on:
  push:
    branches: [main]
    paths:
      - 'scripts/hlgb_v9127_cut_product_assignment_fix.py'
      - '.github/workflows/hlgb-apply-v9127.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply v91.27 cut assignment fix
        run: python3 scripts/hlgb_v9127_cut_product_assignment_fix.py
      - name: Validate JavaScript and assignment flow
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess, tempfile, os
          s=Path('index.html').read_text(encoding='utf-8')
          assert 'v91.27 Multiusuário' in s
          assert 'HLGB v91.27 CORTE POR MODELO + FACCAO' in s
          assert 'cutProductKey' in s
          assert 'window.syncFinalizedCutsToProduction=function()' in s
          assert 'window.renderFactionPaymentPlanner=function()' in s
          assert 'hlgb924ProtectImplicitDelete' in s, 'v91.26 data guard must remain'
          assert 'explicit delete intent' in s, 'v91.26 server delete guard marker must remain'
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.S|re.I)
          for i,js in enumerate(scripts):
              if not js.strip(): continue
              fd,path=tempfile.mkstemp(suffix='.js');os.close(fd)
              Path(path).write_text(js,encoding='utf-8')
              r=subprocess.run(['node','--check',path],capture_output=True,text=True)
              os.unlink(path)
              if r.returncode:
                  raise SystemExit(f'Inline script {i} failed:\n{r.stderr}')
          print('validation ok -',len(scripts),'script blocks')
          PY
      - name: Commit validated index
        run: |
          if git diff --quiet -- index.html; then
            echo 'No index changes to commit'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Fix cut assignment per model and faction planner v91.27'
          git push origin main
