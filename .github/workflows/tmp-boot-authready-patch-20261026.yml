name: Temporary Boot authReady patch

on:
  push:
    branches:
      - fix/boot-render-authready-20261026

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/boot-render-authready-20261026
          fetch-depth: 0

      - name: Patch existing boot callers and add regression
        shell: python
        run: |
          from pathlib import Path

          app = Path('app9240.html')
          s = app.read_text(encoding='utf-8')

          old_ensure = '''      const prev=cloudApplying;cloudApplying=true;try{renderAll()}finally{cloudApplying=prev}\n      hlgbStartRealtime();'''
          new_ensure = '''      hlgbStartRealtime();'''
          assert s.count(old_ensure) == 1, f'expected exactly one renderAll inside hlgbEnsureRecordsOnlineAfterLogin, got {s.count(old_ensure)}'
          s = s.replace(old_ensure, new_ensure, 1)

          old_manual = '''   loginEl.style.display="none";appEl.style.display="block";setTimeout(()=>window.hlgbMarkAuthenticated?.(),0);'''
          new_manual = '''   loginEl.style.display="none";appEl.style.display="block";window.hlgbMarkAuthenticated?.();'''
          assert s.count(old_manual) == 1, f'expected exactly one deferred manual-login auth mark, got {s.count(old_manual)}'
          s = s.replace(old_manual, new_manual, 1)

          old_restore = '''   loginScreen.style.display="none";sessionLoader.style.display="none";appShell.style.display="block";setTimeout(()=>window.hlgbMarkAuthenticated?.(),0);applyAccess();restoreNavGroups();'''
          new_restore = '''   loginScreen.style.display="none";sessionLoader.style.display="none";appShell.style.display="block";window.hlgbMarkAuthenticated?.();applyAccess();restoreNavGroups();'''
          assert s.count(old_restore) == 1, f'expected exactly one deferred restore auth mark, got {s.count(old_restore)}'
          s = s.replace(old_restore, new_restore, 1)

          app.write_text(s, encoding='utf-8')

          test = Path('tests/audit-boot-authready-render-order.cjs')
          test.write_text(r'''
          'use strict';
          const fs=require('fs'),assert=require('assert');
          const src=fs.readFileSync('app9240.html','utf8');

          function between(a,b){
            const i=src.indexOf(a),j=src.indexOf(b,i+1);
            assert(i>=0&&j>i,`trecho não encontrado: ${a}`);
            return src.slice(i,j);
          }

          const ensure=between('async function hlgbEnsureRecordsOnlineAfterLogin(){','/* ===== fim v91.16 ===== */');
          assert(!ensure.includes('renderAll()'),'hlgbEnsureRecordsOnlineAfterLogin não pode renderizar durante a carga pré-auth');
          assert(ensure.includes('hlgbStartRealtime();'),'bootstrap deve continuar iniciando Realtime após a carga');

          const manual=between('function doLogin(){','async function logout(){');
          const manualMark=manual.indexOf('window.hlgbMarkAuthenticated?.();');
          const manualRender=manual.indexOf('renderAll()');
          assert(manualMark>=0&&manualRender>manualMark,'login manual deve marcar authReady antes do primeiro renderAll');
          assert(!manual.includes('setTimeout(()=>window.hlgbMarkAuthenticated?.(),0)'),'login manual não pode adiar authReady depois de abrir o app');

          const restore=between('if(cloudRestoreStoredAuth()){','}else{sessionLoader.style.display="none";loginScreen.style.display="flex"}');
          const restoreMark=restore.indexOf('window.hlgbMarkAuthenticated?.();');
          const restoreRender=restore.indexOf('renderAll()');
          assert(restoreMark>=0&&restoreRender>restoreMark,'restauração deve marcar authReady antes do primeiro renderAll');
          assert(!restore.includes('setTimeout(()=>window.hlgbMarkAuthenticated?.(),0)'),'restauração não pode adiar authReady depois de abrir o app');

          console.log('PASS boot authReady/render: carga sem render oculto; login manual e restore marcam authReady antes de renderAll.');
          ''', encoding='utf-8')

          wf=Path('.github/workflows/audit-regression.yml')
          w=wf.read_text(encoding='utf-8')
          marker='''      - name: Validate ByHagatha background and topbar consolidation\n        run: node tests/audit-brand-topbar-consolidation.cjs\n'''
          addition='''\n      - name: Validate boot authReady before render\n        run: node tests/audit-boot-authready-render-order.cjs\n'''
          assert marker in w, 'audit-regression insertion marker not found'
          assert 'audit-boot-authready-render-order.cjs' not in w, 'boot authReady regression already registered unexpectedly'
          wf.write_text(w.replace(marker, marker+addition, 1), encoding='utf-8')

          Path('.github/workflows/tmp-boot-authready-patch-20261026.yml').unlink()

      - name: Run focused regressions
        run: |
          node tests/audit-boot-authready-render-order.cjs
          node tests/auditor-boot-dedupe-v9397.js
          node tests/audit-brand-topbar-consolidation.cjs

      - name: Commit focused fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app9240.html tests/audit-boot-authready-render-order.cjs .github/workflows/audit-regression.yml .github/workflows/tmp-boot-authready-patch-20261026.yml
          git commit -m "fix: marcar authReady antes do render pós-login"
          git push origin HEAD:fix/boot-render-authready-20261026
