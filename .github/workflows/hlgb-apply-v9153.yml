name: HLGB v91.53 conferencia historico folha e Hub

on:
  push:
    branches: [main]
    paths:
      - 'scripts/hlgb_v9153_legacy_diff_addon.html'
      - 'scripts/hlgb_v9153_patch.py'
      - '.github/workflows/hlgb-apply-v9153.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply v91.53 read-only legacy diff
        run: python3 scripts/hlgb_v9153_patch.py
      - name: Validate legacy diff and all inline JavaScript
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess, tempfile, os
          s=Path('index.html').read_text(encoding='utf-8')
          assert 'HLGB v91.53 READ-ONLY LEGACY PAYROLL + HUB DIFF' in s
          assert 'v91.53 Multiusuário' in s
          assert 'hlgb_data?select=id,dados,versao,atualizado_em' in s
          assert 'PAGO somente no JSON antigo' in s
          assert 'Registros apagados da folha' in s
          assert 'Duplicidades funcionário/mês' in s
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.S|re.I)
          errors=[]
          for i,js in enumerate(scripts):
              fd,p=tempfile.mkstemp(suffix='.js'); os.close(fd)
              Path(p).write_text(js,encoding='utf-8')
              r=subprocess.run(['node','--check',p],capture_output=True,text=True)
              os.unlink(p)
              if r.returncode: errors.append(f'SCRIPT {i}:\n{r.stderr}')
          if errors: raise SystemExit('\n\n'.join(errors))
          print(f'v91.53 validation OK: {len(scripts)} inline scripts checked')
          PY
      - name: Commit validated v91.53 index
        run: |
          if git diff --quiet -- index.html; then
            echo 'No index changes to commit'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Add read-only legacy payroll and hub comparison v91.53'
          git push origin main
