name: HLGB v91.39 bindings locais e separacao

on:
  push:
    branches: [main]
    paths:
      - 'scripts/hlgb_v9139_patch.py'
      - 'scripts/v9139_parts/**'
      - '.github/workflows/hlgb-apply-v9139.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply v91.39 patch
        run: python3 scripts/hlgb_v9139_patch.py
      - name: Validate v91.39 JavaScript and safety guards
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64, re, subprocess, tempfile, os
          s=Path('index.html').read_text(encoding='utf-8')
          required=[
            'v91.39 Multiusuário',
            'HLGB v91.39 UI BINDINGS + LOCAL PRODUCTION + SEPARATION CLEANUP',
            'bindPricing939',
            'buildDaily939',
            'locAssignPanel939',
            'cleanupCutDuplicate939',
            'sepState939',
            'HLGB v91.38 WORKFLOW CLARITY + GRADE SPLIT + PARTIAL MATERIAL',
            'HLGB v91.37 HUB CADASTROS + PRICING PICKER + DAILY PRODUCTION LABEL',
            'HLGB v91.36 CUTTER PRINT + LIVE PERMISSIONS',
            'HLGB v91.35 PROJECTION + CAPACITY + FACTION DELIVERY + PIX COPY',
            'HLGB v91.34 HUB CALENDAR + CUT READY QUEUE',
            'HLGB v91.33 EXPLICIT DELETE HARDENING',
            'HLGB v91.32 EMPLOYEE MASTER SAFETY',
            'HLGB v91.31 RECONCILIACAO OPERACIONAL',
            'HLGB v91.28 AUTHORITATIVE RECORD MERGE',
            'HLGB v91.26 DATA INTEGRITY GUARD'
          ]
          for x in required:
            assert x in s, f'missing {x}'
          assert 'tmain.style' not in s, 'runtime typo tmain.style found'

          parts=sorted(Path('scripts/v9139_parts').glob('part*.b64'))
          assert len(parts)==5, f'expected 5 parts, got {len(parts)}'
          addon=base64.b64decode(''.join(p.read_text(encoding='utf-8').strip() for p in parts)).decode('utf-8')
          assert 'HLGB v91.39 UI BINDINGS + LOCAL PRODUCTION + SEPARATION CLEANUP' in addon
          m=re.search(r'<script>\s*(.*?)\s*</script>\s*$',addon,re.S|re.I)
          assert m, 'v91.39 script wrapper not found'
          js=m.group(1)
          fd,path=tempfile.mkstemp(suffix='.js'); os.close(fd)
          Path(path).write_text(js,encoding='utf-8')
          r=subprocess.run(['node','--check',path],capture_output=True,text=True)
          os.unlink(path)
          if r.returncode:
            raise SystemExit('v91.39 addon JavaScript failed:\n'+r.stderr)
          print('v91.39 addon validation ok')
          PY
      - name: Commit validated v91.39 index
        run: |
          if git diff --quiet -- index.html; then
            echo 'No index changes to commit'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Fix pricing binding, local production and separation v91.39'
          git push origin main
