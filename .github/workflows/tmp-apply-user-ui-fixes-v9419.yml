name: TMP apply user UI fixes v94.19

on:
  push:
    branches:
      - fix/ui-notes-payroll-auditor-20261026
    paths:
      - .github/workflows/tmp-apply-user-ui-fixes-v9419.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply requested fixes
        run: python3 scripts/apply-user-ui-fixes-v9419.py
      - name: Normalize generated tests and preserve compatibility contracts
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for name in ['tests/audit-user-ui-requests-v9419.cjs','tests/audit-notequeue-invoice-reconcile-v9419.cjs','tests/audit-auditor-notequeue-v9419.cjs']:
              p=Path(name); s=p.read_text()
              if s.startswith('\\\n'): s=s[2:]
              if name.endswith('audit-notequeue-invoice-reconcile-v9419.cjs'):
                  old="norm:v=>String(v??'').normalize('NFD').replace(/[\\\\u0300-\\\\u036f]/g,'').trim().toLowerCase()"
                  s=s.replace(old,"norm:v=>String(v??'').trim().toLowerCase()")
              p.write_text(s)
          # Topbar: preservar literalmente o texto de status; compactar só pela caixa visual.
          p=Path('release-night-ui-fixes.js'); s=p.read_text(); s=s.replace("2026.10.26-topbar-clean-v4","2026.10.26-topbar-clean-v3")
          a=s.find('let cloudStatusObserver9253=null')
          b=s.find('function cleanTopbar(){',a)
          if a>=0 and b>a: s=s[:a]+s[b:]
          s=s.replace(" compactCloudStatus9253(cloud);\n","")
          s=s.replace("min-width:46px!important;max-width:58px!important;padding:6px 8px!important;overflow:hidden!important;text-align:center!important","min-width:0!important;max-width:96px!important;padding:6px 8px!important;overflow:hidden!important;text-overflow:ellipsis!important;text-align:center!important")
          p.write_text(s)
          # Ajustar a regressão nova para exigir compactação sem mutação de textContent.
          p=Path('tests/audit-user-ui-requests-v9419.cjs'); s=p.read_text()
          old="assert(top.includes('compactCloudStatus9253'),'topbar deve compactar o status da nuvem');assert(top.includes('max-width:58px!important'),'status da nuvem deve ter largura compacta');assert(top.includes(\"cloud.setAttribute('aria-label',full)\"),'texto completo deve continuar acessível');"
          new="assert(top.includes('max-width:96px!important'),'status da nuvem deve ter largura compacta');assert(top.includes('text-overflow:ellipsis!important'),'status longo deve caber sem empurrar o menu');assert(!/cloud\\.textContent\\s*=/.test(top),'topbar não pode alterar o texto real do status da nuvem');"
          if old not in s: raise SystemExit('teste UI: contrato de nuvem antigo não encontrado')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Run focused regressions
        run: |
          node tests/audit-user-ui-requests-v9419.cjs
          node tests/audit-notequeue-invoice-reconcile-v9419.cjs
          node tests/audit-auditor-notequeue-v9419.cjs
          node tests/audit-note-integrity-regression.cjs
          node tests/audit-payroll-integrity-regression.cjs
          node tests/audit-brand-topbar-consolidation.cjs
          node tests/auditor-boot-dedupe-v9397.js
      - name: Commit functional patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add release-ui-actions-v9402.js release-night-ui-fixes.js release-payroll-view-v9295.js release-payroll-layout-v9298.js release-note-integrity.js release-auditor-blackbox-v9299.js release-product-catalog-v9419.js app-stable3.html tests/audit-user-ui-requests-v9419.cjs tests/audit-notequeue-invoice-reconcile-v9419.cjs tests/audit-auditor-notequeue-v9419.cjs
          git commit -m "[ui9419-patched] Fundo, topbar, catálogo, notas, folha e Auditor"
          git push origin HEAD:fix/ui-notes-payroll-auditor-20261026
