name: Aplicar HLGB v92.01
on:
  push:
    paths:
      - 'scripts/hlgb_v9201_faction_notes_flow.py'
      - '.github/workflows/hlgb-apply-v9201.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Aplicar v92.01
        run: python scripts/hlgb_v9201_faction_notes_flow.py
      - name: Validar v92.01
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          req=['HLGB_V9201_START','v92.01','sendFactionDeliveryToNotes9201','Enviar para Notas','sourceFactionId']
          miss=[x for x in req if x not in s]
          if miss: raise SystemExit('Ausente: '+repr(miss))
          if s.count('<!-- HLGB_V9201_START -->')!=1: raise SystemExit('v92.01 duplicada')
          print('v92.01 OK')
          PY
      - name: Publicar v92.01
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Publicar HLGB v92.01 - entregas de faccao para notas" || exit 0
          git push
