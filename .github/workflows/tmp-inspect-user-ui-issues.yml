name: TMP inspect user UI issues

on:
  push:
    branches:
      - fix/ui-notes-payroll-auditor-20261026
    paths:
      - .github/workflows/tmp-inspect-user-ui-issues.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Locate dynamic category builder
        shell: bash
        run: |
          set +e
          echo '=== ANOTAR ==='
          grep -RniE 'Anotar|anotar' --exclude-dir=.git --exclude='tmp-inspect-user-ui-issues.yml' --include='*.js' --include='*.html' . | head -n 160
          echo '=== TODOS LABELS ==='
          grep -RniE "['\"]Todos['\"]|>Todos<|Todos</button|Todos</" --exclude-dir=.git --include='*.js' --include='*.html' . | head -n 180
          echo '=== CATEGORY BUILDERS ==='
          grep -RniE 'categories|categorias|category|categoria|filter.*category|filter.*categoria|map\(.*category|map\(.*categoria' --exclude-dir=.git --include='*.js' --include='*.html' . | head -n 220
