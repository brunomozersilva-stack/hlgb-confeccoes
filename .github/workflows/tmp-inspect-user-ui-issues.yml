name: TMP inspect user UI issues

on:
  push:
    branches:
      - fix/ui-notes-payroll-auditor-20261026
    paths:
      - .github/workflows/tmp-inspect-user-ui-issues.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Locate exact improvement catalog UI
        shell: bash
        run: |
          set +e
          echo '=== EXACT LABELS ==='
          grep -RniF 'Melhorias para Anotar' --exclude-dir=.git .
          grep -RniF 'Processos' --exclude-dir=.git --include='*.js' --include='*.html' . | head -n 80
          grep -RniE 'Todos.{0,120}Processos|Processos.{0,120}Todos|melhoria.{0,120}processo|processo.{0,120}melhoria' --exclude-dir=.git --include='*.js' --include='*.html' . | head -n 120
          echo '=== NOTE INTEGRITY HOOKS ==='
          grep -nE 'function (install|boot|patch|maintain)|setTimeout|setInterval|addEventListener|hlgbAfterLogin|RecordIncoming|Incoming' release-note-integrity.js | tail -n 140
          echo '=== PAYROLL VIEW/LAYOUT ==='
          grep -nE 'payroll-actions|status-pill|togglePayrollPaid|editPayrollRow|deletePayrollRow|renderPayroll|PENDENTE|PAGO' release-payroll-view-v9295.js release-payroll-layout-v9298.js | head -n 180
          echo '=== AUDITOR EXTENSION POINTS ==='
          grep -nE 'function (run|scan|analyze|render)|issues|findings|recommend|module' release-internal-auditor.js release-auditor-blackbox-v9299.js release-auditor-intelligence-v9396.js | tail -n 220
