name: TMP inspect user UI issues

on:
  push:
    branches:
      - fix/ui-notes-payroll-auditor-20261026
    paths:
      - .github/workflows/tmp-inspect-user-ui-issues.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Map products navigation
        shell: bash
        run: |
          set +e
          echo '=== NAV PRODUCTS ==='
          grep -nE 'nav-group-title|Produtos|productsPage|productNav|showPage\(' app9240.html | head -n 220
          echo '=== PRODUCT PAGE ==='
          grep -nE '<section[^>]+id=.*product|id="products|renderProducts\(|newProduct\(|editProduct\(' app9240.html | head -n 160
          echo '=== STABLE LOAD ORDER ==='
          grep -n "release-.*\.js" app-stable3.html | tail -n 80
