name: HLGB v91.45 reparo emergencial de carregamento

on:
  push:
    branches: [main]
    paths:
      - 'scripts/hlgb_v9145_emergency_repair.py'
      - '.github/workflows/hlgb-apply-v9145.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply v91.45 emergency repair
        run: python3 scripts/hlgb_v9145_emergency_repair.py
      - name: Validate every inline JavaScript block
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess, tempfile, os
          s=Path('index.html').read_text(encoding='utf-8')
          assert 'HLGB v91.45 EMERGENCY FULL-PAGE JS REPAIR' in s
          assert 'v91.45 Multiusuário' in s
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.S|re.I)
          assert scripts, 'No inline scripts found'
          errors=[]
          for i,js in enumerate(scripts):
              fd,p=tempfile.mkstemp(suffix='.js'); os.close(fd)
              Path(p).write_text(js,encoding='utf-8')
              r=subprocess.run(['node','--check',p],capture_output=True,text=True)
              os.unlink(p)
              if r.returncode:
                  errors.append(f'SCRIPT {i}:\n{r.stderr}')
          if errors:
              raise SystemExit('\n\n'.join(errors))
          print(f'v91.45 full-page JavaScript validation OK: {len(scripts)} scripts checked')
          PY
      - name: Commit validated v91.45 index
        run: |
          if git diff --quiet -- index.html; then
            echo 'No index changes to commit'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Repair malformed JavaScript and restore page loading v91.45'
          git push origin main
