name: HLGB Auditor Duplicate Route WAL v95.95
on:
  pull_request:
    branches: [main]
    paths:
      - 'release-auditor-autocorrect-v9448.js'
      - 'tests/auditor-wal-route-duplicates-v9595.cjs'
      - 'tests/auditor-wal-full-review-ui-v9593.cjs'
      - '.github/workflows/auditor-wal-route-duplicates-v9595.yml'
  push:
    branches: [main]
    paths:
      - 'release-auditor-autocorrect-v9448.js'
      - 'tests/auditor-wal-route-duplicates-v9595.cjs'
      - 'tests/auditor-wal-full-review-ui-v9593.cjs'
      - '.github/workflows/auditor-wal-route-duplicates-v9595.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: node --check release-auditor-autocorrect-v9448.js
      - run: node --test tests/auditor-wal-route-duplicates-v9595.cjs
      - run: node tests/auditor-wal-full-review-ui-v9593.cjs
