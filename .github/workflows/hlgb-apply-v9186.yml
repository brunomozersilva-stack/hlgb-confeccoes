name: Aplicar HLGB v91.86 estabilidade
on:
  push:
    paths:
      - 'scripts/hlgb_v9186_remove_startup_local_audit.py'
      - '.github/workflows/hlgb-apply-v9186.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Aplicar e validar v91.86
        run: |
          python scripts/hlgb_v9186_remove_startup_local_audit.py
          grep -q 'v91.86' index.html
          ! grep -q 'HLGB v91.54 READ-ONLY BROWSER LOCAL PAYROLL RECOVERY' index.html
          ! grep -q 'hlgb954LocalAudit' index.html
          ! grep -q 'scanIndexedDB(out)' index.html
          ! grep -q '329474 bytes omitted' index.html
      - name: Publicar v91.86
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Publicar HLGB v91.86 - remover auditoria local automática"
          git push
