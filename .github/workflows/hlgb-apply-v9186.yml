name: Aplicar HLGB v91.86 estabilidade
on:
  push:
    paths:
      - 'scripts/hlgb_v9186_remove_startup_local_audit.py'
      - '.github/workflows/hlgb-apply-v9186.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Aplicar e validar v91.86
        run: |
          python scripts/hlgb_v9186_remove_startup_local_audit.py
          grep -q 'HLGB_STABILITY_V9186' index.html
          grep -q 'auditoria local v91.54 disponível somente sob comando manual; auto-start desativado' index.html
          ! grep -Fq "if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',start,{once:true});else start();" index.html
          ! grep -q '329474 bytes omitted' index.html
          test $(wc -c < index.html) -gt 1000000
      - name: Publicar v91.86
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Publicar HLGB v91.86 - desativar auditoria local automática"
          git push
