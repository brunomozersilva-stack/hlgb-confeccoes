name: Aplicar HLGB v91.91 melhorias de corte e capacidade
on:
  push:
    paths:
      - 'scripts/hlgb_v9191_cut_capacity_cleanup.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Aplicar e validar v91.91
        run: python scripts/hlgb_v9191_cut_capacity_cleanup.py
      - name: Publicar v91.91
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Publicar HLGB v91.91 - corte e capacidade' || exit 0
          git push