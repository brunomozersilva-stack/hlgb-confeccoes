name: HLGB v91.19 projection invoice issue date
on:
  push:
    paths:
      - 'scripts/hlgb_v9119_projection_issue_date.py'
      - '.github/workflows/hlgb-apply-v9119.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply v91.19 projection invoice issue date
        run: python3 scripts/hlgb_v9119_projection_issue_date.py
      - name: Validate JavaScript and invoice dates
        run: |
          python3 - <<'PY'
          import re,pathlib,subprocess
          s=pathlib.Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.S|re.I)
          for i,body in enumerate(scripts):
              f=pathlib.Path(f'/tmp/hlgb-v9119-{i}.js');f.write_text(body,encoding='utf-8')
              subprocess.run(['node','--check',str(f)],check=True)
          assert 'v91.19 Multiusuário' in s
          assert 'projectionInvoiceIssueDate' in s
          assert 'Data de emissão da nota' in s
          assert 'issueDate:issueDate' in s
          assert 'dueDate:due' in s
          print('validated',len(scripts),'script blocks')
          PY
      - name: Commit validated index
        run: |
          if git diff --quiet -- index.html; then
            echo 'No index changes required'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Add issue date to projection invoice finalization v91.19'
          git push origin main
