name: TMP inspect HLGB round 20261027
on:
  push:
    branches: [integration/hlgb-round-20261027]
    paths: [.github/workflows/tmp-inspect-round-20261027.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspecionar acerto canônico e exclusão Hub
        shell: bash
        run: |
          echo '=== ACERTO CANONICO 9234 ==='
          sed -n '20690,20870p' app9240.html
          echo '=== HUB DELETE FUNCTIONS ==='
          grep -RniE --include='*.js' --include='*.html' 'deleteHubFinanceEntry|delHub|delete.*FinanceEntry|hub.*Excluir|Excluir.*lan[cç]amento|save.*hubFinanceEntries.*true|hubFinanceEntries.*true' . | head -n 240 || true
          echo '=== PURCHASE BALANCE / SAVE ==='
          sed -n '10090,10220p' app9240.html
