name: TMP inspect HLGB round 20261027
on:
  push:
    branches: [integration/hlgb-round-20261027]
    paths: [.github/workflows/tmp-inspect-round-20261027.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Mapear acertos por mercadoria e notas
        shell: bash
        run: |
          echo '=== ACERTOS / ABATIMENTOS ==='
          grep -RniE --include='*.js' --include='*.html' 'Acerto|acerto|abatimento|compensa[cç][aã]o|saldo.*fornecedor|fornecedor.*saldo|materia.prima|mat[eé]ria.prima' . | head -n 260 || true
          echo '=== PROJECTION NOTES ==='
          grep -RniE --include='*.js' --include='*.html' 'openProjectionAcerto|projectionInvoices|Notas prontas|nota.*entrega|entrega.*nota' . | head -n 260 || true
          echo '=== SUPPLIER DEBT / PURCHASE ==='
          grep -RniE --include='*.js' --include='*.html' 'supplierDebt|supplier.*debt|purchaseId|sourcePurchaseId|Nota de compra|notas de compra|purchases' . | head -n 300 || true
