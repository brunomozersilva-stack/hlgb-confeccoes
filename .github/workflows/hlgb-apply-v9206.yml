name: Aplicar HLGB v92.06 correção emergencial
on:
  push:
    paths:
      - 'scripts/hlgb_v9206_emergency_freeze_fix.py'
      - '.github/workflows/hlgb-apply-v9206.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Corrigir loops de interface
        run: python scripts/hlgb_v9206_emergency_freeze_fix.py
      - name: Validar estabilidade e fluxos preservados
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          req=['HLGB_V9200_START','HLGB_V9201_START','HLGB_V9202_START','HLGB_V9206_FREEZE_FIX','v92.06','openProjectionAcerto9200','sendFactionDeliveryToNotes9201','sendProjectionToNotes9202','groupNote9202']
          miss=[x for x in req if x not in s]
          if miss: raise SystemExit('Ausente: '+repr(miss))
          if 'const mo9200=new MutationObserver(()=>{if(document.getElementById' in s: raise SystemExit('Observer antigo 9200 ainda presente')
          if "const mo=new MutationObserver(()=>{decorateProjection();if(document.getElementById('projectionNotes9200')" in s: raise SystemExit('Observer antigo 9202 ainda presente')
          print('v92.06 validada OK')
          PY
      - name: Publicar v92.06
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Publicar HLGB v92.06 - corrigir travamento da interface" || exit 0
          git push
