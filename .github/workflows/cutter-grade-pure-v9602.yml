name: HLGB Cutter Grade Pure Module v96.02
on:
  pull_request:
    branches: [main]
    paths: ['release-cutter-planner.js', 'app-stable3.html', 'hlgb-modules/corte/grade-modelo-v9602.js', 'tests/cutter-grade-pure-v9602.cjs', '.github/workflows/cutter-grade-pure-v9602.yml']
  push:
    branches: [main]
    paths: ['release-cutter-planner.js', 'app-stable3.html', 'hlgb-modules/corte/grade-modelo-v9602.js', 'tests/cutter-grade-pure-v9602.cjs', '.github/workflows/cutter-grade-pure-v9602.yml']
permissions: {contents: read}
jobs:
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Module syntax, parity and fallback
        run: |
          node --check release-cutter-planner.js
          node --check hlgb-modules/corte/grade-modelo-v9602.js
          node --test tests/cutter-grade-pure-v9602.cjs
          node tests/audit-cutter-planner-regression.cjs
          node --test tests/cutter-save-confirm-v9580.cjs
