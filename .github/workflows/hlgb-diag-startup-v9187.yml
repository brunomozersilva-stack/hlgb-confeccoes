name: Diagnosticar startup HLGB v91.87
on:
  push:
    paths:
      - 'scripts/hlgb_diag_startup_v9187.py'
      - '.github/workflows/hlgb-diag-startup-v9187.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Gerar diagnóstico
        run: python scripts/hlgb_diag_startup_v9187.py
      - name: Salvar relatório
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add debug/startup-v9187.txt
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Diagnóstico startup v91.87"
          git push
