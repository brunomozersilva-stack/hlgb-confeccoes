name: TMP production invoice reconcile v94.20

on:
  push:
    branches:
      - fix/invoiced-production-reconcile-20261027
    paths:
      - .github/workflows/tmp-production-invoice-reconcile-v9420.yml

permissions:
  contents: write

jobs:
  patch_test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/invoiced-production-reconcile-20261027
      - name: Apply patch
        run: python3 scripts/tmp_patch_production_invoice_v9420.py
      - name: Test production invoice reconciliation
        run: node tests/audit-production-invoice-reconcile-v9420.cjs
      - name: Run related regressions
        run: |
          node tests/audit-note-queue-invoice-reconcile-v9419.cjs
          node tests/auditor-boot-dedupe-v9397.js
      - name: Commit functional files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add release-note-integrity.js release-production-render-fix-v9330.js
          git diff --cached --quiet && exit 0
          git commit -m 'fix: reconciliar produção já 100% faturada'
          git push origin HEAD:fix/invoiced-production-reconcile-20261027
