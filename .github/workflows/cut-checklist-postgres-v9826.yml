name: HLGB Corte - Laboratorio checklist persistente v98.26
on:
  pull_request:
    paths:
      - 'tests/cut-checklist-postgres-v9826/**'
      - 'release-cut-organization.js'
      - 'hlgb-modules/producao/cut-separation-core-v9647.js'
      - '.github/workflows/cut-checklist-postgres-v9826.yml'
permissions:
  contents: read
jobs:
  isolated-postgres:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: fixture_only
          POSTGRES_DB: hlgb_fixture
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d hlgb_fixture"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: fixture_only
      PGDATABASE: hlgb_fixture
    steps:
      - uses: actions/checkout@v4
      - name: Verify independent checklist persistence
        run: |
          psql -v ON_ERROR_STOP=1 -f tests/cut-checklist-postgres-v9826/fixture.sql
          psql -v ON_ERROR_STOP=1 -f tests/cut-checklist-postgres-v9826/candidate.sql
          psql -v ON_ERROR_STOP=1 -f tests/cut-checklist-postgres-v9826/contract.sql
      - name: Verify simultaneous sessions and source lock
        run: bash tests/cut-checklist-postgres-v9826/concurrency.sh
      - name: Verify authoritative record source and per-color calculation
        run: |
          psql -v ON_ERROR_STOP=1 -f tests/cut-checklist-postgres-v9826/records-auth.sql
          psql -v ON_ERROR_STOP=1 -f tests/cut-checklist-postgres-v9826/records-source.sql
          psql -v ON_ERROR_STOP=1 -f tests/cut-checklist-postgres-v9826/records-integrated.sql
          psql -v ON_ERROR_STOP=1 -f tests/cut-checklist-postgres-v9826/records-integrated-contract.sql
          bash tests/cut-checklist-postgres-v9826/records-integrated-concurrency.sh
          psql -v ON_ERROR_STOP=1 -f tests/cut-checklist-postgres-v9826/records-read.sql
          psql -v ON_ERROR_STOP=1 -f tests/cut-checklist-postgres-v9826/records-read-contract.sql
          psql -v ON_ERROR_STOP=1 -f tests/cut-checklist-postgres-v9826/records-attachments.sql
          psql -v ON_ERROR_STOP=1 -f tests/cut-checklist-postgres-v9826/records-attachments-contract.sql
          psql -v ON_ERROR_STOP=1 -f tests/cut-checklist-postgres-v9826/records-auth-contract.sql

      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Verify client confirmation contract
        run: node tests/cut-checklist-postgres-v9826/client-confirmation-contract.cjs
      - name: Verify real PostgreSQL through browser candidate (Chromium and WebKit)
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium webkit
          psql -v ON_ERROR_STOP=1 -c "update checklist_lab.user_access set active=true,access='[\"corte\",\"pedidos\",\"produtos\",\"materiais\"]' where role_name='checklist_lab_operator2';"
          for browser in chromium webkit; do
            HLGB_BROWSER=$browser node tests/cut-checklist-postgres-v9826/candidate-browser.cjs
            psql -v ON_ERROR_STOP=1 -c 'delete from checklist_lab.record_attachments; delete from checklist_lab.record_history;'
          done
          psql -v ON_ERROR_STOP=1 -f tests/cut-checklist-postgres-v9826/records-source-contract.sql
