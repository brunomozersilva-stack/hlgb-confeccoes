name: Aplicar HLGB v91.88 estabilidade pré-login
on:
  push:
    paths:
      - 'scripts/hlgb_v9188_gate_startup_after_login.py'
      - '.github/workflows/hlgb-apply-v9188.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Aplicar e validar v91.88
        run: |
          python scripts/hlgb_v9188_gate_startup_after_login.py
          grep -q 'HLGB_AUTH_GATE_V9188' index.html
          grep -q 'Sistema de Gestão v91.88 Multiusuário' index.html
          ! grep -q '329474 bytes omitted' index.html
          test $(wc -c < index.html) -gt 1000000
      - name: Publicar v91.88
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Publicar HLGB v91.88 - módulos somente após autenticação"
          git push
