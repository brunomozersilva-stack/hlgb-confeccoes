name: Aplicar HLGB v92.03
on:
  push:
    paths:
      - 'scripts/hlgb_v9203_cloud_cut_repairs.py'
      - '.github/workflows/hlgb-apply-v9203.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Aplicar v92.03
        run: python scripts/hlgb_v9203_cloud_cut_repairs.py
      - name: Validar v92.03
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          req=['HLGB_V9203_START','v92.03','reloadHubFinance9203','Facção e PIX confirmados na nuvem','materialSeparationParallel:true','syncOrdersToCuts','HLGB_V9202_START','HLGB_V9201_START']
          miss=[x for x in req if x not in s]
          if miss: raise SystemExit('Ausente: '+repr(miss))
          if s.count('<!-- HLGB_V9203_START -->')!=1: raise SystemExit('v92.03 duplicada')
          if s.count('<!-- HLGB_V9202_START -->')!=1: raise SystemExit('v92.02 ausente/duplicada')
          if s.count('<!-- HLGB_V9201_START -->')!=1: raise SystemExit('v92.01 ausente/duplicada')
          print('v92.03 OK')
          PY
      - name: Publicar v92.03
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Publicar HLGB v92.03 - nuvem faccoes hub e corte" || exit 0
          git push
