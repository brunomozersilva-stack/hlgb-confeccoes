name: HLGB Auditor Repair v94.40 + Autocorrect v94.46
on:
  push:
    branches:
      - main
      - fix/auditor-repair-v9440
      - fix/auditor-autocorrect-learning-v9441
      - fix/auditor-autocorrect-active-v9442
      - fix/auditor-production-concurrency-v9443
      - fix/auditor-learning-v9444
      - fix/auditor-record-learning-v9446
  pull_request:
    branches:
      - main
jobs:
  logic:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Sintaxe Auditor Reparador v94.40
        run: node --check release-auditor-repair-v9440.js
      - name: Sintaxe Auditor Autocorretor v94.41
        run: node --check release-auditor-autocorrect-v9441.js
      - name: Sintaxe preparação Auditor v94.42
        run: node --check release-auditor-autocorrect-v9442.js
      - name: Sintaxe coordenador Produção v94.43
        run: node --check release-production-reconcile-v9443.js
      - name: Sintaxe Auditor v94.43
        run: node --check release-auditor-autocorrect-v9443.js
      - name: Sintaxe Auditor v94.44
        run: node --check release-auditor-autocorrect-v9444.js
      - name: Sintaxe Auditor v94.46
        run: node --check release-auditor-autocorrect-v9446.js
      - name: Sintaxe gate pós-login v94.42
        run: node --check release-login-confirm-gate-v9407.js
      - name: Sintaxe reconciliador Produção endurecido
        run: node --check release-production-reconcile-v9439.js
      - name: Sintaxe interface de ação única
        run: node --check release-auditor-single-ui-reclaim-v9434a.js
      - name: Contratos v94.40
        run: node tests/auditor-repair-v9440.js
      - name: Comportamento e evidências v94.40
        run: node tests/auditor-repair-v9440-behavior.js
      - name: Contratos v94.41
        run: node tests/auditor-autocorrect-v9441.js
      - name: Aprendizado, segurança e relatórios v94.41
        run: node tests/auditor-autocorrect-v9441-behavior.js
      - name: Preparação sem falso sucesso v94.42
        run: node tests/auditor-autocorrect-v9442-behavior.js
      - name: Segurança conservadora de Produção v94.42
        run: node tests/production-v9442-unit.js
      - name: Concorrência aguardável de Produção v94.43
        run: node tests/production-v9443-concurrency.js
      - name: Aprendizado sem dupla penalização v94.44
        run: node tests/auditor-autocorrect-v9444-learning.js
      - name: Confiança por registro isolada v94.46
        run: node tests/auditor-autocorrect-v9446-learning.js
      - name: Regressão de login
        run: node tests/runtime-login-ready-v9378.js
  browsers:
    strategy:
      fail-fast: false
      matrix:
        browser: [webkit, chromium]
    env:
      HLGB_BROWSER: ${{ matrix.browser }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Instalar Playwright WebKit e Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps webkit chromium
      - name: Iniciar servidor local
        run: |
          python3 -m http.server 4173 >/tmp/hlgb-9446-http.log 2>&1 &
          sleep 2
      - name: Login real continua abrindo
        run: node tests/login-3d-v9409-webkit.js
      - name: Auditor continua com uma ação
        run: node tests/auditor-single-ui-v9434a-webkit.js
      - name: Reparadores reais e preparação v94.42
        run: node tests/auditor-autocorrect-v9442-runtime.js
      - name: Concorrência real do Auditor v94.43
        run: node tests/auditor-autocorrect-v9443-runtime.js
      - name: Aprendizado global corrigido v94.44
        run: node tests/auditor-autocorrect-v9444-runtime.js
      - name: Confiança por registro real v94.46
        run: node tests/auditor-autocorrect-v9446-runtime.js
      - name: Reconciliação de produção nas três filas
        run: node tests/production-save-auditor-v9439-browser.js
      - name: Relatório automático 18h continua não navegante
        run: node tests/auditor-rapid-learning-v9437-webkit.js
      - name: Corrida de navegação continua corrigida
        run: node tests/navigation-race-v9439-webkit.js