name: Diagnosticar HLGB v91.99
on:
  push:
    paths:
      - 'scripts/hlgb_diag_v9199_details.py'
      - '.github/workflows/hlgb-diag-v9199.yml'
  workflow_dispatch:
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Diagnosticar detalhes
        run: python scripts/hlgb_diag_v9199_details.py
