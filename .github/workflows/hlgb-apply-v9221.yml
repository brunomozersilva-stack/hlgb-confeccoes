name: Aplicar HLGB v92.21 projeção semanal dos cortadores
on:
  push:
    paths:
      - 'scripts/hlgb_v9221_cutter_excel_controls.py'
      - '.github/workflows/hlgb-apply-v9221.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Montar página v92.21
        run: python scripts/hlgb_v9221_cutter_excel_controls.py
      - name: Validar projeção dos cortadores e JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('app9221.html').read_text(encoding='utf-8')
          abrir=Path('abrir.html').read_text(encoding='utf-8')
          req=['id="loginUser"','id="loginPass"','onclick="return doLogin()"','HLGB_V9221_CUTTER_EXCEL_CONTROLS_START','Valor por dia em cada local','hlgbUpdateCutterExcel9221','productionLocationId','app9221.html?v=92.21','v92.21']
          miss=[x for x in req if x not in s+abrir]
          if miss: raise SystemExit('Itens obrigatórios ausentes: '+repr(miss))
          start=s.index('<!-- HLGB_V9221_CUTTER_EXCEL_CONTROLS_START -->')
          end=s.index('<!-- HLGB_V9221_CUTTER_EXCEL_CONTROLS_END -->',start)
          block=s[start:end]
          if 'MutationObserver' in block: raise SystemExit('v92.21 não pode criar observer global')
          js=block.split('<script>',1)[1].rsplit('</script>',1)[0]
          Path('/tmp/v9221.js').write_text(js,encoding='utf-8')
          print('Estrutura v92.21 OK')
          PY
          node --check /tmp/v9221.js
      - name: Publicar v92.21
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app9221.html abrir.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Publicar HLGB v92.21 - melhorar projeção semanal dos cortadores"
          git push
