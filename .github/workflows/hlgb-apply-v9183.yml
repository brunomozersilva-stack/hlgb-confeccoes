name: Aplicar HLGB v91.83 corrigir JavaScript do login
on:
  push:
    paths:
      - 'scripts/hlgb_v9183_fix_js_login.py'
      - '.github/workflows/hlgb-apply-v9183.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Aplicar e validar v91.83
        run: python scripts/hlgb_v9183_fix_js_login.py
      - name: Confirmar versao e login
        run: |
          grep -q 'Versão v91.83' index.html
          grep -q 'function doLogin()' index.html || grep -q 'function doLogin(){' index.html
      - name: Publicar alteracao
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Publicar HLGB v91.83 - corrigir JavaScript do login"
          git push
