name: Aplicar HLGB v91.83 corrigir JavaScript do login
on:
  push:
    paths:
      - 'scripts/hlgb_v9183_relocate_v9179.py'
      - '.github/workflows/hlgb-apply-v9183.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Aplicar reparo estrutural e registrar diagnostico
        run: |
          mkdir -p debug
          if python scripts/hlgb_v9183_relocate_v9179.py > debug/v9183-repair.log 2>&1; then
            echo PASS > debug/v9183-status.txt
          else
            git checkout -- index.html
            echo FAIL > debug/v9183-status.txt
          fi
      - name: Publicar diagnostico se o reparo falhar
        run: |
          if grep -q '^FAIL$' debug/v9183-status.txt; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add debug/v9183-repair.log debug/v9183-status.txt
            git commit -m "Diagnostico reparo v91.83 [skip ci]" || true
            git push || true
            cat debug/v9183-repair.log
            exit 1
          fi
      - name: Confirmar versao e login
        run: |
          grep -q 'Versão v91.83' index.html
          grep -q 'function doLogin()' index.html || grep -q 'function doLogin(){' index.html
          test "$(grep -c '<!-- HLGB_V9179_START -->' index.html)" -eq 1
          test "$(grep -c '<!-- HLGB_V9179_END -->' index.html)" -eq 1
      - name: Publicar alteracao
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Publicar HLGB v91.83 - reparar JavaScript do login"
          git push
