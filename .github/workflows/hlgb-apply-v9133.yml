name: HLGB v91.33 integridade de exclusoes

on:
  push:
    branches: [main]
    paths:
      - 'scripts/hlgb_v9133_integrity_hardening.py'
      - 'scripts/hlgb_v9133_addon.html'
      - '.github/workflows/hlgb-apply-v9133.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply v91.33 integrity hardening
        run: python3 scripts/hlgb_v9133_integrity_hardening.py
      - name: Validate JavaScript and safety guards
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess, tempfile, os
          s=Path('index.html').read_text(encoding='utf-8')
          required=[
            'v91.33 Multiusuário',
            'HLGB v91.33 EXPLICIT DELETE HARDENING',
            'hubFinanceEntries:"hubFinanceiro"',
            '__hlgb_explicit_delete=true',
            'HLGB v91.32 EMPLOYEE MASTER SAFETY',
            'HLGB v91.31 RECONCILIACAO OPERACIONAL',
            'HLGB v91.28 AUTHORITATIVE RECORD MERGE',
            'HLGB v91.26 DATA INTEGRITY GUARD',
            'ausência local nunca gera exclusão automática na nuvem.'
          ]
          for x in required:
            assert x in s, f'missing {x}'
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.S|re.I)
          for i,js in enumerate(scripts):
            if not js.strip(): continue
            fd,path=tempfile.mkstemp(suffix='.js');os.close(fd)
            Path(path).write_text(js,encoding='utf-8')
            r=subprocess.run(['node','--check',path],capture_output=True,text=True)
            os.unlink(path)
            if r.returncode:
              raise SystemExit(f'Inline script {i} failed:\n{r.stderr}')
          print('validation ok -',len(scripts),'script blocks')
          PY
      - name: Commit validated v91.33 index
        run: |
          if git diff --quiet -- index.html; then
            echo 'No index changes to commit'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Harden explicit deletes and hub sync v91.33'
          git push origin main
