name: TMP apply HLGB round v94.22
on:
  push:
    branches: [integration/hlgb-round-20261027]
    paths: [.github/workflows/tmp-apply-round-v9422.yml]
permissions:
  contents: write
jobs:
  patch_test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: integration/hlgb-round-20261027
          fetch-depth: 0
      - name: Trazer correção de Produção da PR 86
        run: |
          git fetch origin fix/invoiced-production-reconcile-20261027 --depth=1
          git checkout FETCH_HEAD -- release-note-integrity.js release-production-render-fix-v9330.js tests/audit-production-invoice-reconcile-v9420.cjs
      - name: Aplicar rota, busca nota avulsa, Hub e carregamento do acerto
        run: python3 scripts/tmp_patch_round_v9422.py
      - name: Validar sintaxe e regressões focadas
        run: |
          set -euo pipefail
          node --check release-operations-pack.js
          node --check release-note-integrity.js
          node --check release-hub-search.js
          node --check release-hub-integrity.js
          node --check release-trade-settlement-v9422.js
          node --check tests/audit-round-v9422-webkit.js
          node tests/audit-production-invoice-reconcile-v9420.cjs
          node tests/audit-cut-grade-matrix-v9421.cjs
          node tests/audit-round-v9422.cjs
          node tests/auditor-boot-dedupe-v9397.js
      - name: Commitar somente arquivos funcionais e testes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app-stable3.html release-operations-pack.js release-note-integrity.js release-production-render-fix-v9330.js release-hub-search.js release-hub-integrity.js tests/audit-production-invoice-reconcile-v9420.cjs
          git diff --cached --quiet && exit 0
          git commit -m 'feat: integrar Produção, rotas, nota avulsa, Hub e acertos v94.22'
          git push origin HEAD:integration/hlgb-round-20261027
