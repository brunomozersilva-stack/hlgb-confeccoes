name: Aplicar HLGB v92.32 demonstrativo semanal faccoes
on:
  push:
    paths:
      - 'scripts/hlgb_v9232_faction_weekly_statement.py'
      - '.github/workflows/hlgb-apply-v9232.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Montar pagina v92.32
        run: python scripts/hlgb_v9232_faction_weekly_statement.py
      - name: Validar agrupamento, impressao e sintaxe
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, subprocess
          s=Path('app9232.html').read_text(encoding='utf-8')
          required=[
            '<title>HLGB Confecções — Sistema de Gestão v92.32 Multiusuário</title>',
            '>v92.32</small>',
            'HLGB_V9232_FACTION_WEEKLY_STATEMENT_START',
            'window.hlgbFactionStatement9232',
            'window.hlgbPrintFactionStatement9232',
            'window.hlgbPrintFactionPeriod9232',
            "table(['Semana','Facção','PIX','Modelos / serviços'",
            "table(['Facção','Peças','Total do período','Pendente','Pago','Chave PIX','Acerto']",
            'Salvar como PDF',
          ]
          missing=[x for x in required if x not in s]
          if missing: raise SystemExit('Itens obrigatórios ausentes: '+repr(missing))
          if 'v92.31' in s: raise SystemExit('Ainda existe carimbo visual/textual v92.31 na página v92.32')
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,flags=re.S|re.I)
          checked=0
          for i,js in enumerate(scripts):
            if not js.strip(): continue
            p=Path('/tmp')/f'hlgb9232_{i}.js'
            p.write_text(js,encoding='utf-8')
            r=subprocess.run(['node','--check',str(p)],capture_output=True,text=True)
            if r.returncode:
              raise SystemExit(f'Erro de sintaxe no script #{i}:\n{r.stderr}')
            checked+=1
          print(f'{checked} blocos JavaScript validados.')
          print('Agrupamento e demonstrativo v92.32 OK.')
          PY
      - name: Publicar v92.32
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app9232.html abrir.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Publicar HLGB v92.32 - demonstrativo semanal detalhado das faccoes"
          git push
