name: Publicar HLGB v92.40

on:
  push:
    paths:
      - 'scripts/hlgb_v9240_integrity_patch.py'
      - 'scripts/hlgb_v9240_grade_link_patch.py'
      - 'scripts/hlgb_v9240_cut_production_qty_patch.py'
      - 'scripts/hlgb_v9240_material_separation_patch.py'
      - 'scripts/hlgb_v9240_memory_guard_patch.py'
      - 'scripts/hlgb_v9240_projection_client_totals_patch.py'
      - 'scripts/hlgb_v9240_version_pending_patch.py'
      - 'scripts/hlgb_v9240_launcher.py'
      - '.github/workflows/hlgb-apply-v9240.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Gerar versão 92.40
        run: |
          python scripts/hlgb_v9240_integrity_patch.py
      - name: Hotfix login multiusuário paginado
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('app9240.html')
          s = p.read_text(encoding='utf-8')
          fn = 'async function hlgbRecordLoadBundle({preserveLocal=false,since=null}={}){'
          start = s.find(fn)
          if start < 0:
              raise SystemExit('hlgbRecordLoadBundle não encontrado')
          body = s.find('  const body={p_since:since||null};', start)
          if body < 0:
              raise SystemExit('início do carregador não encontrado')
          replace_start = s.find('\n', body) + 1
          replace_end = s.find('  if(Array.isArray(bundle)', replace_start)
          if replace_end < 0:
              raise SystemExit('fim do bloco de bundle não encontrado')
          hotfix = (
              '  let bundle;\n'
              '  // v92.40 hotfix: carga paginada para todos os usuários.\n'
              '  // Evita falha de inicialização quando há muitos registros.\n'
              '  bundle=await hlgbRecordLoadDirect(since);\n'
          )
          s = s[:replace_start] + hotfix + s[replace_end:]
          p.write_text(s, encoding='utf-8')
          print('hotfix multiusuário aplicado')
          PY
      - name: Vincular grade, produção, separação, memória e projeção
        run: |
          python scripts/hlgb_v9240_grade_link_patch.py
          python scripts/hlgb_v9240_cut_production_qty_patch.py
          python scripts/hlgb_v9240_material_separation_patch.py
          python scripts/hlgb_v9240_memory_guard_patch.py
          python scripts/hlgb_v9240_projection_client_totals_patch.py
          python scripts/hlgb_v9240_version_pending_patch.py
          python scripts/check_html_scripts.py app9240.html
          python scripts/hlgb_v9240_launcher.py
      - name: Diagnosticar sessão e catálogos
        run: |
          python - <<'PY'
          from pathlib import Path
          s = Path('app9240.html').read_text(encoding='utf-8')
          checks = [
              ('MODULES', 'HLGB_RECORD_MODULES', 1800),
              ('DIRECT', 'async function hlgbRecordLoadDirect', 3000),
              ('BUNDLE', 'async function hlgbRecordLoadBundle', 2800),
              ('RESTORE', 'function cloudRestoreStoredAuth', 2200),
              ('LOGIN', 'function enableAppAfterLogin', 2600),
              ('MATERIALS', 'loadCloudMaterials', 1600),
              ('REFRESH_MATERIALS', 'refreshSupabaseMaterials', 1600),
          ]
          for label, needle, span in checks:
              pos = s.find(needle)
              print(f'--- DIAG {label} pos={pos} ---')
              if pos >= 0:
                  print(s[max(0,pos-250):pos+span])
          PY
      - name: Publicar versão 92.40
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: Publicar HLGB v92.40 com proteção de memória
          file_pattern: app9240.html abrir.html index.html
