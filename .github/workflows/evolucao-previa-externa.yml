name: HLGB Evolucao - Verificar previa publica
on:
  push:
    branches:
      - feature/evolucao-laboratorio-isolado-v1-20261114
    paths:
      - 'evolucao-lab/entrada.html'
      - '.github/workflows/evolucao-previa-externa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preview:
    name: Verificar links publicos HTML da branch isolada
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Conferir a entrada e os links apenas para prototipos
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          from html.parser import HTMLParser
          page=Path('evolucao-lab/entrada.html').read_text()
          class Links(HTMLParser):
              def __init__(self): super().__init__(); self.links=[]
              def handle_starttag(self,tag,attrs):
                  if tag=='a':
                      for key,value in attrs:
                          if key=='href':self.links.append(value)
          links=Links();links.feed(page)
          assert len(links.links)==13, links.links
          for url in links.links:
              assert url.startswith('./') and re.fullmatch(r'[A-Za-z0-9_./-]+\.html',url),url
              assert '..' not in url,url
              assert Path('evolucao-lab',url).is_file(),url
              assert 'integracao' not in url,url
          print('PASS: 13 links estáticos, todos os arquivos presentes, nenhum servidor local exposto')
          PY
      - name: Verificar entrega HTTPS pela URL publica de desenvolvimento
        shell: bash
        run: |
          set -euo pipefail
          root="https://raw.githack.com/brunomozersilva-stack/hlgb-confeccoes/feature/evolucao-laboratorio-isolado-v1-20261114/evolucao-lab"
          for page in entrada.html sincronizacao-duas-sessoes.html guardiao-preservacao.html homologacao-modulos.html central-operacional-2.html fluxo-producao-integrado.html planejador-materiais.html fluxos-operacionais.html acertos-simulador.html transacoes-simuladas.html permissoes/permissoes-mobile.html preservacao.html paridade-critica.html prototipo.html; do
            echo "Verificando $page"
            curl -fSL --retry 5 --retry-delay 5 --connect-timeout 15 --max-time 45 --output /tmp/hlgb-preview.html --dump-header /tmp/hlgb-preview-headers.txt "$root/$page"
            grep -Eiq '^content-type: text/html' /tmp/hlgb-preview-headers.txt || { echo "::error::Content-Type incorreto para $page"; cat /tmp/hlgb-preview-headers.txt; exit 1; }
            grep -iq '<html' /tmp/hlgb-preview.html || { echo "::error::Arquivo não é HTML: $page"; exit 1; }
            echo "PASS HTML: $page"
          done
          grep -q 'Prévia para você testar' /tmp/hlgb-preview.html || true
