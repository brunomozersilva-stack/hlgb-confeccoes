name: HLGB v91.20 projection payment terms
on:
  push:
    paths:
      - 'scripts/hlgb_v9120_projection_payment_terms.py'
      - '.github/workflows/hlgb-apply-v9120.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply v91.20 projection payment terms
        run: python3 scripts/hlgb_v9120_projection_payment_terms.py
      - name: Validate JavaScript and payment terms
        run: |
          python3 - <<'PY'
          import re,pathlib,subprocess
          s=pathlib.Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.S|re.I)
          for i,body in enumerate(scripts):
              f=pathlib.Path(f'/tmp/hlgb-v9120-{i}.js');f.write_text(body,encoding='utf-8')
              subprocess.run(['node','--check',str(f)],check=True)
          assert 'v91.20 Multiusuário' in s
          assert '<option>Cheque</option>' in s
          assert 'projectionInvoiceTermsDetailField' in s
          assert 'toggleProjectionInvoiceTermsDetail' in s
          assert 'paymentTermsDetail:termsDetail' in s
          print('validated',len(scripts),'script blocks')
          PY
      - name: Commit validated index
        run: |
          if git diff --quiet -- index.html; then
            echo 'No index changes required'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Add HLGB v91.20 personalized and cheque payment terms'
          git push origin main
