name: HLGB v91.49 recuperar folha e Hub

on:
  push:
    branches: [main]
    paths:
      - 'scripts/hlgb_v9149_recovery_addon.html'
      - 'scripts/hlgb_v9149_patch.py'
      - '.github/workflows/hlgb-apply-v9149.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply v91.49 forensic recovery
        run: python3 scripts/hlgb_v9149_patch.py
      - name: Validate recovery safeguards and all inline JavaScript
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess, tempfile, os
          s=Path('index.html').read_text(encoding='utf-8')
          assert 'HLGB v91.49 FORENSIC PAYROLL + HUB RECOVERY' in s
          assert 'v91.49 Multiusuário' in s
          assert "const MAIN949='confeccao_v2'" in s
          assert "const PENDING949='hlgb_records_pending_v91'" in s
          assert "hlgbRecordSaveWithRetry(module,String(targetId)" in s
          assert "b.paid!==true" in s
          assert "payKey949" in s
          assert "recoveredBy:'v91.49'" in s
          assert "hlgb_v9149_recovery_journal" in s
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.S|re.I)
          errors=[]
          for i,js in enumerate(scripts):
              fd,p=tempfile.mkstemp(suffix='.js'); os.close(fd)
              Path(p).write_text(js,encoding='utf-8')
              r=subprocess.run(['node','--check',p],capture_output=True,text=True)
              os.unlink(p)
              if r.returncode: errors.append(f'SCRIPT {i}:\n{r.stderr}')
          if errors: raise SystemExit('\n\n'.join(errors))
          print(f'v91.49 validation OK: {len(scripts)} inline scripts checked')
          PY
      - name: Commit validated v91.49 index
        run: |
          if git diff --quiet -- index.html; then
            echo 'No index changes to commit'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Recover lost payroll paid flags and hub edits v91.49'
          git push origin main
