name: Aplicar HLGB v92.20 estabilidade visual
on:
  push:
    paths:
      - 'scripts/hlgb_v9220_screen_stability.py'
      - '.github/workflows/hlgb-apply-v9220.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Montar página v92.20
        run: python scripts/hlgb_v9220_screen_stability.py
      - name: Validar estabilidade e JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('app9220.html').read_text(encoding='utf-8')
          both=s+Path('abrir.html').read_text(encoding='utf-8')
          req=['id="loginUser"','id="loginPass"','onclick="return doLogin()"','HLGB_V9220_SCREEN_STABILITY_START','hlgbScheduleStableRender9220','hlgbStableRenderNow9220','app9220.html?v=92.20','v92.20']
          miss=[x for x in req if x not in both]
          if miss: raise SystemExit('Itens obrigatórios ausentes: '+repr(miss))
          start=s.index('<!-- HLGB_V9220_SCREEN_STABILITY_START -->')
          block=s[start:s.index('</script>',start)+9]
          if 'MutationObserver' in block: raise SystemExit('Observer global não permitido na v92.20')
          js=block.split('<script>',1)[1].rsplit('</script>',1)[0]
          Path('/tmp/v9220-marker.js').write_text(js,encoding='utf-8')
          print('Estrutura v92.20 OK')
          PY
          node --check /tmp/v9220-marker.js
      - name: Publicar v92.20
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app9220.html abrir.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Publicar HLGB v92.20 - estabilizar atualizacoes da tela"
          git push
