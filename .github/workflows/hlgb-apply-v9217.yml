name: Aplicar HLGB v92.17 reconciliar etapas com entregas
on:
  push:
    paths:
      - 'scripts/hlgb_v9217_stage_reconciliation.py'
      - '.github/workflows/hlgb-apply-v9217.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Montar página v92.17
        run: python scripts/hlgb_v9217_stage_reconciliation.py
      - name: Validar reconciliação e JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('app9217.html').read_text(encoding='utf-8')
          req=['id="loginUser"','id="loginPass"','onclick="return doLogin()"','HLGB_V9217_STAGE_RECONCILIATION_START','hlgbSyncCustomerStage9217','hlgbHideCoveredPlannedCuts9217','workflowStageReconciled','await window.hlgbSyncCustomerStage9217','app9217.html?v=92.17']
          both=s+Path('abrir.html').read_text(encoding='utf-8')
          miss=[x for x in req if x not in both]
          if miss: raise SystemExit('Itens obrigatórios ausentes: '+repr(miss))
          a=s.index('<!-- HLGB_V9217_STAGE_RECONCILIATION_START -->');b=s.index('<!-- HLGB_V9217_STAGE_RECONCILIATION_END -->',a)
          block=s[a:b]
          if 'MutationObserver' in block: raise SystemExit('Observer não permitido na v92.17')
          js=block.split('<script>',1)[1].rsplit('</script>',1)[0]
          Path('/tmp/v9217.js').write_text(js,encoding='utf-8')
          print('Estrutura v92.17 OK')
          PY
          node --check /tmp/v9217.js
      - name: Publicar v92.17
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app9217.html abrir.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Publicar HLGB v92.17 - reconciliar etapas com entregas"
          git push
