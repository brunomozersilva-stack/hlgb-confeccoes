name: Runtime v93.71
on:
  push:
    branches:
      - fix/runtime-render-save-v9371
  workflow_dispatch:
jobs:
  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Sintaxe runtime v93.71
        run: node --check release-runtime-performance-v9371.js
      - name: Sintaxe saúde matéria-prima
        run: node --check release-material-health-v9260.js
      - name: Sintaxe produção
        run: node --check release-auditor-production-v9369.js
      - name: Instalar Playwright WebKit
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps webkit
      - name: Iniciar servidor local
        run: |
          python3 -m http.server 4173 >/tmp/hlgb-runtime-http.log 2>&1 &
          echo $! >/tmp/hlgb-runtime-http.pid
          sleep 2
      - name: Correções runtime v93.71 WebKit
        run: node tests/runtime-v9371-webkit.js
      - name: Matéria-prima sem rerender desnecessário
        run: node tests/material-health-v9371-webkit.js
      - name: Integração produção v93.71 WebKit
        run: node tests/production-v9371-webkit.js
