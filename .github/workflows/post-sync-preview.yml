name: HLGB Post-Sync Preview Package

on:
  push:
    branches:
      - melhorias-pos-sync-20261001
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build local preview package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p preview
          files=(
            abrir.html
            app-stable3.html
            app9240.html
            hotfix9241.js
            release-current.js
            release-pricing.js
            release-limits.js
            release-cut-view.js
            release-record-integrity.js
            release-notes.js
            release-note-integrity.js
            release-projection-delivery-integrity.js
            release-projection-team-view.js
            release-faction-payments.js
            release-faction-integrity.js
            release-faction-master-integrity.js
            release-payroll-integrity.js
            release-payroll-termination-provisions.js
            release-checklist-integrity.js
            release-capacity-integrity.js
            release-hub-tombstone-online.js
            release-hub-personal-integrity.js
            release-hub-search.js
            release-hub-integrity.js
            release-ui-stability.js
            release-diagnostics-center.js
            release-internal-auditor.js
            release-assistant-query.js
          )
          for f in "${files[@]}"; do
            test -f "$f"
            cp "$f" preview/
          done

          cat > preview/preview-server.py <<'PY'
          from http.server import ThreadingHTTPServer, SimpleHTTPRequestHandler
          import os
          HOST="127.0.0.1"; PORT=8765
          class NoCache(SimpleHTTPRequestHandler):
              def end_headers(self):
                  self.send_header("Cache-Control","no-store, no-cache, must-revalidate")
                  self.send_header("Pragma","no-cache")
                  self.send_header("Expires","0")
                  super().end_headers()
          os.chdir(os.path.dirname(os.path.abspath(__file__)))
          print(f"HLGB local: http://{HOST}:{PORT}/abrir.html", flush=True)
          ThreadingHTTPServer((HOST,PORT),NoCache).serve_forever()
          PY

          cat > preview/start-preview.command <<'SH'
          #!/bin/bash
          set -e
          cd "$(dirname "$0")"
          echo ""
          echo "HLGB — teste local das melhorias pós-sincronização"
          echo "Branch: melhorias-pos-sync-20261001"
          echo "Commit: __COMMIT__"
          echo ""
          echo "Abra no Safari:"
          echo "http://localhost:8765/abrir.html"
          echo ""
          echo "Para encerrar, pressione Control + C nesta janela."
          echo ""
          python3 preview-server.py
          SH
          sed -i "s/__COMMIT__/$GITHUB_SHA/g" preview/start-preview.command
          chmod +x preview/start-preview.command

          cat > preview/LEIA-ME.txt <<EOF
          HLGB CONFECÇÕES — TESTE LOCAL DAS MELHORIAS PÓS-SINCRONIZAÇÃO

          Branch: melhorias-pos-sync-20261001
          Commit: $GITHUB_SHA

          Este pacote NÃO publica o main.

          COMO ABRIR NO MAC:
          1. Descompacte o ZIP.
          2. Abra start-preview.command.
          3. Deixe o Terminal aberto.
          4. Abra no Safari: http://localhost:8765/abrir.html

          CONFERIR:
          - Sistema > Auditor / Testes
          - Projeção semanal > Visão da equipe e Visão administrativa
          - Hub Financeiro: rescisão não deve aparecer como gasto pessoal
          - RH > Provisões: desligados não devem gerar saldo futuro
          - Assistente HLGB: consultas e prévias; não salvar ações sem revisar

          Não crie pedido TESTE para esta rodada.
          EOF

          (
            cd preview
            shasum -a 256 abrir.html app-stable3.html app9240.html *.js preview-server.py start-preview.command > MANIFEST-SHA256.txt
          )

      - uses: actions/upload-artifact@v4
        with:
          name: HLGB-POST-SYNC-PREVIEW-${{ github.sha }}
          path: preview/
          if-no-files-found: error
          retention-days: 7
