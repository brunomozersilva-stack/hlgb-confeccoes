name: HLGB v91.22 pedido avulso igual pedido normal

on:
  push:
    branches: [main]
    paths:
      - 'scripts/hlgb_v9122_adhoc_same_as_order.py'
      - 'scripts/hlgb_v9122_relocate_addon.py'
      - '.github/workflows/hlgb-apply-v9122.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply v91.22 pedido avulso
        run: |
          python3 scripts/hlgb_v9122_adhoc_same_as_order.py
          python3 scripts/hlgb_v9122_relocate_addon.py
      - name: Validate JavaScript and pedido avulso
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess, tempfile, os
          s=Path('index.html').read_text(encoding='utf-8')
          assert 'v91.22 Multiusuário' in s
          assert 'HLGB v91.22 PEDIDO AVULSO' in s
          assert 'Sem grade — quantidade total por produto' in s
          assert 'Com grade completa — igual pedido normal' in s
          assert 'isAdHoc:true,noGrade:!useGrade' in s
          assert s.rfind('HLGB v91.22 PEDIDO AVULSO') > s.find('</script>')
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.S|re.I)
          for i,js in enumerate(scripts):
              if not js.strip(): continue
              fd,path=tempfile.mkstemp(suffix='.js');os.close(fd)
              Path(path).write_text(js,encoding='utf-8')
              r=subprocess.run(['node','--check',path],capture_output=True,text=True)
              os.unlink(path)
              if r.returncode:
                  raise SystemExit(f'Inline script {i} failed:\n{r.stderr}')
          print('validation ok')
          PY
      - name: Commit validated index
        run: |
          if git diff --quiet -- index.html; then
            echo 'No index changes to commit'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Make pedido avulso follow normal order flow v91.22'
          git push origin main
