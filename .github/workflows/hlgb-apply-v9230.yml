name: Aplicar HLGB v92.30 acertos agrupados faccao
on:
  push:
    paths:
      - 'scripts/hlgb_v9230_group_faction_payments.py'
      - '.github/workflows/hlgb-apply-v9230.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Montar pagina v92.30
        run: python scripts/hlgb_v9230_group_faction_payments.py
      - name: Validar v92.30
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('app9230.html').read_text(encoding='utf-8')
          req=['HLGB_V9230_GROUP_FACTION_PAYMENTS_START','hlgbPayFactionGroup9230','hlgbFactionGroupDetails9230','Registrar um único acerto','scheduledPaymentWeek','v92.30']
          miss=[x for x in req if x not in s]
          if miss: raise SystemExit('Itens ausentes: '+repr(miss))
          a=s.index('<!-- HLGB_V9230_GROUP_FACTION_PAYMENTS_START -->');b=s.index('<!-- HLGB_V9230_GROUP_FACTION_PAYMENTS_END -->',a)
          js=s[a:b].split('<script>',1)[1].rsplit('</script>',1)[0]
          Path('/tmp/v9230.js').write_text(js,encoding='utf-8')
          print('Estrutura v92.30 OK')
          PY
          node --check /tmp/v9230.js
      - name: Publicar v92.30
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app9230.html abrir.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Publicar HLGB v92.30 - agrupar acertos de faccao por semana"
          git push
