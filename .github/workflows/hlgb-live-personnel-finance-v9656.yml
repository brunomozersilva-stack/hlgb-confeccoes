name: HLGB Comercial - Folha e Hub consulta integrada v96.56
on:
  pull_request:
    paths:
      - 'hlgb-modules/financeiro/live-personnel-finance-view-v9656.js'
      - 'hlgb-modules/financeiro/hub-intelligence-adapter-v9633.js'
      - 'tests/hlgb-hub-intelligence-adapter-v9633.cjs'
      - 'tests/hlgb-rh-finance-v9667-browser.cjs'
      - 'tests/hlgb-live-personnel-finance-v9656.cjs'
      - 'tests/hlgb-live-finance-integrated-v9657.cjs'
      - 'hlgb-modules/financeiro/rh-*'
      - 'hlgb-modules/financeiro/attendance-transport-*'
      - 'tests/hlgb-rh-*.cjs'
      - 'tests/hlgb-attendance-stage-view.cjs'
      - '.github/workflows/hlgb-live-personnel-finance-v9656.yml'
      - 'app-stable3.html'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: node tests/hlgb-hub-intelligence-adapter-v9633.cjs
      - run: node tests/hlgb-live-personnel-finance-v9656.cjs
      - run: node tests/hlgb-live-finance-integrated-v9657.cjs
      - run: node tests/hlgb-integration-v9651.cjs
      - run: node tests/hlgb-rh-planning-v9636.cjs
      - run: node tests/hlgb-rh-live-view-v9667.cjs
      - run: node tests/hlgb-attendance-stage-view.cjs

  browser-rh:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm install --no-save playwright@1.55.0 && npx playwright install --with-deps ${{ matrix.browser }}
      - env:
          HLGB_BROWSER: ${{ matrix.browser }}
        run: |
          node tests/hlgb-rh-stage-browser.cjs
          node tests/hlgb-rh-finance-v9667-browser.cjs
