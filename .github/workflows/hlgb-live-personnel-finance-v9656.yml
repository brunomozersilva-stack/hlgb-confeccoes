name: HLGB Comercial - Folha e Hub consulta integrada v96.56
on:
  pull_request:
    paths:
      - 'hlgb-modules/financeiro/live-personnel-finance-view-v9656.js'
      - 'tests/hlgb-live-personnel-finance-v9656.cjs'
      - 'tests/hlgb-live-finance-integrated-v9657.cjs'
      - 'hlgb-modules/financeiro/rh-planning-v9636.js'
      - 'hlgb-modules/financeiro/rh-live-view-v9667.js'
      - 'tests/hlgb-rh-planning-v9636.cjs'
      - 'tests/hlgb-rh-live-view-v9667.cjs'
      - 'app-stable3.html'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: node tests/hlgb-live-personnel-finance-v9656.cjs
      - run: node tests/hlgb-live-finance-integrated-v9657.cjs
      - run: node tests/hlgb-rh-planning-v9636.cjs
      - run: node tests/hlgb-rh-live-view-v9667.cjs
      - run: node tests/hlgb-integration-v9651.cjs
