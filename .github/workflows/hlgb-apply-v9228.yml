name: Aplicar HLGB v92.28 checklist grade e materiais por destino
on:
  push:
    paths:
      - 'scripts/hlgb_v9228_checklist_grade_material_visibility.py'
      - '.github/workflows/hlgb-apply-v9228.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Montar página v92.28
        run: python scripts/hlgb_v9228_checklist_grade_material_visibility.py
      - name: Validar checklist v92.28
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('app9228.html').read_text(encoding='utf-8')
          req=['HLGB_V9228_CHECKLIST_GRADE_MATERIAL_VISIBILITY_START','openChecklistGrade9228','openChecklistMaterialSettings9228','Grade do produto enviado','showFactionChecklist','showProductionChecklist','app9228.html?v=92.28']
          launcher=Path('abrir.html').read_text(encoding='utf-8')
          miss=[x for x in req if x not in s and x not in launcher]
          if miss: raise SystemExit('Itens v92.28 ausentes: '+repr(miss))
          a=s.index('<!-- HLGB_V9228_CHECKLIST_GRADE_MATERIAL_VISIBILITY_START -->')
          b=s.index('<!-- HLGB_V9228_CHECKLIST_GRADE_MATERIAL_VISIBILITY_END -->',a)
          block=s[a:b]
          js=block.split('<script>',1)[1].rsplit('</script>',1)[0]
          Path('/tmp/v9228_addon.js').write_text(js,encoding='utf-8')
          PY
          node --check /tmp/v9228_addon.js
      - name: Publicar v92.28
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app9228.html abrir.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Publicar HLGB v92.28 - grade do checklist e materias por destino"
          git push
