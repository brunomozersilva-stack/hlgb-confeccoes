name: HLGB v91.57 corrige prontidão da nuvem

on:
  push:
    branches: [main]
    paths:
      - 'scripts/hlgb_v9157_cloud_ready_fix.py'
      - '.github/workflows/hlgb-apply-v9157.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply v91.57 cloud readiness fix
        run: python3 scripts/hlgb_v9157_cloud_ready_fix.py
      - name: Validate v91.57 and all inline JavaScript
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess, tempfile, os
          s=Path('index.html').read_text(encoding='utf-8')
          assert 'v91.57 Multiusuário' in s
          assert "const VER955='91.57';" in s
          assert "typeof cloudAccessToken!=='undefined'" in s
          assert "typeof hlgbRecordReady!=='undefined'" in s
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.S|re.I)
          errors=[]
          for i,js in enumerate(scripts):
              fd,p=tempfile.mkstemp(suffix='.js'); os.close(fd)
              Path(p).write_text(js,encoding='utf-8')
              r=subprocess.run(['node','--check',p],capture_output=True,text=True)
              os.unlink(p)
              if r.returncode: errors.append(f'SCRIPT {i}:\n{r.stderr}')
          if errors: raise SystemExit('\n\n'.join(errors))
          print(f'v91.57 validation OK: {len(scripts)} inline scripts checked')
          PY
      - name: Commit validated v91.57 index
        run: |
          if git diff --quiet -- index.html; then
            echo 'No index changes to commit'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Fix cloud readiness detection v91.57'
          git push origin main
