name: HLGB Hourly Health Monitor v95.38
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/hlgb-hourly-health.mjs'
      - '.github/workflows/hlgb-hourly-health-v9538.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/hlgb-hourly-health.mjs'
      - '.github/workflows/hlgb-hourly-health-v9538.yml'
permissions:
  contents: read
  actions: read
concurrency:
  group: hlgb-hourly-health-${{ github.ref }}
  cancel-in-progress: false
jobs:
  hourly-health:
    name: Code, regressions, CI and deployment health
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate hourly read-only health report
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/hlgb-hourly-health.mjs
      - name: Publish report artifacts (7 days)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hlgb-hourly-health-${{ github.run_id }}
          path: |
            auditor-hourly/latest.md
            auditor-hourly/latest.json
          retention-days: 7
          if-no-files-found: warn
