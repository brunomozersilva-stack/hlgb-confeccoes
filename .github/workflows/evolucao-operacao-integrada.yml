      - 'evolucao-lab/tests/etiquetas-a4-contract.cjs'
      - 'evolucao-lab/tests/embalagem-etiquetas-contract.cjs'
      - 'evolucao-lab/tests/regularizacao-historica-contract.cjs'
      - 'evolucao-lab/tests/fluxo-multimodelo-contract.cjs'
      - 'evolucao-lab/tests/preservacao-baseline-contract.cjs'
      - 'evolucao-lab/tests/paridade-corte-main-v9580-contract.cjs'
      - 'evolucao-lab/contratos/preservacao-baseline-v1.json'
      - 'evolucao-lab/tests/auditoria-paridade-gate.cjs'
      - 'evolucao-lab/tests/aceite-por-tarefa-gate.cjs'
      - 'evolucao-lab/aceite-por-tarefa-v1.json'
      - 'evolucao-lab/tests/corte-multimodelo-mobile.cjs'
      - 'evolucao-lab/tests/operacao-duas-abas-local-mobile.cjs'
      - 'evolucao-lab/tests/requisicoes-compras-contract.cjs'
      - 'evolucao-lab/tests/cancelamento-compra-contract.cjs'
      - 'evolucao-lab/tests/correcao-acerto-*.cjs'
      - 'evolucao-lab/tests/comprovantes-*.cjs'
      - 'evolucao-lab/tests/pesquisa-global-contract.cjs'
      - 'evolucao-lab/tests/hub-financeiro-contract.cjs'
      - 'evolucao-lab/tests/pcp-contract.cjs'
      - 'evolucao-lab/tests/relatorios-gerenciais-contract.cjs'
      - 'evolucao-lab/tests/auditor-v3-contract.cjs'
      - 'evolucao-lab/tests/bot-v3-contract.cjs'
      - 'evolucao-lab/tests/assistente-v3-contract.cjs'
      - 'evolucao-lab/tests/custos-contract.cjs'
      - 'evolucao-lab/tests/recuperacao-contract.cjs'
      - 'evolucao-lab/tests/servicos-faccao-contract.cjs'
      - 'evolucao-lab/tests/complementos-contract.cjs'
      - 'evolucao-lab/tests/folha-pedidos-contract.cjs'
      - 'evolucao-lab/tests/paridade-pedidos-main-contract.cjs'
      - 'evolucao-lab/tests/revisao-pedidos-multimodelo-contract.cjs'
      - 'evolucao-lab/tests/aditivo-pedidos-multimodelo-contract.cjs'
      - 'evolucao-lab/tests/precos-cliente-pedidos-contract.cjs'
      - 'evolucao-lab/tests/impacto-pedidos-corte-contract.cjs'
      - 'evolucao-lab/tests/operacoes-v2-contract.cjs'
      - 'evolucao-lab/tests/criticos-jornadas-v1.cjs'
      - 'evolucao-lab/tests/criticos-rastreabilidade-v1.cjs'
      - 'evolucao-lab/paridade-critica-evidencias-v1.json'
      - 'evolucao-lab/paridade-critica.html'
      - 'evolucao-lab/tests/paridade-critica-contract.cjs'
      - 'evolucao-lab/tests/paridade-critica-mobile.cjs'
      - 'evolucao-lab/tests/monitor-contract.cjs'
      - 'evolucao-lab/tests/lote-amplo-mobile.cjs'
      - 'evolucao-lab/tests/devolucoes-compras-contract.cjs'
      - 'evolucao-lab/tests/fechamento-faccao-contract.cjs'
      - '.github/workflows/evolucao-operacao-integrada.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  contracts:
    name: Invariantes de 20 areas e bloqueio de paridade
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Conferir integridade de pedidos, corte, faccoes, contas e folha
        run: node --test evolucao-lab/tests/operacao-integrada-contract.cjs evolucao-lab/tests/paridade-pedidos-main-contract.cjs evolucao-lab/tests/revisao-pedidos-multimodelo-contract.cjs evolucao-lab/tests/aditivo-pedidos-multimodelo-contract.cjs evolucao-lab/tests/precos-cliente-pedidos-contract.cjs evolucao-lab/tests/impacto-pedidos-corte-contract.cjs evolucao-lab/tests/observabilidade-v2-contract.cjs evolucao-lab/tests/pagamento-lote-contract.cjs evolucao-lab/tests/faccoes-multidestino-contract.cjs evolucao-lab/tests/grade-faccoes-contract.cjs evolucao-lab/tests/planejamento-materiais-contract.cjs evolucao-lab/tests/corte-bom-contract.cjs evolucao-lab/tests/corte-multimodelo-contract.cjs evolucao-lab/tests/folha-corte-multimodelo-contract.cjs evolucao-lab/tests/rotas-utilidades-contract.cjs evolucao-lab/tests/etiquetas-a4-contract.cjs evolucao-lab/tests/embalagem-etiquetas-contract.cjs evolucao-lab/tests/regularizacao-historica-contract.cjs evolucao-lab/tests/fluxo-multimodelo-contract.cjs evolucao-lab/tests/preservacao-baseline-contract.cjs evolucao-lab/tests/paridade-corte-main-v9580-contract.cjs evolucao-lab/tests/auditoria-paridade-gate.cjs evolucao-lab/tests/aceite-por-tarefa-gate.cjs evolucao-lab/tests/requisicoes-compras-contract.cjs evolucao-lab/tests/cancelamento-compra-contract.cjs evolucao-lab/tests/devolucoes-compras-contract.cjs evolucao-lab/tests/fechamento-faccao-contract.cjs evolucao-lab/tests/correcao-acerto-contract.cjs evolucao-lab/tests/comprovantes-contract.cjs evolucao-lab/tests/pesquisa-global-contract.cjs evolucao-lab/tests/hub-financeiro-contract.cjs evolucao-lab/tests/pcp-contract.cjs evolucao-lab/tests/relatorios-gerenciais-contract.cjs evolucao-lab/tests/auditor-v3-contract.cjs evolucao-lab/tests/bot-v3-contract.cjs evolucao-lab/tests/assistente-v3-contract.cjs evolucao-lab/tests/custos-contract.cjs evolucao-lab/tests/recuperacao-contract.cjs evolucao-lab/tests/servicos-faccao-contract.cjs evolucao-lab/tests/complementos-contract.cjs evolucao-lab/tests/folha-pedidos-contract.cjs evolucao-lab/tests/operacoes-v2-contract.cjs evolucao-lab/tests/monitor-contract.cjs evolucao-lab/tests/criticos-jornadas-v1.cjs evolucao-lab/tests/criticos-rastreabilidade-v1.cjs evolucao-lab/tests/paridade-critica-contract.cjs
  browser:
    name: Operacao integrada e mobile (${{ matrix.browser }})
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Preparar navegador isolado
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps ${{ matrix.browser }}
      - name: Percorrer 20 areas ficticias, Rotas e Etiquetas em 5 larguras
        env:
          HLGB_BROWSER: ${{ matrix.browser }}
          HLGB_SCREENSHOT_DIR: /tmp/hlgb-operacao
        run: |
          node evolucao-lab/tests/operacao-integrada-mobile.cjs
          node evolucao-lab/tests/corte-multimodelo-mobile.cjs
          node evolucao-lab/tests/operacao-duas-abas-local-mobile.cjs
          node evolucao-lab/tests/correcao-acerto-mobile.cjs
          node evolucao-lab/tests/comprovantes-mobile.cjs
          node evolucao-lab/tests/lote-amplo-mobile.cjs
          node evolucao-lab/tests/paridade-critica-mobile.cjs
      - name: Guardar captura mobile ficticia
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hlgb-operacao-integrada-${{ matrix.browser }}
          path: /tmp/hlgb-operacao/*.png
          if-no-files-found: ignore
