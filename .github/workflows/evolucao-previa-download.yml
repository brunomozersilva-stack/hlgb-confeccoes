name: HLGB Evolucao - Pacote para abrir sem internet
on:
  push:
    branches:
      - feature/evolucao-laboratorio-isolado-v1-20261114
    paths:
      - 'evolucao-lab/entrada.html'
      - 'evolucao-lab/central-operacional-2.html'
      - 'evolucao-lab/fluxo-producao-integrado.html'
      - 'evolucao-lab/planejador-materiais.html'
      - 'evolucao-lab/folha-homologacao.html'
      - 'evolucao-lab/operacao-integrada.html'
      - 'evolucao-lab/operacao-integrada-core.js'
      - 'evolucao-lab/operacao-integrada-ui.js'
      - 'evolucao-lab/modulos/**'
      - 'evolucao-lab/guardiao-preservacao.html'
      - 'evolucao-lab/sincronizacao-duas-sessoes.html'
      - 'evolucao-lab/sincronizacao-duas-sessoes-memoria.js'
      - 'evolucao-lab/homologacao-modulos.html'
      - 'evolucao-lab/permissoes/permissoes-mobile.html'
      - '.github/workflows/evolucao-previa-download.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    name: Gerar ZIP das demonstracoes estaticas
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Montar pacote 100% offline e sem dados empresariais
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p pacote/HLGB-Evolucao-Previa/permissoes
          cp evolucao-lab/entrada.html pacote/HLGB-Evolucao-Previa/index.html
          for p in operacao-integrada.html folha-homologacao.html sincronizacao-duas-sessoes.html guardiao-preservacao.html homologacao-modulos.html central-operacional-2.html fluxo-producao-integrado.html planejador-materiais.html prototipo.html fluxos-operacionais.html acertos-simulador.html transacoes-simuladas.html preservacao.html paridade-critica.html; do
            cp "evolucao-lab/$p" "pacote/HLGB-Evolucao-Previa/$p"
          done
          cp evolucao-lab/permissoes/permissoes-mobile.html pacote/HLGB-Evolucao-Previa/permissoes/permissoes-mobile.html
          cp evolucao-lab/sincronizacao-duas-sessoes-memoria.js pacote/HLGB-Evolucao-Previa/sincronizacao-duas-sessoes-memoria.js
          cp evolucao-lab/operacao-integrada-core.js pacote/HLGB-Evolucao-Previa/operacao-integrada-core.js
          cp evolucao-lab/operacao-integrada-ui.js pacote/HLGB-Evolucao-Previa/operacao-integrada-ui.js
          cp -R evolucao-lab/modulos pacote/HLGB-Evolucao-Previa/modulos
          python3 - <<'PY'
          from pathlib import Path
          root=Path('pacote/HLGB-Evolucao-Previa')
          import re
          for file in root.rglob('*.html'):
              source=file.read_text()
              # No pacote offline a pagina inicial chama index.html, e não entrada.html.
              source=source.replace('href="./entrada.html"','href="./index.html"')
              # Todos os links e scripts locais devem existir no pacote offline
              for script in re.findall(r'<script\s+src="([^"]+)"',source):
                  assert script.startswith('./'),(file,script)
                  assert (file.parent/script).resolve().is_file(),(file,script)
              # Todos os links locais referenciados devem apontar para arquivos da própria prévia
              import re
              for link in re.findall(r'href="([^"]+)"',source):
                  if link.startswith('./') or link.startswith('../'):
                      resolved=(file.parent/link).resolve()
                      if resolved.suffix=='.html':
                          assert resolved.is_file(),(file,link)
              if 'integracao/' in str(file) or 'api/pay' in source or 'api/upload' in source:
                  raise RuntimeError('Rota operacional não permitida no pacote: '+str(file))
              file.write_text(source)
          print('PASS: 16 documentos HTML de demonstração e referências locais verificadas')
          PY
          cat > pacote/LEIA-PRIMEIRO.txt <<'TXT'
          HLGB EVOLUCAO - PREVIA EXPERIMENTAL
          Extraia o ZIP, entre na pasta HLGB-Evolucao-Previa e abra index.html
          no Chrome ou Safari (também funciona sem internet).
          Abra Central de Testes por Modulo para revisar 76 funcoes e exportar JSON.
          Todas as telas usam dados inventados. Não inserir dados reais.
          Não é o HLGB em funcionamento e não possui gravação no banco.
          TXT
          cd pacote
          zip -qr HLGB-Evolucao-Previa.zip HLGB-Evolucao-Previa LEIA-PRIMEIRO.txt
          unzip -t HLGB-Evolucao-Previa.zip | tail -1
          ls -lh HLGB-Evolucao-Previa.zip
      - name: Disponibilizar pacote para baixar no GitHub
        uses: actions/upload-artifact@v4
        with:
          name: HLGB-Evolucao-Previa-Offline
          path: pacote/HLGB-Evolucao-Previa.zip
          retention-days: 30
