name: HLGB v91.55 gravação durável e segura

on:
  push:
    branches: [main]
    paths:
      - 'scripts/hlgb_v9155_durable_save_addon.html'
      - 'scripts/hlgb_v9155_patch.py'
      - '.github/workflows/hlgb-apply-v9155.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply v91.55 durable save layer
        run: python3 scripts/hlgb_v9155_patch.py
      - name: Validate durable save layer and all inline JavaScript
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess, tempfile, os
          s=Path('index.html').read_text(encoding='utf-8')
          assert 'HLGB v91.55 DURABLE WRITE-AHEAD LOG + CLOUD ACK + DEPLOY SAFE' in s
          assert 'v91.55 Multiusuário' in s
          assert 'hlgb_durable_wal_v1' in s
          assert 'hlgb955ReliableSave' in s
          assert 'hlgb955FlushNow' in s
          assert '✅ Salvo na nuvem' in s
          assert 'beforeunload' in s
          assert 'indexedDB.open' in s
          assert 'navigator.storage.persist' in s
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.S|re.I)
          errors=[]
          for i,js in enumerate(scripts):
              fd,p=tempfile.mkstemp(suffix='.js'); os.close(fd)
              Path(p).write_text(js,encoding='utf-8')
              r=subprocess.run(['node','--check',p],capture_output=True,text=True)
              os.unlink(p)
              if r.returncode: errors.append(f'SCRIPT {i}:\n{r.stderr}')
          if errors: raise SystemExit('\n\n'.join(errors))
          print(f'v91.55 validation OK: {len(scripts)} inline scripts checked')
          PY
      - name: Commit validated v91.55 index
        run: |
          if git diff --quiet -- index.html; then
            echo 'No index changes to commit'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Add durable cloud-confirmed save layer v91.55'
          git push origin main
