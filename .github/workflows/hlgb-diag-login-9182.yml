name: Diagnosticar login HLGB v91.82
on:
  push:
    paths:
      - 'scripts/hlgb_diag_login_9182.py'
      - '.github/workflows/hlgb-diag-login-9182.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Gerar trechos de diagnostico
        run: python scripts/hlgb_diag_login_9182.py
      - name: Commit diagnostico
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add debug/login-9182-snippets.txt
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Diagnostico login v91.82 [skip ci]"
          git push
