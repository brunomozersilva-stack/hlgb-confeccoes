name: Diagnosticar melhorias HLGB v91.85
on:
  push:
    paths:
      - 'scripts/hlgb_diag_v9185_requests.py'
      - '.github/workflows/hlgb-diag-v9185.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Extrair trechos relevantes
        run: python scripts/hlgb_diag_v9185_requests.py
      - name: Salvar diagnostico
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add debug/v9185-requests.txt
          git commit -m "Diagnostico melhorias v91.85 [skip ci]" || true
          git push || true
