name: HLGB Embalagem and Traveta v95.77
on:
  pull_request:
    branches: [main]
    paths:
      - 'app-stable3.html'
      - 'release-faction-master-integrity.js'
      - 'release-faction-manual-payment-v9566.js'
      - 'release-faction-traveta-payment-v9424.js'
      - 'release-faction-service-rates-v9577.js'
      - 'tests/embalagem-traveta-v9577.cjs'
      - 'tests/faction-manual-management-v9588.cjs'
      - 'tests/faction-manual-corrections-v9590.cjs'
      - 'tests/faction-inline-adjustment-v9591.cjs'
      - 'tests/faction-traveta-points-v9592.cjs'
      - 'tests/faction-manual-v9566-browser.cjs'
      - 'tests/faction-manual-v9566-fixture.html'
      - '.github/workflows/embalagem-traveta-v9577.yml'
  push:
    branches: [main]
    paths:
      - 'app-stable3.html'
      - 'release-faction-master-integrity.js'
      - 'release-faction-manual-payment-v9566.js'
      - 'release-faction-traveta-payment-v9424.js'
      - 'release-faction-service-rates-v9577.js'
      - 'tests/embalagem-traveta-v9577.cjs'
      - 'tests/faction-manual-management-v9588.cjs'
      - 'tests/faction-manual-corrections-v9590.cjs'
      - 'tests/faction-inline-adjustment-v9591.cjs'
      - 'tests/faction-traveta-points-v9592.cjs'
      - 'tests/faction-manual-v9566-browser.cjs'
      - 'tests/faction-manual-v9566-fixture.html'
      - '.github/workflows/embalagem-traveta-v9577.yml'
permissions: {contents: read}
jobs:
  validation:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: node --check release-faction-service-rates-v9577.js
      - run: node --check release-faction-master-integrity.js
      - run: node --check release-faction-traveta-payment-v9424.js
      - run: node --check release-faction-manual-payment-v9566.js
      - run: node --check tests/faction-manual-management-v9588.cjs
      - run: node --check tests/faction-manual-corrections-v9590.cjs
      - run: node --check tests/faction-inline-adjustment-v9591.cjs
      - run: node --check tests/faction-traveta-points-v9592.cjs
      - run: node tests/faction-manual-v9566.cjs
      - run: node tests/faction-manual-management-v9588.cjs
      - run: node tests/faction-manual-corrections-v9590.cjs
      - run: node tests/faction-inline-adjustment-v9591.cjs
      - run: node tests/faction-traveta-points-v9592.cjs
      - run: node tests/audit-faction-master-integrity-regression.cjs
      - run: node tests/audit-faction-traveta-payment-v9424.cjs
      - run: node tests/embalagem-traveta-v9577.cjs
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Instalar Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps ${{ matrix.browser }}
      - name: Servir fixture isolada
        run: |
          python3 -m http.server 4173 >/tmp/hlgb-faction-manual.log 2>&1 &
          sleep 2
      - name: Testar edição, baixa paga e PDF
        env:
          HLGB_BROWSER: ${{ matrix.browser }}
        run: node tests/faction-manual-v9566-browser.cjs
