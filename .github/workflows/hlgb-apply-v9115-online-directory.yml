name: HLGB v91.15 online directory fix
on:
  push:
    paths:
      - 'scripts/hlgb_v9115_online_directory.py'
      - '.github/workflows/hlgb-apply-v9115-online-directory.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply online directory status fix
        run: python3 scripts/hlgb_v9115_online_directory.py
      - name: Validate JavaScript
        run: |
          python3 - <<'PY'
          import re,pathlib,subprocess
          s=pathlib.Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.S|re.I)
          for i,body in enumerate(scripts):
              f=pathlib.Path(f'/tmp/hlgb-online-{i}.js');f.write_text(body,encoding='utf-8')
              subprocess.run(['node','--check',str(f)],check=True)
          assert 'async function refreshOnlineUserDirectory()' in s
          assert 'v91.15 Multiusuário' in s
          print('validated',len(scripts),'script blocks')
          PY
      - name: Commit validated index
        run: |
          if git diff --quiet -- index.html; then
            echo 'No index changes required'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Fix HLGB v91.15 online user directory status'
          git push origin main
