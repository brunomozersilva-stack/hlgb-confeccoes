name: HLGB Comercial - Candidata Integrada v96.35
on:
  pull_request:
    paths:
      - 'hlgb-modules/**'
      - 'tests/hlgb-candidate-v9635*'
      - '.github/workflows/hlgb-candidate-v9635.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: |
          for f in tests/hlgb-financial-week-core-v9627.cjs tests/hlgb-cash-projection-v9631.cjs tests/hlgb-hub-intelligence-adapter-v9633.cjs tests/hlgb-hub-intelligence-legacy-v9633.cjs tests/hlgb-payroll-fifth-day-v9632.cjs tests/hlgb-payroll-preview-adapter-v9634.cjs tests/hlgb-joint-cut-core-v9628.cjs tests/hlgb-joint-cut-discovery-v9629.cjs tests/hlgb-fabric-remnant-policy-v9630.cjs tests/hlgb-candidate-v9635.cjs tests/hlgb-rh-planning-v9636.cjs; do node "$f" || exit 1; done
  browser:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm install --no-save playwright@1.55.0 && npx playwright install --with-deps ${{ matrix.browser }}
      - run: |
          python3 -m http.server 4173 >/tmp/candidate.log 2>&1 &
          sleep 2
      - env:
          HLGB_BROWSER: ${{ matrix.browser }}
        run: node tests/hlgb-candidate-v9635-browser.cjs
