name: HLGB Auditor Intelligence v93.98

on:
  push:
    branches:
      - fix/auditor-inteligente-20261023
      - diagnostic/post-hotfix-save-depth-orphans-20261024
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validar sintaxe
        run: |
          set -euo pipefail
          node --check release-auditor-build-marker-v9396.js
          node --check release-auditor-intelligence-v9396.js
          node --check release-auditor-call-trace-v9380.js
          node --check release-sync-guard-v9306.js
          node --check release-payroll-month-wal-v9334.js
          node --check release-payroll-snapshot-watch-v9354.js
          node --check release-payroll-reliable-save-guard-v9344.js
          node --check release-payroll-wal-race-v9346.js
          node --check tests/auditor-intelligence-v9396.js
          node --check tests/post-hotfix-save-consolidation-v9398.js
      - name: Testar inteligência incremental
        run: node tests/auditor-intelligence-v9396.js
      - name: Testar consolidação de save pós-hotfix
        run: node tests/post-hotfix-save-consolidation-v9398.js
