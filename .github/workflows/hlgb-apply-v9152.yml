name: HLGB v91.52 folha status pago da nuvem

on:
  push:
    branches: [main]
    paths:
      - 'scripts/hlgb_v9152_payroll_display_addon.html'
      - 'scripts/hlgb_v9152_patch.py'
      - '.github/workflows/hlgb-apply-v9152.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply v91.52 payroll cloud status fix
        run: python3 scripts/hlgb_v9152_patch.py
      - name: Validate payroll cloud status fix and JavaScript
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess, tempfile, os
          s=Path('index.html').read_text(encoding='utf-8')
          assert 'HLGB v91.52 PAYROLL CLOUD STATUS DISPLAY + RECOVERY SHUTDOWN' in s
          assert 'v91.52 Multiusuário' in s
          assert 'hydratePaid952' in s
          assert 'hlgbRecordSnapshots?.payroll' in s
          assert "t.paid=true" in s
          assert 'hlgb9149RecoverNow=async function' in s
          assert 'hlgb950RecoveryBox' in s
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.S|re.I)
          errors=[]
          for i,js in enumerate(scripts):
              fd,p=tempfile.mkstemp(suffix='.js'); os.close(fd)
              Path(p).write_text(js,encoding='utf-8')
              r=subprocess.run(['node','--check',p],capture_output=True,text=True)
              os.unlink(p)
              if r.returncode: errors.append(f'SCRIPT {i}:\n{r.stderr}')
          if errors: raise SystemExit('\n\n'.join(errors))
          print(f'v91.52 validation OK: {len(scripts)} inline scripts checked')
          PY
      - name: Commit validated v91.52 index
        run: |
          if git diff --quiet -- index.html; then
            echo 'No index changes to commit'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Show confirmed payroll paid status from cloud v91.52'
          git push origin main
