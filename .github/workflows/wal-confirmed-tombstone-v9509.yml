name: HLGB WAL confirmed tombstones v95.09
on:
  pull_request:
    branches: [main]
    paths:
      - 'release-wal-tombstone-pruner-v9509.js'
      - 'release-auditor-autocorrect-v9447.js'
      - 'tests/wal-tombstone-v9509-browser.js'
      - 'tests/wal-tombstone-v9509-fixture.html'
      - '.github/workflows/wal-confirmed-tombstone-v9509.yml'
  push:
    branches: [main]
    paths:
      - 'release-wal-tombstone-pruner-v9509.js'
      - 'release-auditor-autocorrect-v9447.js'
      - 'tests/wal-tombstone-v9509-browser.js'
      - 'tests/wal-tombstone-v9509-fixture.html'
      - '.github/workflows/wal-confirmed-tombstone-v9509.yml'
permissions:
  contents: read
jobs:
  logic:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '20'}
      - run: node --check release-wal-tombstone-pruner-v9509.js
      - run: node --check release-auditor-autocorrect-v9447.js
      - run: node tests/auditor-autocorrect-v9447-fast.js
  browsers:
    # Playwright 1.55 requires a supported LTS image; ubuntu-latest moved to 26.04.
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '20'}
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps ${{ matrix.browser }}
      - name: Serve test environment
        run: |
          python3 -m http.server 4173 >/tmp/hlgb-wal-v9509.log 2>&1 &
          sleep 2
      - name: Confirm safe remote tombstone pruning
        env:
          HLGB_BROWSER: ${{ matrix.browser }}
        run: node tests/wal-tombstone-v9509-browser.js
      - name: Ensure Auditor chain still works
        env:
          HLGB_BROWSER: ${{ matrix.browser }}
        run: node tests/auditor-autocorrect-v9448-runtime.js
