name: HLGB Auditor Multiuser Preview

on:
  push:
    branches:
      - feat/auditor-multiuser-validation-20261021
    paths:
      - 'release-auditor-shell-v9382.js'
      - 'release-auditor-production-v9369.js'
      - 'release-ui-stability.js'
      - 'tests/auditor-multiuser-validation.js'
      - 'tests/auditor-multiuser-webkit.js'
      - 'tests/ui-stability-local-order-render-v7.js'
      - 'tests/ui-stability-local-order-render-v7-chromium.js'
      - 'docs/validacao-multiusuario-20261021.md'
      - '.github/workflows/auditor-multiuser-preview.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validar multiusuário e refresh local antes do pacote
        run: |
          set -euo pipefail
          node --check release-auditor-shell-v9382.js
          node --check release-auditor-production-v9369.js
          node --check release-ui-stability.js
          node tests/auditor-multiuser-validation.js
          node tests/ui-stability-local-order-render-v7.js
      - name: Montar preview local sem alterar main
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p preview
          find . -maxdepth 1 -type f \( -name '*.html' -o -name '*.js' -o -name '*.json' \) -exec cp {} preview/ \;
          cat > preview/preview-server.py <<'PY'
          from http.server import ThreadingHTTPServer, SimpleHTTPRequestHandler
          import os
          HOST='127.0.0.1'; PORT=8765
          class NoCache(SimpleHTTPRequestHandler):
              def end_headers(self):
                  self.send_header('Cache-Control','no-store, no-cache, must-revalidate')
                  self.send_header('Pragma','no-cache')
                  self.send_header('Expires','0')
                  super().end_headers()
          os.chdir(os.path.dirname(os.path.abspath(__file__)))
          print(f'HLGB multiusuário: http://{HOST}:{PORT}/abrir.html', flush=True)
          ThreadingHTTPServer((HOST,PORT),NoCache).serve_forever()
          PY
          cat > preview/start-preview.command <<'SH'
          #!/bin/bash
          set -e
          cd "$(dirname "$0")"
          echo ""
          echo "HLGB — PREVIEW VALIDAÇÃO MULTIUSUÁRIO"
          echo "Branch: feat/auditor-multiuser-validation-20261021"
          echo "Commit: __COMMIT__"
          echo ""
          echo "1) Deixe esta janela aberta."
          echo "2) Abra no Safari/Chrome: http://localhost:8765/abrir.html"
          echo "3) Não use este pacote como produção."
          echo ""
          python3 preview-server.py
          SH
          sed -i "s/__COMMIT__/$GITHUB_SHA/g" preview/start-preview.command
          chmod +x preview/start-preview.command
          cat > preview/LEIA-ME.txt <<EOF
          HLGB CONFECÇÕES — PREVIEW PR #62
          Branch: feat/auditor-multiuser-validation-20261021
          Commit: $GITHUB_SHA

          ESTE PACOTE NÃO ALTERA O MAIN.
          Ele serve somente para homologar a validação multiusuário e a correção de atualização visual de Pedidos antes do merge.

          COMO ABRIR NO MAC
          1. Abra start-preview.command.
          2. Deixe a janela do Terminal aberta.
          3. Abra http://localhost:8765/abrir.html no navegador.

          TESTE RÁPIDO DO PEDIDO NO CHROME
          A. Abra Pedidos e crie um pedido de teste seguro.
          B. Clique em salvar e NÃO atualize a página.
          C. Confirme que o pedido aparece imediatamente na lista.
          D. Aguarde alguns segundos e confirme que ele não some nem volta para uma versão visual anterior.

          TESTE COM DUAS CONTAS REAIS
          A. Abra a conta 1 no Safari e a conta 2 em outro navegador/perfil isolado.
          B. No Auditor, abra "Validação multiusuário" nas duas contas.
          C. Gere os dois relatórios com no máximo 2 minutos de diferença, sem editar durante a coleta.
          D. Baixe os dois arquivos hlgb-multiusuario-*.json.
          E. Importe o arquivo da conta 1 na conta 2 e confira o resultado.
          F. Depois faça os testes operacionais:
             - conta A cria/altera registro autorizado e B recebe sem recarregar; repetir B -> A;
             - editar simultaneamente o mesmo registro;
             - desconectar/reconectar e confirmar reaplicação única/fila vazia;
             - sair/entrar e confirmar persistência;
             - validar acesso permitido e negado conforme o perfil.

          Não faça merge apenas porque os relatórios deram iguais: o resultado é propositalmente parcial.
          EOF
      - uses: actions/upload-artifact@v4
        with:
          name: HLGB-MULTIUSER-PREVIEW-${{ github.sha }}
          path: preview/
          if-no-files-found: error
          retention-days: 7
