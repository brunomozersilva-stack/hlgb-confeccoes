name: Build HLGB no-tools preview

on:
  push:
    branches:
      - melhorias-ia-diagnostico-20260930
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build self-contained HTML
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p preview
          python3 - <<'PY'
          from pathlib import Path

          base = Path("app9240.html").read_text(encoding="utf-8")
          files = [
            "release-ui-cleanup.js",
            "hotfix9241.js","release-current.js","release-pricing.js","release-limits.js",
            "release-cut-view.js","release-record-integrity.js","release-notes.js",
            "release-note-integrity.js","release-projection-delivery-integrity.js",
            "release-projection-team-view.js","release-faction-payments.js",
            "release-faction-integrity.js","release-faction-master-integrity.js",
            "release-payroll-integrity.js","release-payroll-termination-provisions.js",
            "release-checklist-integrity.js","release-capacity-integrity.js",
            "release-hub-search.js","release-hub-integrity.js","release-hub-personal-integrity.js",
            "release-ui-stability.js","release-diagnostics-center.js","release-internal-auditor.js",
            "release-assistant-query.js","release-header-cleanup.js","release-user-fixes-20261001.js"
          ]

          blocks = []
          for name in files:
              js = Path(name).read_text(encoding="utf-8")
              js = js.replace("</script", "<\\/script")
              blocks.append(f"\n<!-- {name} -->\n<script>\n{js}\n</script>\n")

          inject = "".join(blocks)
          idx = base.lower().rfind("</body>")
          html = (base[:idx] + inject + base[idx:]) if idx >= 0 else base + inject
          Path("preview/HLGB-TESTE.html").write_text(html, encoding="utf-8")

          Path("preview/LEIA-ME.txt").write_text(
              "HLGB CONFECÇÕES — TESTE SEM INSTALAR FERRAMENTAS\n\n"
              "Branch: melhorias-ia-diagnostico-20260930\n"
              "Commit: " + __import__("os").environ.get("GITHUB_SHA","") + "\n\n"
              "COMO ABRIR:\n"
              "1. Descompacte o ZIP.\n"
              "2. Dê dois cliques em HLGB-TESTE.html.\n"
              "3. Abra no Chrome ou Safari.\n\n"
              "Não precisa instalar Git, Python nem ferramentas de desenvolvedor.\n"
              "Este pacote NÃO publica nem altera o main.\n\n"
              "Primeiro teste: no Assistente pergunte: qual mercadoria tem pedido para quesia\n",
              encoding="utf-8"
          )
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: HLGB-TESTE-SEM-FERRAMENTAS
          path: preview/
          if-no-files-found: error
          retention-days: 7
