name: Diagnosticar planejamento de corte v91.88
on:
  push:
    paths:
      - 'scripts/hlgb_diag_cut_planning_9188.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Gerar diagnóstico
        run: python scripts/hlgb_diag_cut_planning_9188.py
      - name: Publicar diagnóstico
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add debug/cut-planning-9188.txt
          git commit -m 'Diagnóstico planejamento de corte v91.88' || exit 0
          git push
