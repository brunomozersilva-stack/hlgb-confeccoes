name: HLGB inspect v91.59 separacao e faltas

on:
  push:
    branches: [main]
    paths:
      - 'scripts/hlgb_v9159_inspect.py'
      - '.github/workflows/hlgb-inspect-v9159.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Extract relevant code
        run: python3 scripts/hlgb_v9159_inspect.py
      - name: Commit inspection
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/v9159_inspect.txt
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Inspect separation and missing flows for v91.59'
          git push origin main
