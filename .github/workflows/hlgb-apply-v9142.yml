name: HLGB v91.42 protecao de dados entre versoes

on:
  push:
    branches: [main]
    paths:
      - 'scripts/hlgb_v9142_patch.py'
      - 'scripts/hlgb_v9142_addon.html'
      - '.github/workflows/hlgb-apply-v9142.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply v91.42 patch
        run: python3 scripts/hlgb_v9142_patch.py
      - name: Validate v91.42 data safety
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess, tempfile, os
          s=Path('index.html').read_text(encoding='utf-8')
          required=[
            'v91.42 Multiusuário',
            'HLGB v91.42 CROSS-VERSION CLOUD RECOVERY + HUB FINANCE SAFETY',
            'HLGB v91.41 PRICING + DAILY PLAN + SOURCE DELIVERY + MATERIAL BALANCE',
            'HLGB v91.40 CAPACITY QUEUE + GOALS LIVE + MISSING AT INVOICE + FACTION SYNC',
            "'hubFinanceEntries','materialChecklists','factionSettings','finishedPieces'",
            'hlgb942FullCloudRefresh',
            'hlgbLoadNormalizedCore({preserveLocal:true})',
            "hlgb928EnsureCloudCoverage(module)",
            'lançamento(s) do Hub Financeiro confirmado(s) na nuvem'
          ]
          for x in required: assert x in s, f'missing {x}'
          addon=Path('scripts/hlgb_v9142_addon.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',addon,re.S|re.I)
          assert scripts, 'no addon script found'
          for i,js in enumerate(scripts):
            fd,p=tempfile.mkstemp(suffix='.js');os.close(fd);Path(p).write_text(js,encoding='utf-8')
            r=subprocess.run(['node','--check',p],capture_output=True,text=True);os.unlink(p)
            if r.returncode: raise SystemExit(f'v91.42 script {i} failed:\n{r.stderr}')
          print('v91.42 validation ok')
          PY
      - name: Commit validated v91.42 index
        run: |
          if git diff --quiet -- index.html; then
            echo 'No index changes to commit'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Protect cloud data across versions v91.42'
          git push origin main
