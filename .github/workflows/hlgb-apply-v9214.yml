name: Aplicar HLGB v92.14 restaurar Notas com segurança
on:
  push:
    paths:
      - 'scripts/hlgb_v9214_restore_notes_safe.py'
      - '.github/workflows/hlgb-apply-v9214.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Restaurar Notas na página v92.14
        run: python scripts/hlgb_v9214_restore_notes_safe.py
      - name: Validar página e novo JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('app9214.html').read_text(encoding='utf-8')
          req=['id="loginUser"','id="loginPass"','onclick="return doLogin()"','HLGB_V9214_NOTES_START','HLGB_V9214_NOTES_END','openProjectionAcerto9214','projectionNotes9214']
          miss=[x for x in req if x not in s]
          if miss: raise SystemExit('Itens obrigatórios ausentes: '+repr(miss))
          if 'new MutationObserver' in s[s.index('<!-- HLGB_V9214_NOTES_START -->'):s.index('<!-- HLGB_V9214_NOTES_END -->')]:
              raise SystemExit('Observer global não permitido na restauração de Notas')
          block=s[s.index('<!-- HLGB_V9214_NOTES_START -->'):s.index('<!-- HLGB_V9214_NOTES_END -->')]
          js=block.split('<script>',1)[1].rsplit('</script>',1)[0]
          Path('/tmp/v9214_notes.js').write_text(js,encoding='utf-8')
          print('Estrutura v92.14 OK')
          PY
          node --check /tmp/v9214_notes.js
      - name: Publicar v92.14
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app9214.html abrir.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Publicar HLGB v92.14 - restaurar Notas com segurança"
          git push
