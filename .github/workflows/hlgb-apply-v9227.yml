name: Aplicar HLGB v92.27 cortadores e valores por periodo
on:
  push:
    paths:
      - 'scripts/hlgb_v9227_cutter_day_week_month_values.py'
      - '.github/workflows/hlgb-apply-v9227.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Montar página v92.27
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/hlgb_v9227_cutter_day_week_month_values.py')
          s=p.read_text(encoding='utf-8')
          old="s,n=re.subn(pat,new,s,count=1,flags=re.S)"
          new="s,n=re.subn(pat,lambda _m:new,s,count=1,flags=re.S)"
          if old in s: s=s.replace(old,new,1)
          s=s.replace("'Mês programado'","'hlgb9227-produced-money'",1)
          p.write_text(s,encoding='utf-8')
          PY
          python scripts/hlgb_v9227_cutter_day_week_month_values.py
      - name: Validar edição e resumos dos cortadores
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('app9227.html').read_text(encoding='utf-8')
          launcher=Path('abrir.html').read_text(encoding='utf-8')
          req=['HLGB_V9227_CUTTER_DAY_WEEK_MONTH_START','hlgbUpdateCutterExcel9227','TOTAL DO DIA','Valor por cortador — semana e mês','Mês do resumo','Semana produzida','hlgb9227-produced-money']
          miss=[x for x in req if x not in s]
          if 'app9227.html?v=92.27' not in launcher: miss.append('launcher v92.27')
          if miss: raise SystemExit('Itens ausentes: '+repr(miss))
          m=re.search(r"(  window\.hlgbRenderCutterExcel9179=function\(\)\{.*?\n  \};)\n  window\.hlgbPrintCutterExcel9179=function",s,re.S)
          if not m: raise SystemExit('Renderer dos cortadores não localizado')
          Path('/tmp/v9227_renderer.js').write_text('(function(){\n'+m.group(1)+'\n})();\n',encoding='utf-8')
          a=s.index('<!-- HLGB_V9227_CUTTER_DAY_WEEK_MONTH_START -->');b=s.index('<!-- HLGB_V9227_CUTTER_DAY_WEEK_MONTH_END -->',a)
          js=s[a:b].split('<script>',1)[1].rsplit('</script>',1)[0]
          Path('/tmp/v9227_addon.js').write_text(js,encoding='utf-8')
          PY
          node --check /tmp/v9227_renderer.js
          node --check /tmp/v9227_addon.js
      - name: Publicar v92.27
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app9227.html abrir.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Publicar HLGB v92.27 - cortadores e valores por dia semana mes"
          git push
