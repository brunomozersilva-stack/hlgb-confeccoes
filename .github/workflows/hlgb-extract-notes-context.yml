name: Extrair contexto do fluxo de notas
on:
  push:
    paths:
      - 'scripts/hlgb_extract_notes_context.py'
permissions:
  contents: write
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Extrair trechos relevantes
        run: python scripts/hlgb_extract_notes_context.py
      - name: Salvar diagnóstico
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/diag_notes_context.txt
          git diff --cached --quiet || git commit -m "Diagnóstico temporário do fluxo de notas"
          git push
