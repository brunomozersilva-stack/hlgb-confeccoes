name: HLGB Audit Regression

on:
  pull_request:
  push:
    branches: [main, audit-work-20260915, sync-auditor-clean-20260930, hotfix-hub-tombstone-20261001]
  schedule:
    - cron: '0 21 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  critical:
    name: Critical operational flows
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate Auditor download and daily report
        run: node tests/audit-auditor-daily-download-regression.cjs

      - name: Validate equivalent Production WAL cleanup
        run: node tests/audit-wal-equivalent-production-regression.cjs

      - name: Validate daily 18h schedule
        run: node tests/audit-nightly-schedule-regression.cjs

      - name: Validate maintained historical compatibility
        shell: bash
        run: |
          set -uo pipefail
          failed=0
          for test in \
            tests/audit-assistant-fresh-query-regression.cjs \
            tests/audit-business-pack-v9250.cjs \
            tests/audit-cut-model-split-regression.cjs \
            tests/audit-hub-tombstone-online-regression.cjs \
            tests/audit-notes-alias-regression.cjs \
            tests/audit-notes-render-no-dirty-regression.cjs \
            tests/audit-safety-gate-v9264.cjs \
            tests/audit-stabilization-v9259.cjs \
            tests/audit-sync-confirmation-v9311.cjs \
            tests/audit-v9266-regression.cjs \
            tests/audit-v9267-regression.cjs \
            tests/audit-v9268-regression.cjs \
            tests/audit-v9269-regression.cjs \
            tests/audit-v9270-regression.cjs
          do
            echo "==> $test"
            node "$test" || failed=1
          done
          exit "$failed"

      - name: Run existing critical audit
        shell: bash
        run: |
          set -uo pipefail
          failed=0
          for test in \
            tests/audit-record-integrity-regression.cjs \
            tests/audit-remote-tombstone-regression.cjs \
            tests/audit-record-loading-regression.cjs \
            tests/audit-sync-key-order-regression.cjs \
            tests/audit-legacy-sync-isolation-regression.cjs \
            tests/audit-legacy-sync-isolation-behavior-regression.cjs \
            tests/audit-production-reconcile-regression.cjs \
            tests/audit-production-cut-reconcile-v9307.cjs \
            tests/audit-separation-commit-v9319.cjs \
            tests/audit-save-transport-v9320.cjs \
            tests/audit-save-actions-v9322.cjs \
            tests/audit-hub-primary-v9323.cjs \
            tests/audit-hub-delivery-v9324.cjs \
            tests/audit-runtime-recovery-v9326.cjs \
            tests/audit-operational-auditor-v9314.cjs \
            tests/audit-auditor-hub-reliability-v9315.cjs \
            tests/audit-canonical-routing-v9316.cjs \
            tests/audit-hub-week-unified-v9317.cjs \
            tests/audit-hub-master-syntax-v9318.cjs \
            tests/audit-ui-stability-regression.cjs \
            tests/audit-global-visual-stability.cjs \
            tests/audit-page-settle-stability.cjs \
            tests/audit-render-governor.cjs \
            tests/audit-sync-storm-guard.cjs \
            tests/audit-hub-integrity-regression.cjs \
            tests/audit-hub-search-regression.cjs \
            tests/audit-hub-personal-integrity-regression.cjs \
            tests/audit-payroll-integrity-regression.cjs \
            tests/audit-payroll-provision-sort-total-regression.cjs \
            tests/audit-note-integrity-regression.cjs \
            tests/audit-capacity-integrity-regression.cjs \
            tests/audit-faction-master-integrity-regression.cjs \
            tests/audit-internal-auditor-regression.cjs \
            tests/audit-diagnostics-center.cjs
          do
            echo "==> $test"
            node "$test" || failed=1
          done
          exit "$failed"

  full:
    name: Full nightly regression library
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[nightly-audit-now]'))
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run complete audit library and build sanitized report
        run: node scripts/run-nightly-audit.mjs

      - name: Publish latest sanitized audit report
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test -f auditor-nightly/latest.json
          test -f auditor-nightly/latest.txt
          tmp="$(mktemp -d)"
          cp auditor-nightly/latest.json "$tmp/latest.json"
          cp auditor-nightly/latest.txt "$tmp/latest.txt"
          cd "$tmp"
          git init -q
          git checkout -q -b auditor-nightly-data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add latest.json latest.txt
          git commit -q -m "Auditor noturno: atualizar último relatório"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push -q --force origin auditor-nightly-data

      - name: Mark workflow failed when audit found regressions
        if: always()
        shell: bash
        run: |
          code="$(cat auditor-nightly/exit-code.txt 2>/dev/null || echo 1)"
          exit "$code"
