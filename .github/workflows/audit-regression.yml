name: HLGB Audit Regression

on:
  push:
    branches: [audit-work-20260915, sync-auditor-clean-20260930, hotfix-hub-tombstone-20261001, assistant-visible-all-users-20261001, melhorias-operacionais-20261001]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run audit regressions
        shell: bash
        run: |
          set -euo pipefail
          for test in \
            tests/audit-cut-navigation.cjs \
            tests/audit-client-live-edit.cjs \
            tests/audit-cut-view-regression.cjs \
            tests/audit-queue-cut-regression.cjs \
            tests/audit-faction-payment-guard.cjs \
            tests/audit-faction-description-regression.cjs \
            tests/audit-faction-master-integrity-regression.cjs \
            tests/audit-notes-alias-regression.cjs \
            tests/audit-note-integrity-regression.cjs \
            tests/audit-record-integrity-regression.cjs \
            tests/audit-remote-tombstone-regression.cjs \
            tests/audit-record-loading-regression.cjs \
            tests/audit-payroll-integrity-regression.cjs \
            tests/audit-checklist-integrity-regression.cjs \
            tests/audit-capacity-integrity-regression.cjs \
            tests/audit-production-reconcile-regression.cjs \
            tests/audit-ui-stability-regression.cjs \
            tests/audit-hub-search-regression.cjs \
            tests/audit-hub-integrity-regression.cjs \
            tests/audit-projection-client-regression.cjs \
            tests/audit-projection-delivery-regression.cjs \
            tests/audit-projection-delivery-integrity-regression.cjs \
            tests/audit-period-navigation-regression.cjs \
            tests/audit-safari-date-regression.cjs \
            tests/audit-missing-route-regression.cjs \
            tests/audit-catalog-modules-regression.cjs \
            tests/audit-pricing-regression.cjs \
            tests/audit-limits-regression.cjs \
            tests/audit-note-selection-regression.cjs \
            tests/audit-production-assignment-regression.cjs \
            tests/audit-legacy-sync-isolation-regression.cjs \
            tests/audit-projection-missing-regression.cjs \
            tests/audit-legacy-sync-isolation-behavior-regression.cjs \
            tests/audit-note-selection-behavior-regression.cjs \
            tests/audit-production-assignment-behavior-regression.cjs \
            tests/audit-projection-missing-behavior-regression.cjs \
            tests/audit-diagnostics-center.cjs \
            tests/audit-internal-auditor-regression.cjs \
            tests/audit-sync-key-order-regression.cjs \
            tests/audit-notes-render-no-dirty-regression.cjs \
            tests/audit-termination-provisions-regression.cjs \
            tests/audit-hub-personal-integrity-regression.cjs \
            tests/audit-projection-team-view-regression.cjs \
            tests/audit-assistant-query-regression.cjs \
            tests/audit-assistant-all-users-regression.cjs \
            tests/audit-payroll-provision-sort-total-regression.cjs \
            tests/audit-hub-search-period-regression.cjs \
            tests/audit-faction-manual-payment-regression.cjs \
            tests/audit-material-tools-regression.cjs \
            tests/audit-cutter-planner-regression.cjs \
            tests/audit-cut-organization-regression.cjs \
            tests/audit-assistant-voice-regression.cjs \
            tests/audit-assistant-orders-regression.cjs
          do
            echo "==> $test"
            node "$test"
          done
