name: HLGB Auditor Single Action v94.29
on:
  push:
    branches: [main]
    paths:
      - 'release-auditor-single-action-v9429.js'
      - 'release-cut-model-grade-adjust.js'
      - 'release-auditor-shell-v9382.js'
      - 'release-auditor-hub-reliability-v9315.js'
      - 'release-auditor-authority-map-v9374.js'
      - 'release-auditor-boot-analysis-v9381.js'
      - 'release-auditor-intelligence-v9396.js'
      - 'release-auditor-business-v9401.js'
      - 'tests/auditor-single-action-v9429-webkit.js'
      - '.github/workflows/auditor-single-action-v9429.yml'
  pull_request:
    branches: [main]
    paths:
      - 'release-auditor-single-action-v9429.js'
      - 'release-cut-model-grade-adjust.js'
      - 'release-auditor-shell-v9382.js'
      - 'release-auditor-hub-reliability-v9315.js'
      - 'release-auditor-authority-map-v9374.js'
      - 'release-auditor-boot-analysis-v9381.js'
      - 'release-auditor-intelligence-v9396.js'
      - 'release-auditor-business-v9401.js'
      - 'tests/auditor-single-action-v9429-webkit.js'
      - '.github/workflows/auditor-single-action-v9429.yml'
jobs:
  webkit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Sintaxe Auditor v94.29
        run: |
          node --check release-auditor-single-action-v9429.js
          node --check tests/auditor-single-action-v9429-webkit.js
      - name: Sem polling ou MutationObserver na trava v94.29
        run: |
          ! grep -q 'setInterval' release-auditor-single-action-v9429.js
          ! grep -q 'MutationObserver' release-auditor-single-action-v9429.js
      - name: Loader consolidado v94.29
        run: |
          grep -q 'release-auditor-single-action-v9429.js' release-cut-model-grade-adjust.js
          ! grep -q 'release-auditor-single-action-v9427.js' release-cut-model-grade-adjust.js
          ! grep -q 'release-auditor-daily-fidelity-v9428.js' release-cut-model-grade-adjust.js
      - name: Relatório diário fiel e histórico presentes
        run: |
          grep -q 'hlgb_auditor_daily_report_latest_v9429' release-auditor-single-action-v9429.js
          grep -q 'hlgb_auditor_learning_history_v9429' release-auditor-single-action-v9429.js
          grep -q 'saveBaseline:true' release-auditor-single-action-v9429.js
          grep -q 'pendingFrom' release-auditor-single-action-v9429.js
          grep -q 'operationSnapshot' release-auditor-single-action-v9429.js
      - name: Instalar Playwright WebKit
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 --no-save
          npx playwright install --with-deps webkit
      - name: Iniciar servidor local
        run: |
          python3 -m http.server 4173 >/tmp/hlgb-http.log 2>&1 &
          sleep 2
      - name: Auditor único gera diário fiel e aprende
        run: node tests/auditor-single-action-v9429-webkit.js