name: Aplicar HLGB v92.00
on:
  push:
    paths:
      - 'scripts/hlgb_v9200_notes_central.py'
      - '.github/workflows/hlgb-apply-v9200.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Aplicar v92.00
        run: python scripts/hlgb_v9200_notes_central.py
      - name: Validar v92.00
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          req=['HLGB_V9200_START','v92.00','openProjectionAcerto9200','Notas de entregas','paymentHistory']
          miss=[x for x in req if x not in s]
          if miss: raise SystemExit('Ausente: '+repr(miss))
          if s.count('<!-- HLGB_V9200_START -->')!=1: raise SystemExit('v92.00 duplicada')
          print('v92.00 OK')
          PY
      - name: Publicar v92.00
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Publicar HLGB v92.00 - central de notas e acertos" || exit 0
          git push
