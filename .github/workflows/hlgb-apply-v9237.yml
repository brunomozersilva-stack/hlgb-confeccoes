name: Aplicar HLGB v92.37
on:
  workflow_dispatch:
  push:
    paths:
      - scripts/hlgb_v9237_projection_client_sync.py
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Gerar pagina
        run: python scripts/hlgb_v9237_projection_client_sync.py
      - name: Publicar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app9237.html abrir.html
          git commit -m "Publicar HLGB v92.37" || exit 0
          git push
