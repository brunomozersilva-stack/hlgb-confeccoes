name: HLGB v93.92 Writeoff + Separation Integrity

on:
  push:
    branches:
      - fix/sync-permission-retry-all-users-20261019
  workflow_dispatch:

permissions:
  contents: read

jobs:
  syntax-and-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Sintaxe das correções operacionais
        run: |
          node --check release-production-operations-v9386-finalize.js
          node --check release-production-writeoff-integrity-v9391.js
          node --check release-separation-commit-v9319.js
          node --check release-wal-confirmed-replay-v9333.js
      - name: Instalar Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Iniciar preview local
        run: |
          python3 -m http.server 4173 >/tmp/hlgb-v9392-http.log 2>&1 &
          sleep 2
      - name: Validar baixa, separação e replay WAL
        run: |
          node <<'NODE'
          const { chromium } = require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage();
            await page.goto('http://127.0.0.1:4173/abrir.html',{waitUntil:'domcontentloaded',timeout:30000});
            await page.waitForFunction(()=>window.hlgbWriteoffIntegrity9391?.version==='93.91'&&window.hlgbSeparationCommit9319?.version==='93.92'&&window.hlgbWalConfirmedReplay9333?.version==='93.92',null,{timeout:30000});
            const result=await page.evaluate(async()=>{
              if(window.HLGB_BOOT_PATCH_9392?.version!=='93.92')throw new Error('bootstrap v93.92 ausente');
              if(!window.HLGB_OPERATIONAL_WRITEOFF_MODULE_REGISTERED?.modulesOk)throw new Error('operationalWriteoffs não registrado');
              window.db=window.db||{};
              const keep={};
              for(const k of ['operationalWriteoffs','orders','cuts','production','products','separations']){keep[k]=window.db[k];window.db[k]=[]}
              const core=window.hlgbOperationalVisibility9385;
              const oldModels=core.writeoffModels;
              core.writeoffModels=()=>[
                {id:'m1',clientName:'Cliente A',productId:'p1',productName:'Modelo 1',qty:10,status:'Em produção',sourceRefs:[],orderProductRefs:[{orderId:'o1',productId:'p1'}]},
                {id:'m2',clientName:'Cliente A',productId:'p2',productName:'Modelo 2',qty:20,status:'Em produção',sourceRefs:[],orderProductRefs:[{orderId:'o2',productId:'p2'}]}
              ];
              window.db.operationalWriteoffs=[{id:'old-random-id',sourceType:'model',productId:'p1',orderProductRefs:[{orderId:'o1',productId:'p1'}]}];
              let pending=window.hlgbWriteoffIntegrity9391.pendingModels();
              if(pending.length!==1||pending[0].id!=='m2')throw new Error('baixa remota não foi reconhecida');
              window.db.operationalWriteoffs=[{id:'legacy-ref',sourceType:'model',productId:'p1',sourceRefs:[{type:'order',id:'o1',orderId:'o1',productId:'p1'}]}];
              pending=window.hlgbWriteoffIntegrity9391.pendingModels();
              if(pending.length!==1||pending[0].id!=='m2')throw new Error('sourceRefs legado não foi reconhecido');
              window.db.operationalWriteoffs=[];
              localStorage.removeItem('hlgb_durable_wal_v1');
              const expectedId=window.hlgbWriteoffIntegrity9391.stableId({orderId:'o2',productId:'p2'});
              let host=document.getElementById('darBaixa9378Host');
              if(!host){host=document.createElement('div');host.id='darBaixa9378Host';document.body.appendChild(host)}
              window.hlgbWriteoffIntegrity9391.render();
              const box=host.querySelector('.hlgb9391-writeoff[value="m2"]');
              if(!box)throw new Error('candidato da baixa não renderizou');
              box.checked=true;
              const saves=[];
              window.hlgbRecordSaveWithRetry=async(module,id,row)=>{saves.push({module,id,row});return {applied:true,data:row}};
              window.cloudEnsureFreshSession=async()=>true;
              window.closeModal=()=>{};
              window.openModal=(t,h,cb)=>{window.__ciModal=Promise.resolve().then(cb)};
              await window.hlgbWriteoffSelected9385();
              await window.__ciModal;
              const wc=saves.filter(x=>x.module==='operationalWriteoffs');
              if(wc.length!==1||wc[0].id!==expectedId)throw new Error('autoridade final da baixa não usou ID estável: '+JSON.stringify(wc));
              if(window.hlgbWriteoffIntegrity9391.pendingModels().some(x=>x.id==='m2'))throw new Error('item baixado continuou pendente');

              const oldProjection=window.projectionItemsForOrder;
              const oldRecordId=window.hlgbRecordId;
              window.projectionItemsForOrder=()=>[{key:'p-sep',productId:'p-sep',name:'Modelo Sep',qty:5}];
              window.hlgbRecordId=(module,row)=>String(row?.id||'');
              window.db.orders=[{id:'o-sep',status:'Separação / compra de material',grade:[{productId:'p-sep',qty:5}]}];
              window.db.separations=[{id:'s-sep',orderId:'o-sep',done:true,partial:false,modelProgress:{'p-sep':{qty:5,total:5}}}];
              localStorage.setItem('hlgb_durable_wal_v1',JSON.stringify({version:1,entries:{x:{module:'separations',id:'s-sep',opId:'x',state:'pending'}}}));
              const sepCalls=[];
              window.hlgbRecordSaveWithRetry=async(module,id,row)=>{sepCalls.push({module,id,row:JSON.parse(JSON.stringify(row))});return {applied:true,data:row}};
              window.hlgb955ReconcileServer=async()=>true;
              window.localSaveOnly=()=>true;
              window.setCloudStatus=()=>{};
              const recovered=await window.hlgbSeparationCommit9319.apply('o-sep','p-sep',false);
              if(!recovered?.recovered||recovered?.complete!==true)throw new Error('recuperação da separação falhou: '+JSON.stringify(recovered));
              const savedOrder=sepCalls.find(x=>x.module==='orders')?.row;
              if(!savedOrder?.materialSeparationCompletedAt||savedOrder.status!=='Aguardando corte')throw new Error('pedido não foi concluído após separação confirmada');
              window.projectionItemsForOrder=oldProjection;
              window.hlgbRecordId=oldRecordId;

              const app=document.getElementById('appShell'),login=document.getElementById('loginScreen');
              if(app)app.style.display='block';if(login)login.style.display='none';
              localStorage.removeItem('hlgb_wal_permission_quarantine_v1');
              localStorage.setItem('hlgb_durable_wal_v1',JSON.stringify({version:1,entries:{perm:{module:'noteQueue',id:'n1',data:{id:'n1'},opId:'perm-op',state:'pending'}}}));
              let walCalls=0;
              window.hlgbRecordSaveWithRetry=async()=>{walCalls++;const e=new Error('Usuário sem permissão para alterar o módulo noteQueue');e.code='P0001';throw e};
              await window.hlgbWalConfirmedReplay9333.run('ci-p0001',true);
              const walPerm=JSON.parse(localStorage.getItem('hlgb_durable_wal_v1')||'{"entries":{}}');
              const quarantine=JSON.parse(localStorage.getItem('hlgb_wal_permission_quarantine_v1')||'[]');
              if(walPerm.entries?.perm||!quarantine.some(x=>x.opId==='perm-op'&&x.state==='blocked-permission')||walCalls!==1)throw new Error('P0001 não foi isolado corretamente');

              localStorage.removeItem('hlgb_wal_permission_quarantine_v1');
              localStorage.setItem('hlgb_durable_wal_v1',JSON.stringify({version:1,entries:{timeout:{module:'orders',id:'o-timeout',data:{id:'o-timeout'},opId:'timeout-op',state:'pending'}}}));
              walCalls=0;
              window.hlgbRecordSaveWithRetry=async()=>{walCalls++;const e=new Error('canceling statement due to statement timeout');e.code='57014';throw e};
              const before=Date.now();
              await window.hlgbWalConfirmedReplay9333.run('ci-57014',true);
              const timeoutOp=JSON.parse(localStorage.getItem('hlgb_durable_wal_v1')||'{"entries":{}}').entries?.timeout;
              if(!timeoutOp||timeoutOp.state!=='pending'||Number(timeoutOp.retryDelayMs)<60000||Date.parse(timeoutOp.nextAttemptAt)<before+59000||walCalls!==1)throw new Error('backoff 57014 incorreto');
              const count=walCalls;
              await window.hlgbWalConfirmedReplay9333.run('ci-57014-not-due',false);
              if(walCalls!==count)throw new Error('57014 reenviado antes do backoff');

              core.writeoffModels=oldModels;
              for(const k of Object.keys(keep))window.db[k]=keep[k];
              localStorage.removeItem('hlgb_durable_wal_v1');
              localStorage.removeItem('hlgb_wal_permission_quarantine_v1');
              return {writeoff:'ok',separation:'ok',permission:'ok',timeout:'ok'};
            });
            console.log(JSON.stringify(result));
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
