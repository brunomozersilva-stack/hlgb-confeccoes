name: Aplicar HLGB v91.81 fast login
on:
  push:
    branches: [main]
    paths:
      - 'scripts/hlgb_v9181_fast_login.py'
      - '.github/workflows/hlgb-apply-v9181.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Aplicar patch v91.81
        run: python scripts/hlgb_v9181_fast_login.py
      - name: Validar correção
        run: |
          grep -q 'v91.81' index.html
          grep -q 'hlgbFastBootstrap9181' index.html
          grep -q 'select=id,versao,atualizado_em' index.html
      - name: Publicar
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git diff --quiet; then
            echo 'Nenhuma alteração necessária'
          else
            git add index.html
            git commit -m 'Publicar HLGB v91.81 - login leve por registros'
            git push
          fi
