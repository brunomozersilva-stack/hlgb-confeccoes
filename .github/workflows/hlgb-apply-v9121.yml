name: HLGB v91.21 projection delivery tracking
on:
  push:
    paths:
      - 'scripts/hlgb_v9121_projection_delivery_tracking.py'
      - '.github/workflows/hlgb-apply-v9121.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply v91.21 projection delivery tracking
        run: python3 scripts/hlgb_v9121_projection_delivery_tracking.py
      - name: Validate JavaScript and delivery tracking
        run: |
          python3 - <<'PY'
          import re,pathlib,subprocess
          s=pathlib.Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.S|re.I)
          for i,body in enumerate(scripts):
              f=pathlib.Path(f'/tmp/hlgb-v9121-{i}.js')
              f.write_text(body,encoding='utf-8')
              subprocess.run(['node','--check',str(f)],check=True)
          assert 'v91.21 Multiusuário' in s
          assert 'projectionRemainingTable' in s
          assert 'projectionDeliveredTable' in s
          assert 'Mudar data do restante' in s
          assert 'projectionDeliveredRows' in s
          assert 'Peças entregues no período' in s
          assert 'deliveryHistory' in s
          print('validated',len(scripts),'script blocks')
          PY
      - name: Commit validated index
        run: |
          if git diff --quiet -- index.html; then
            echo 'No index changes required'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Add projection delivered and remaining tracking v91.21'
          git push origin main
