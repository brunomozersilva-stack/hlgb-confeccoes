name: HLGB Comercial - Corte Conjunto Discovery Mobile v96.29
on:
  pull_request:
    paths:
      - 'hlgb-modules/producao/joint-cut-*'
      - 'tests/joint-cut-v9629-*'
      - 'tests/hlgb-joint-cut-discovery-v9629.cjs'
      - '.github/workflows/hlgb-joint-cut-discovery-v9629.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: node tests/hlgb-joint-cut-core-v9628.cjs && node tests/hlgb-joint-cut-discovery-v9629.cjs
  browser:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm install --no-save playwright@1.55.0 && npx playwright install --with-deps ${{ matrix.browser }}
      - run: |
          python3 -m http.server 4173 >/tmp/joint-preview.log 2>&1 &
          sleep 2
      - env:
          HLGB_BROWSER: ${{ matrix.browser }}
        run: node tests/joint-cut-v9629-browser.cjs
