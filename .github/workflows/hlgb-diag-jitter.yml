name: Diagnosticar tremida visual HLGB
on:
  push:
    paths:
      - 'scripts/hlgb_diag_jitter.py'
      - '.github/workflows/hlgb-diag-jitter.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Examinar atualizacoes visuais
        run: python scripts/hlgb_diag_jitter.py
      - name: Salvar diagnostico
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add debug/v9184-jitter.txt debug/v9184-jitter-detail.txt
          git commit -m "Diagnostico tremida visual [skip ci]" || true
          git push || true
