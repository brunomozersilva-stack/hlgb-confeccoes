name: HLGB Evolucao - Laboratorio isolado
on:
  push:
    branches:
      - feature/evolucao-laboratorio-isolado-v1-20261114
    paths:
      - 'evolucao-lab/**'
      - '.github/workflows/evolucao-lab-isolado.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  isolation:
    name: Inventory and safety contract
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Verify no existing HLGB files are changed
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          BASE="$(git merge-base HEAD origin/main)"
          git diff --name-status "$BASE" HEAD | tee /tmp/hlgb-evolucao-files.txt
          if awk -F '\t' '($1 != "A") || ($2 !~ /^evolucao-lab\// && $2 !~ /^\.github\/workflows\/evolucao-[a-z0-9-]+\.yml$/) {bad=1} END{exit !bad}' /tmp/hlgb-evolucao-files.txt; then
            echo "::error::Arquivos atuais do HLGB foram alterados — isolamento violado."
            exit 1
          fi
          echo "Apenas novos arquivos em evolucao-lab/ e workflows evolucao-*.yml. Produção preservada."
      - name: Static contract, source references and mobile structure
        run: |
          node --test evolucao-lab/tests/standalone-contract.cjs
          node --test evolucao-lab/tests/auditoria-paridade-gate.cjs
          # Testes do legado: validar o comportamento que NÃO pode desaparecer.
          node --test tests/audit-cut-grade-matrix-v9421.cjs
          node --test tests/audit-cutter-planner-regression.cjs
          node --test tests/audit-cut-model-grade-adjust-regression.cjs
          node --test tests/audit-cut-material-usage-regression.cjs
          node --test tests/cutter-sheet-materials-v9523.cjs
          node --test tests/cut-weight-after-finish-v9579.cjs
          node --test evolucao-lab/tests/entrada-primeiros-testes.cjs
          node --test evolucao-lab/tests/fluxos-contract.cjs
          node --test evolucao-lab/tests/preservacao-contract.cjs
          node --test evolucao-lab/tests/baseline-legado.cjs
          node --test evolucao-lab/tests/paridade-critica-contract.cjs
          node --test evolucao-lab/tests/motor-calculos.cjs
          node --test evolucao-lab/tests/transacao-memoria.cjs
  browser:
    name: Mobile browsers (${{ matrix.browser }})
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Install browser test dependency
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps ${{ matrix.browser }}
      - name: Validate offline standalone on mobile and desktop
        env:
          HLGB_BROWSER: ${{ matrix.browser }}
          HLGB_SCREENSHOT_DIR: /tmp/hlgb-evolucao-shots
        run: |
          node evolucao-lab/tests/visual-mobile.cjs
          node evolucao-lab/tests/fluxos-mobile.cjs
          node evolucao-lab/tests/preservacao-mobile.cjs
          node evolucao-lab/tests/paridade-critica-mobile.cjs
          node evolucao-lab/tests/acertos-simulador-mobile.cjs
          node evolucao-lab/tests/transacoes-mobile.cjs
      - name: Keep illustrative screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: laboratorio-isolado-${{ matrix.browser }}
          path: /tmp/hlgb-evolucao-shots/*.png
          if-no-files-found: ignore
