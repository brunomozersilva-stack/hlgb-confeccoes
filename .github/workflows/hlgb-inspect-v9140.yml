name: HLGB inspect v91.40 source

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/hlgb-inspect-v9140.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Extract relevant source blocks
        run: |
          python3 - <<'PY'
          from pathlib import Path
          text=Path('index.html').read_text(encoding='utf-8')
          lines=text.splitlines()
          out=Path('scripts/v9140_inspect'); out.mkdir(parents=True,exist_ok=True)
          def around(term,before=80,after=220):
            hits=[i for i,l in enumerate(lines) if term.lower() in l.lower()]
            buf=[]
            for i in hits[:5]:
              a=max(0,i-before); b=min(len(lines),i+after)
              buf.append(f'=== {term} @ line {i+1} ===\n'+'\n'.join(f'{n+1:05d}: {lines[n]}' for n in range(a,b)))
            return '\n\n'.join(buf) if buf else f'NOT FOUND: {term}\n'
          terms={
            'finalize_selected':'function finalizeSelectedProjection',
            'faction_rpc_call':'hlgb_register_faction_delivery_v9135',
            'faction_table_logic':'factionDeliveryTable935',
            'goal_week':'weekStart',
            'projection_remaining':'function renderProjectionDeliveryTracking',
            'projection_delivered':'projectionDeliveredRows',
            'save_row_cloud':'hlgbRecordSaveWithRetry'
          }
          for fn,term in terms.items(): Path(out/f'{fn}.txt').write_text(around(term),encoding='utf-8')
          PY
      - name: Commit inspection snippets
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/v9140_inspect
          git commit -m 'Refresh temporary v91.40 source snippets'
          git push origin main
