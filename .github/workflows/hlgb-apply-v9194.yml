name: Aplicar HLGB v91.94 deduplicação e troca de destino
on:
  push:
    paths:
      - 'scripts/hlgb_v9194_capacity_dedup_transfer.py'
      - '.github/workflows/hlgb-apply-v9194.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Aplicar e validar v91.94
        run: python scripts/hlgb_v9194_capacity_dedup_transfer.py
      - name: Publicar v91.94
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Publicar HLGB v91.94 - corrigir duplicações e trocar destino' || exit 0
          git push
