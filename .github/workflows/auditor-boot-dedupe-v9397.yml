name: HLGB Auditor Boot + Dedupe v94.45

on:
  pull_request:
  push:
    branches:
      - main
      - fix/boot-preauth-cut-sync-20261023
      - diagnostic/post-hotfix-save-depth-orphans-20261024
      - fix/boot-analysis-v9445

jobs:
  boot-dedupe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Testar autoridade de boot pós-hotfix
        run: node tests/auditor-boot-dedupe-v9397.js
      - name: Classificar restauração e duplicidade real v94.45
        run: node tests/auditor-boot-analysis-v9445.js
      - name: Verificar sintaxe
        run: |
          node --check release-cut-view.js
          node --check release-sync-guard-v9306.js
          node --check release-auditor-call-trace-v9380.js
          node --check release-auditor-boot-analysis-v9381.js
          node --check release-auditor-intelligence-v9396.js
          node --check release-payroll-month-wal-v9334.js
          node --check release-payroll-snapshot-watch-v9354.js
          node --check release-payroll-reliable-save-guard-v9344.js
          node --check release-payroll-wal-race-v9346.js
          node --check tests/auditor-boot-dedupe-v9397.js
          node --check tests/auditor-boot-analysis-v9445.js
